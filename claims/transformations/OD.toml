witness = "the reader's share of a perturbation falls when the flow's scale crosses the reader's budget, after the gradient has grown and on regular flows too; shock formation is one way for the flow's scale to cross it, not the only one, and a budgeted reader sees it later than the gradient does; the classical extrapolation of the inverse gradient is exact for inviscid Burgers and nothing leads it"
