# Transformation registry for the OD track, observational discovery. Opened 2026-09-09 with the
# families the gates declare; tests are entered when a gate's verdict is committed.

[registry]
track = "OD"
title = "Observational discovery, from the read operator to laws that survive observers"
commit = "D1, D2, D2v2, D2v3, D2v4, D2v5, D2v6, D3 and D3v2 recorded 2026-09-09"
x = "state spaces of declared consumers: synthetic linear and nonlinear consumers, linear systems observed through a window, embedding corpora, Lorenz systems, discretized Burgers fields, candidate clouds of the program's own searches"
y = "what the observer reads: outputs at a budget (whether two outputs are within B), k-occurrence counts, observational lengths of perturbations, diagnostics of a field"
equivalence = "declared per gate before its seal: medians relative to chance (D1), a registered tolerance on a frozen law (D2), tolerance on exponents and horizons (D3), a registered separation (D4), convergence in N and collapse in B (D5)"
complexity_ordering = "changes of observer within a declared family first, then changes of data world, then changes of scale, then changes of dynamical system"

[[transformation]]
id = "OD:observer-family"
family = "change of observer within a declared family: read operators of declared spectrum, coordinate subsets, coarsenings, and learned consumers' recovered read operators"
parameters = "declared per gate"
closure = "none"
rank = 1
declared = "2026-09-09"

[[transformation]]
id = "OD:budget"
family = "change of the observation budget B at fixed consumer and output metric"
parameters = "a ladder declared per gate"
closure = "none, a one-parameter family"
rank = 2
declared = "2026-09-09"

[[transformation]]
id = "OD:world-transfer"
family = "transfer of a law frozen on synthetic worlds to embedding corpora, ANN corpora, and dynamical state spaces without retuning"
parameters = "the worlds declared per gate"
closure = "none"
rank = 3
declared = "2026-09-09"

[[transformation]]
id = "OD:simulation-resolution"
family = "change of the simulation resolution N at fixed observation budget B, for dynamical systems"
parameters = "a ladder declared per gate"
closure = "none"
rank = 4
declared = "2026-09-09"

[[test]]
transformation = "OD:budget"
claim = "a single-direction probe along coordinate e_i at size rho is reported identifiable at budget B exactly when P_ii > B^2 / rho^2, and a ladder of sizes brackets P_ii between B^2 / r_hi^2 and B^2 / r_lo^2 (article Theorem 2(b), Corollary 3)"
entries = ["read-operator", "budget", "geometric-evaluation-theory"]
outcome = "survived"
record = "experiments/DISCOVERY-TRACK.md, D1 record; experiments/OD/D1/grade.json axis"
witness = "exact in every evaluator of all fifteen World A cells (three worlds, five budgets, 20 evaluators each) on the run seed, as in every pilot"
absorbed_by = ""
revision = "none"

[[test]]
transformation = "OD:observer-family"
claim = "mixed probes at one radius, where the sphere crosses the ellipsoid substantially, recover the read operator up to the pencil s P + (1 - s)(B^2 / rho^2) I, below-threshold eigenvalues included, with Frobenius, above-threshold and below-threshold medians at most 0.30 of chance at 960 queries"
entries = ["read-operator", "budget", "geometric-evaluation-theory"]
outcome = "boundary"
record = "experiments/DISCOVERY-TRACK.md, D1 record; experiments/OD/D1/grade.json mixed"
boundary = "held in five of six well-crossed cells (Frobenius 0.045 to 0.111 of chance, above 0.055 to 0.111, below 0.037 to 0.172); in the positive definite world at B = 1 the Frobenius ratio 0.198 and the below ratio 0.068 held and the above ratio was 0.303 against 0.30"
witness = "the tolerance was fixed as the pilot's own maximum in that same cell (0.299) rounded up to two decimals, so it carried no margin for a fresh seed; the estimator, the crossing and the recovery are unchanged between pilot and run"
absorbed_by = "declaration"
revision = "none for the claim; for later gates, fix a tolerance as a declared multiple of the pilot's maximum"

[[test]]
transformation = "OD:observer-family"
claim = "in a positive definite world the analytic centre returns the pencil's end P* = s* P + (1 - s*) c I, s* = c / (c - lambda_min), so the estimate is nearer P* than P (article Corollary 4)"
entries = ["read-operator", "geometric-evaluation-theory"]
outcome = "survived"
record = "experiments/OD/D1/grade.json, B4; experiments/OD/D1/pencil_probe.json"
witness = "nearer P* in 20 of 20 evaluators at B = 1 and at B = 1.5 on the run seed (Frobenius 0.223 against P, 0.181 against P*; 0.117 against 0.102), 20 of 20 in the third pilot, 6 of 6 cells in the pre-seal probe; in the kernel worlds the pencil's end is P itself and the two errors coincide"
absorbed_by = ""
revision = "none"

[[test]]
transformation = "OD:budget"
claim = "where lambda_min rho^2 < B^2 < lambda_max rho^2 fails the oracle is constant in every direction; where it holds it need not be non-constant in finite samples"
entries = ["read-operator", "budget"]
outcome = "survived"
record = "experiments/OD/D1/grade.json, B2 entries"
witness = "constant in all 20 evaluators at n = 5, B = 2 (no crossing, B^2 = lambda_max rho^2) and at n = 8 positive definite, B = 0.25 (a crossing by theory so thin that 960 random directions in each of 20 evaluators all answered distinguishable)"
absorbed_by = ""
revision = "none"

[[test]]
transformation = "OD:observer-family"
claim = "for a positive definite read operator with spectrum in [a, b] the observational and classical window exponents differ by at most log(b / a) / (2 (T - t0)) (article Proposition 1, lean/GET/Horizon.lean)"
entries = ["read-operator", "budget", "observer"]
outcome = "survived"
record = "experiments/DISCOVERY-TRACK.md, D3 record; experiments/OD/D3/grade.json exact E1"
witness = "3,200 of 3,200 windows on Lorenz-63 and Lorenz-96 under an anisotropic observer with b / a = 16 and 4; the worst ratio to the bound 0.96 in the pilot, so the bound is nearly attained"
absorbed_by = ""
revision = "none"

[[test]]
transformation = "OD:observer-family"
claim = "an observer with a kernel reads a smaller exponent than the classical one when an unread direction grows faster (World K, mu = 2), the same when it grows slower (mu = 1/2), and a kernel-started perturbation reads a transiently larger exponent that converges"
entries = ["read-operator", "observer", "nuisance"]
outcome = "survived"
record = "experiments/OD/D3/grade.json K1, K1c, K2, K3"
witness = "gap 0.82 to 1.25 in 64 of 64 starts at mu = 2 with the classical exponent at its predicted 1.965; control equal within 0.0072; kernel starts larger on the first window in 83 to 98 percent of starts with median excess +1.5 to +3.5 falling to 0.09 to 0.17 by T = 20; generic starts under every projection within 0.035 of the classical exponent at T = 20"
absorbed_by = ""
revision = "none"

[[test]]
transformation = "OD:budget"
claim = "the horizon T_O(B) is non-decreasing in B, lies between the Euclidean horizons at B / sqrt(b) and B / sqrt(a) for a positive definite observer, and is never earlier than the Euclidean horizon for a projection"
entries = ["budget", "read-operator"]
outcome = "survived"
record = "experiments/OD/D3/grade.json exact H1"
witness = "8,960 of 8,960 checks"
absorbed_by = ""
revision = "none"

[[test]]
transformation = "OD:observer-family"
claim = "at fixed budget the horizon depends on the observer where no symmetry of the flow relates the observers (Lorenz-63, x against z) and not where one does (Lorenz-96, one block of ten sites against the next)"
entries = ["observer", "budget"]
outcome = "boundary"
record = "experiments/DISCOVERY-TRACK.md, D3 record; experiments/OD/D3/grade.json H2"
boundary = "x later than z for the same perturbation in 77, 78, 70 and 64 percent of pairs at B = 10, 100, 1000, 10000 with sign-test p 0.0000, 0.0000, 0.0022 and 0.033 against the registered 0.01 at every budget; the Lorenz-96 control at p 0.11 to 0.86"
witness = "the paired effect weakens as the budget grows and the perturbation aligns with the leading direction for longer, so a fixed per-budget level over the ladder was the wrong registration, not the wrong claim; the pilot at the same budget had 77 percent and p below 0.0001"
absorbed_by = "declaration"
revision = "none for the claim; for later gates, declare the level per budget or grade the ladder as a whole"

[[test]]
transformation = "OD:world-transfer"
claim = "the hubness law frozen on Gaussian clouds, skew = -0.026 + 0.421 / cv_d + 0.817 sqrt(d_eff) / k, predicts hubness on distributions it was not discovered on, on real embeddings and at larger N, within declared multiples of its pilot error"
entries = ["hubness", "observer", "read-operator"]
outcome = "failed"
record = "experiments/DISCOVERY-TRACK.md, D2 record; experiments/OD/D2/grade.json"
witness = "fresh seeds of the discovery family replicate (0.93 against 1.19) but uniform balls (error up to 4.5, the law over-predicting by up to 2.8), Student t (under-predicting by up to 2.4) and Wikipedia embeddings (5.3, measured skewness at most 1.1 at effective dimension 156 where the law says 10) fail; the nominal-dimension competitor is worse pooled (14.8 against 2.9) and better on the unseen synthetic group alone (1.74 against 2.45)"
absorbed_by = "none"
revision = "not proposed here: a successor would need a shape variable that separates tails and roundness from the spectrum and a discovery set of more than one family"

[[test]]
transformation = "OD:observer-family"
claim = "a change of the observer's spectrum changes the hub sets more than a change of its orientation at a fixed spectrum (hub-set Jaccard overlap across orientations above that across spectra)"
entries = ["hubness", "observer"]
outcome = "survived"
record = "experiments/OD/D2/grade.json P1"
witness = "in all 26 worlds, Gaussian, uniform, heavy-tailed, mixture, Wikipedia and SIFT, at N from 2000 to 16000: overlap 0.19 to 0.45 across orientations against 0.03 to 0.29 across spectra"
absorbed_by = ""
revision = "none"

[[test]]
transformation = "OD:observer-family"
claim = "the cross-observer hubness matrix has effective rank at most 0.48 of its column-shuffled null"
entries = ["hubness", "observer"]
outcome = "boundary"
record = "experiments/OD/D2/grade.json X1"
boundary = "ratios 0.10 to 0.30 in 23 of 26 worlds; 0.44 and 0.59 for the 64- and 128-dimensional uniform balls and 0.42 for the Wikipedia scale cell, the least concentrated clouds"
witness = "the limit was fixed from Gaussian pilots (largest ratio 0.31 times 1.5); the latent structure is present everywhere and weakest where the cloud is roundest"
absorbed_by = "declaration"
revision = "none"

[[test]]
transformation = "OD:budget"
claim = "coarsening the observer's resolution changes hub polarity monotonically in the resolution, and a resolution of a tenth of the nearest-neighbour distance changes little (exploratory, reported)"
entries = ["hubness", "budget"]
outcome = "boundary"
record = "experiments/OD/D2/grade.json B1"
boundary = "monotone in all four sweeps; at a tenth of the neighbour distance 12 percent of Gaussian points and 6 percent of Wikipedia points change polarity under the isotropic observer, at a quarter 24 and 79 percent, against 4 to 7 percent under the anisotropic observer"
witness = "the finite budget is a first-order effect on real embeddings under an isotropic reader; not graded, as declared"
absorbed_by = "declaration"
revision = "none"

[[test]]
transformation = "OD:observer-family"
claim = "an observer's horizon offset from the full reader at budget B equals the first-passage time Delta_O(B) = E_s[inf{t >= s : L(t) - L(s) + g_O(t) >= log B} - inf{t >= s : L(t) - L(s) >= log B}] of its read-fraction process along the leading Lyapunov direction, computed on an independent long trajectory (the horizon offset law)"
entries = ["observer", "read-operator", "budget"]
outcome = "survived"
record = "experiments/DISCOVERY-TRACK.md, D3v2 record; experiments/OD/D3v2/grade.json"
witness = "all 22 cells (eleven observers of Lorenz-63 and Lorenz-96 at B = 1000 and 10000) within 0.259 time units, largest error 0.149; signs and the Lorenz-63 order exact; the symmetric site blocks of Lorenz-96 equal within 0.07; anisotropic offsets inside the D3 bracket; the constant-fraction approximation -E[log f_O] / lambda_1, refuted by the first probe, wrong by 0.09 to 1.0 on the same rows"
absorbed_by = ""
revision = "the law replaced the constant-fraction statement before any pilot; recorded in the registration's Section 7"

[[test]]
transformation = "OD:simulation-resolution"
claim = "the horizon offset law holds across a change of dynamical system, from Lorenz-63 (exponent 0.906) to Lorenz-96 at N = 40 (exponent 1.699)"
entries = ["observer", "budget"]
outcome = "survived"
record = "experiments/OD/D3v2/grade.json O1 by world"
witness = "Lorenz-96 errors 0.001 to 0.138 over four observers and two budgets, Lorenz-63 0.014 to 0.149 over seven"
absorbed_by = ""
revision = "none"

[[test]]
transformation = "OD:world-transfer"
claim = "the hubness law frozen on seven synthetic families, log(1 + skew) = 2.811 + 0.0047 d_ent - 0.0928 / cv_d - 2.461 sqrt(top_share), predicts hubness on families it was not discovered on, on real embeddings and at larger N within declared multiples of its pilot error, and beats the nominal-dimension formula and the frozen D2 law"
entries = ["hubness", "observer", "read-operator"]
outcome = "boundary"
record = "experiments/DISCOVERY-TRACK.md, D2v2 record; experiments/OD/D2v2/grade.json"
boundary = "survives on all eight unseen synthetic families (0.37 to 1.41 against 1.84), on SIFT base and queries (1.27, 0.75) and within 3 REF on Wikipedia (2.54, 2.37 against 2.77); misses the heavy-tail and Wikipedia scale cells (2.26, 2.55 against 1.84) and loses to a constant in k and N on the Wikipedia slices (1.41, 1.29); beats the D2 law in 14 of 16 transfer worlds and both competitors pooled (1.45 against 2.20 and 2.85)"
witness = "Wikipedia embeddings have TwoNN intrinsic dimension 8 to 20 at entropy dimension up to 320 and skewness at most 1.5; the intrinsic dimension was in the declared pool and the search dropped it, since on full-dimensional discovery families it duplicates the spectral dimension"
absorbed_by = "declaration"
revision = "D2v3 would put clouds on embedded manifolds into the discovery families so that the intrinsic dimension becomes informative; not registered here"

[[test]]
transformation = "OD:observer-family"
claim = "hub sets overlap more across orientations than across spectra, and the cross-observer matrix is low-rank against its shuffled null, in every family, corpus and size"
entries = ["hubness", "observer"]
outcome = "survived"
record = "experiments/OD/D2v2/grade.json P1, X1"
witness = "44 of 44 worlds for both: overlap gap at least 0.08; rank ratios 0.09 to 0.69, the largest on the sphere and the balls"
absorbed_by = ""
revision = "none"

[[test]]
transformation = "OD:world-transfer"
claim = "the hubness law frozen on eleven families including four manifold families, log(1 + skew) = -1.463 - 0.013 / cv_knn + 0.748 log(id_twonn) + 0.069 sqrt(d_eff), predicts hubness on unseen families and manifolds, on real embeddings and at larger N within declared multiples of its pilot error, and beats the nominal formula and the frozen D2 and D2v2 laws"
entries = ["hubness", "observer", "read-operator"]
outcome = "boundary"
record = "experiments/DISCOVERY-TRACK.md, D2v3 record; experiments/OD/D2v3/grade.json"
boundary = "real corpora within REF for the first time (Wikipedia 1.00 and 0.21, SIFT 0.44 and 0.37 against 2.24); eight of ten unseen worlds within 1.49 and the group pooled at 1.18 against 1.12; Laplace (1.93) and the 256-dimensional cube (2.69) outside; heavy tails at N = 16000 at 1.91 against 1.49; beats all three competitors pooled (1.05 against 3.58, 2.77, 1.69) and within every group"
witness = "the intrinsic dimension became the law's main term once the discovery set held clouds whose intrinsic dimension sits below their spectral one; the misses are where TwoNN leaves its calibrated regime (125 on a 4,000-point cube in 256 dimensions) or where tails outrun every training family"
absorbed_by = "declaration"
revision = "a D2v4 would bound the intrinsic-dimension term or add full-dimensional worlds at d = 256 and heavier tails to the discovery set; not registered here"

[[test]]
transformation = "OD:world-transfer"
claim = "across three registrations with one declared feature family and one search, the law discovered depends on the discovery set alone: Gaussian clouds give a concentration law, seven full-dimensional families give a shape-blind spectral law, manifold worlds give an intrinsic-dimension law that fits real embeddings"
entries = ["hubness", "observer"]
outcome = "survived"
record = "experiments/OD/D2/law.json, experiments/OD/D2v2/law.json, experiments/OD/D2v3/law.json"
witness = "the frozen laws of D2, D2v2 and D2v3 and their errors on the same real corpora: 5.3 and 4.1 (D2), 2.5 and 2.3 (D2v2), 1.0 and 0.2 (D2v3) on the two Wikipedia slices of each run"
absorbed_by = ""
revision = "none"

[[test]]
transformation = "OD:world-transfer"
claim = "the hubness law frozen with full-dimensional clouds at d = 256 and heavy tails in the discovery set, log(1 + skew) = -1.094 + 0.169 cv_r sqrt(d_eff) - 0.032 log(d_nom) log(k) + 0.701 log(id_twonn), predicts hubness at d = 512, on heavier tails, on fresh real slices and at larger N, and beats the nominal formula and the frozen D2, D2v2 and D2v3 laws"
entries = ["hubness", "observer", "read-operator"]
outcome = "boundary"
record = "experiments/DISCOVERY-TRACK.md, D2v4 record; experiments/OD/D2v4/grade.json"
boundary = "clouds at d = 512 within the limit (1.30, 1.79 against 2.13); real slices 0.16 to 0.64 against 3.20; Student t with 3 degrees at N = 16000 at 0.47; ten of twelve unseen worlds within 2.13; Student t with 4 degrees at d = 256 (3.52) and Laplace at d = 192 (4.75) outside, the unseen group pooled at 1.95 against 1.60; Student t with 5 degrees at N = 16000 at 2.19 against 2.13; beats all four competitors pooled (1.62 against 3.18, 3.47, 2.38, 1.77) and within every group"
witness = "what the discovery set holds, the law extrapolates from: d = 256 carried to d = 512, t with 3 degrees carried to N = 16000; what it lacks, heavier tails at higher dimension, no law of this feature family reaches, since the family's only tail variable is a coordinate kurtosis the observer rescales and the search never chose"
absorbed_by = "declaration"
revision = "a D2v5 would add a tail variable measured on the neighbour distances, or place heavy tails at the transfer dimensions in the discovery set; not registered here"

[[test]]
transformation = "OD:world-transfer"
claim = "with four scale-free tail variables measured on the neighbour distances in the feature pool and heavy tails at d = 128 and 192 in the discovery set, the search chooses a tail variable and the frozen law predicts hubness on heavier tails at d = 192 and 256, on fresh real slices and at larger N, beating the nominal formula and the frozen D2, D2v2, D2v3 and D2v4 laws"
entries = ["hubness", "observer", "read-operator"]
outcome = "boundary"
record = "experiments/DISCOVERY-TRACK.md, D2v5 record; experiments/OD/D2v5/grade.json; experiments/OD/D2v5/tail_check.json"
boundary = "the search declined every tail variable (best model with one 0.75 held-out against 0.71, worse on five of eight heavy-tailed pilot worlds) and froze skew = -2.80 - 0.51 / cv_d + 1.19 log(id_twonn) + 1.07 sqrt(d_eff); on the run the law halves D2v4's misses (t with 4 degrees at d = 256 2.28, Laplace at d = 192 2.36 against 3.52, 4.75) but stays outside 1.76 there and on t with 2.5 degrees at d = 128 (2.30) and the log-normal at d = 192 (3.24); real slices 0.19 to 0.70 against 2.64; d = 512 clouds 1.75, 1.69; heavy tails at N = 12000 to 16000 outside (2.49 to 3.13); beats all five competitors pooled (1.55 against 12.01, 4.15, 2.17, 2.25, 1.99) and within the unseen and scale groups, the D2v3 law edging it on the real slices (0.47 against 0.50)"
witness = "the tail of the neighbour distances, measured scale-free, rises with the observer's exponent in every world, so it carries the reader as much as the family and adds nothing to a linear law that already holds the concentration and dimension terms; the family's largest errors sit where the target skewness exceeds 12, where a linear law in either transform is the wrong shape"
absorbed_by = "declaration"
revision = "D2v6 registers the second repair named by D2v4's record, heavy tails placed at the transfer dimensions in the discovery set, bracketing the unseen heavy-tailed worlds"

[[test]]
transformation = "OD:world-transfer"
claim = "with heavy-tailed clouds placed in the discovery set at the transfer dimensions (Student t with 3 and 5 degrees at d = 256, Laplace at d = 192 and 256) bracketing the unseen worlds, the frozen law predicts hubness on the bracketed heavy tails, on D2v5's other unseen families, on fresh real slices and at larger N, and beats the nominal formula and the frozen D2 to D2v5 laws"
entries = ["hubness", "observer", "read-operator"]
outcome = "failed"
record = "experiments/DISCOVERY-TRACK.md, D2v6 record; experiments/OD/D2v6/grade.json"
boundary = "every bracketed heavy-tailed unseen world inside the limit and below every competitor (t with 4 degrees at d = 256 1.64, Laplace at d = 224 1.18, t with 6 degrees at d = 192 1.04, t with 2.5 degrees at d = 128 0.74, log-normal at d = 192 0.68); real slices 0.21 to 0.63; the d = 512 clouds lost (cube 4.65, Gaussian 2.64 against 2.91); t with 4 degrees at d = 128 and N = 12000 at 3.31; pooled over the transfer groups the frozen D2v5 law at 1.45 beats the law's 1.51, the fail clause"
witness = "coverage moves the family's error between the heavy tails at d = 256 and the light-tailed clouds at d = 512 and does not remove it; the pilot recorded before the run that the family, not the set, is the limit, and the run confirmed it; the largest errors of every law of the track sit where the hubness skewness exceeds 12"
absorbed_by = "declaration"
revision = "not another discovery set: a D2v7 changes the target (Poisson hub excess or tail share instead of skewness) or the functional shape, and is a new family and a new registration"
