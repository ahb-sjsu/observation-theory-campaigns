[[test]]
transformation = "OD:world-transfer"
claim = "with four scale-free tail variables measured on the neighbour distances in the feature pool and heavy tails at d = 128 and 192 in the discovery set, the search chooses a tail variable and the frozen law predicts hubness on heavier tails at d = 192 and 256, on fresh real slices and at larger N, beating the nominal formula and the frozen D2, D2v2, D2v3 and D2v4 laws"
