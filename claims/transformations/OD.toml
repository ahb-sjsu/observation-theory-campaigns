[[test]]
transformation = "OD:observer-choice"
claim = "for a linear system with candidate sensors, the placement that reaches a required count of directions identifiable at budget B (Theorem 2's count on the exact window Gramian) with the fewest sensors is found by a greedy selection on the Gramian's spectrum, never needs more sensors than the energy ranking or a random ordering, is within a factor of the exhaustive optimum, and leaves a longer forecast horizon than the energy and random placements at the same count"
entries = ["observer", "read-operator", "budget"]
outcome = "boundary"
record = "experiments/DISCOVERY-TRACK.md, D6 record; experiments/OD/D6/grade.json"
boundary = "55 feasible cells on five worlds (a diffusion chain, the Lorenz-96 Jacobian, a shallow-water grid, an unseen advection-diffusion chain, an unseen Lorenz-96 at F = 10): greedy within 1.33 of the exhaustive optimum in all 50 checkable cells and equal in 45; strictly fewer sensors than the energy ranking in 16 of 27 discriminating cells, never more than a random ordering, and one sensor more than the energy ranking in one unseen cell where greedy missed the optimum; the forecast horizon 10.7 percent longer than the energy placement's and 17.8 percent longer than random pooled on 14 discriminating growth cells, never shorter; greedy at the sensor cap of 12 without the count in one Lorenz-96 cell"
witness = "the count of identifiable directions at a budget is the placement quantity: where any placement works, every selector ties; where placement matters, the Gramian's spectrum finds fewer sensors than the energy of the readings does, and the sensors it picks leave the forecast error in the slower directions; the one cell the energy ranking won is a cell greedy lost to the exhaustive optimum"
absorbed_by = "declaration"
revision = "the selector, not the claim: a one-step lookahead or the exhaustive optimum where feasible would test the spectrum without greedy's slack; not registered"

