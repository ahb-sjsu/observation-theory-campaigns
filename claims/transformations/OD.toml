# Transformation registry for the OD track, observational discovery. Opened 2026-09-09 with the
# families the gates declare; tests are entered when a gate's verdict is committed.
#
# BACKFILL, 2026-09-12. The last three families below were declared in the sealed registrations
# of D6, D5 and D7 on 2026-09-10 and were never mirrored here, so ten tests entered on 2026-09-10
# cited families this file did not carry. Found by the PE-DSC-1.0 D1 check, not by reading. The
# declarations are intact and precede their runs: each seal commit is a git ancestor of the commit
# adding that gate's results.json, and each sealed blob still hashes to the value the track
# document records. What was late is this file, which is what `entered` states on each row. The
# ranks were assigned at entry, from the ordering the header already declared; no rank was read
# off a result.

[registry]
track = "OD"
title = "Observational discovery, from the read operator to laws that survive observers"
commit = "D1, D2, D2v2, D2v3, D2v4, D2v5, D2v6, D2v7, D2v8, D3 and D3v2 recorded 2026-09-09; D2v9, D6, D5 and D7 recorded 2026-09-10; rehabilitations D5v2, D7v2, D6v2 and D1v2 recorded 2026-09-10; third registrations D5v3, D7v3 and D6v3 recorded 2026-09-10; fourth registration D5v4 recorded 2026-09-10"
x = "state spaces of declared consumers: synthetic linear and nonlinear consumers, linear systems observed through a window, embedding corpora, Lorenz systems, discretized Burgers fields, candidate clouds of the program's own searches"
y = "what the observer reads: outputs at a budget (whether two outputs are within B), k-occurrence counts, observational lengths of perturbations, diagnostics of a field"
equivalence = "declared per gate before its seal: medians relative to chance (D1), a registered tolerance on a frozen law (D2), tolerance on exponents and horizons (D3), a registered separation (D4), convergence in N and collapse in B (D5)"
complexity_ordering = "changes of observer within a declared family first, then changes of data world, then changes of scale, then changes of dynamical system"

[[transformation]]
id = "OD:observer-family"
family = "change of observer within a declared family: read operators of declared spectrum, coordinate subsets, coarsenings, and learned consumers' recovered read operators"
parameters = "declared per gate"
closure = "none"
rank = 1
declared = "2026-09-09"

[[transformation]]
id = "OD:budget"
family = "change of the observation budget B at fixed consumer and output metric"
parameters = "a ladder declared per gate"
closure = "none, a one-parameter family"
rank = 2
declared = "2026-09-09"

[[transformation]]
id = "OD:world-transfer"
family = "transfer of a law frozen on synthetic worlds to embedding corpora, ANN corpora, and dynamical state spaces without retuning"
parameters = "the worlds declared per gate"
closure = "none"
rank = 3
declared = "2026-09-09"

[[transformation]]
id = "OD:simulation-resolution"
family = "change of the simulation resolution N at fixed observation budget B, for dynamical systems"
parameters = "a ladder declared per gate"
closure = "none"
rank = 4
declared = "2026-09-09"

[[transformation]]
id = "OD:observer-choice"
family = "choice of which candidate sensors form the observer of a linear system, a placement S giving the observer C_S whose read operator is the exact window Gramian over [0, T]"
parameters = "placements chosen by greedy selection on the Gramian spectrum, by the energy ranking under white forcing, by seeded random k-subsets (200 per cell) and orderings (60 per cell), and by the exhaustive minimum where the subset count permits; required direction count m, budget B, cap of 12 sensors"
closure = "none, a choice among subsets of the candidate rows"
rank = 1
declared = "2026-09-10"
declared_in = "experiments/OD/D6/PREREG-D6.md, blob 56b1c4918a4c6940b1a1f5e03d68e12e7318c083, seal commit b9701a0"
entered = "2026-09-12"

[[transformation]]
id = "OD:singular-transition"
family = "approach to a singularity of the observed dynamics, the periodic Burgers equation carried to shock formation, against a regular two-dimensional flow as the control"
parameters = "viscosity on a ladder including 0, spectral reader budgets B, resolutions N, sample times up to the shock time t* = -1 / min u0'"
closure = "none"
rank = 5
declared = "2026-09-10"
declared_in = "experiments/OD/D5/PREREG-D5.md, blob 04821d283c616edf7239ced284dcc34b37e738b1, seal commit 06707ec"
entered = "2026-09-12"

[[transformation]]
id = "OD:closure-geometry"
family = "choice of which subfilter directions a closure keeps at a declared spectral cutoff, the cutoff being both the consumer and the budget"
parameters = "closures at matched rank 16, 32, 64, 128 and the read operator's full rank; the eigen-direction closure (the declared arm), the read-energy closure, the energy closure and random modes; cutoffs k_c in {8, 16}; resolutions n"
closure = "none, a choice among rank-r projections of the subfilter state"
rank = 1
declared = "2026-09-10"
declared_in = "experiments/OD/D7/PREREG-D7.md, blob 5d601fb8f7795b4c335bcdd35af2c7ac50fc777b, seal commit f6ec331"
entered = "2026-09-12"

[[test]]
transformation = "OD:budget"
claim = "a single-direction probe along coordinate e_i at size rho is reported identifiable at budget B exactly when P_ii > B^2 / rho^2, and a ladder of sizes brackets P_ii between B^2 / r_hi^2 and B^2 / r_lo^2 (article Theorem 2(b), Corollary 3)"
entries = ["read-operator", "budget", "geometric-evaluation-theory"]
outcome = "survived"
record = "experiments/DISCOVERY-TRACK.md, D1 record; experiments/OD/D1/grade.json axis"
witness = "exact in every evaluator of all fifteen World A cells (three worlds, five budgets, 20 evaluators each) on the run seed, as in every pilot"
absorbed_by = ""
revision = "none"

[[test]]
transformation = "OD:observer-family"
claim = "mixed probes at one radius, where the sphere crosses the ellipsoid substantially, recover the read operator up to the pencil s P + (1 - s)(B^2 / rho^2) I, below-threshold eigenvalues included, with Frobenius, above-threshold and below-threshold medians at most 0.30 of chance at 960 queries"
entries = ["read-operator", "budget", "geometric-evaluation-theory"]
outcome = "boundary"
record = "experiments/DISCOVERY-TRACK.md, D1 record; experiments/OD/D1/grade.json mixed"
boundary = "held in five of six well-crossed cells (Frobenius 0.045 to 0.111 of chance, above 0.055 to 0.111, below 0.037 to 0.172); in the positive definite world at B = 1 the Frobenius ratio 0.198 and the below ratio 0.068 held and the above ratio was 0.303 against 0.30"
witness = "the tolerance was fixed as the pilot's own maximum in that same cell (0.299) rounded up to two decimals, so it carried no margin for a fresh seed; the estimator, the crossing and the recovery are unchanged between pilot and run"
absorbed_by = "declaration"
revision = "none for the claim; for later gates, fix a tolerance as a declared multiple of the pilot's maximum"

[[test]]
transformation = "OD:observer-family"
claim = "in a positive definite world the analytic centre returns the pencil's end P* = s* P + (1 - s*) c I, s* = c / (c - lambda_min), so the estimate is nearer P* than P (article Corollary 4)"
entries = ["read-operator", "geometric-evaluation-theory"]
outcome = "survived"
record = "experiments/OD/D1/grade.json, B4; experiments/OD/D1/pencil_probe.json"
witness = "nearer P* in 20 of 20 evaluators at B = 1 and at B = 1.5 on the run seed (Frobenius 0.223 against P, 0.181 against P*; 0.117 against 0.102), 20 of 20 in the third pilot, 6 of 6 cells in the pre-seal probe; in the kernel worlds the pencil's end is P itself and the two errors coincide"
absorbed_by = ""
revision = "none"

[[test]]
transformation = "OD:budget"
claim = "where lambda_min rho^2 < B^2 < lambda_max rho^2 fails the oracle is constant in every direction; where it holds it need not be non-constant in finite samples"
entries = ["read-operator", "budget"]
outcome = "survived"
record = "experiments/OD/D1/grade.json, B2 entries"
witness = "constant in all 20 evaluators at n = 5, B = 2 (no crossing, B^2 = lambda_max rho^2) and at n = 8 positive definite, B = 0.25 (a crossing by theory so thin that 960 random directions in each of 20 evaluators all answered distinguishable)"
absorbed_by = ""
revision = "none"

[[test]]
transformation = "OD:observer-family"
claim = "for a positive definite read operator with spectrum in [a, b] the observational and classical window exponents differ by at most log(b / a) / (2 (T - t0)) (article Proposition 1, lean/GET/Horizon.lean)"
entries = ["read-operator", "budget", "observer"]
outcome = "survived"
record = "experiments/DISCOVERY-TRACK.md, D3 record; experiments/OD/D3/grade.json exact E1"
witness = "3,200 of 3,200 windows on Lorenz-63 and Lorenz-96 under an anisotropic observer with b / a = 16 and 4; the worst ratio to the bound 0.96 in the pilot, so the bound is nearly attained"
absorbed_by = ""
revision = "none"

[[test]]
transformation = "OD:observer-family"
claim = "an observer with a kernel reads a smaller exponent than the classical one when an unread direction grows faster (World K, mu = 2), the same when it grows slower (mu = 1/2), and a kernel-started perturbation reads a transiently larger exponent that converges"
entries = ["read-operator", "observer", "nuisance"]
outcome = "survived"
record = "experiments/OD/D3/grade.json K1, K1c, K2, K3"
witness = "gap 0.82 to 1.25 in 64 of 64 starts at mu = 2 with the classical exponent at its predicted 1.965; control equal within 0.0072; kernel starts larger on the first window in 83 to 98 percent of starts with median excess +1.5 to +3.5 falling to 0.09 to 0.17 by T = 20; generic starts under every projection within 0.035 of the classical exponent at T = 20"
absorbed_by = ""
revision = "none"

[[test]]
transformation = "OD:budget"
claim = "the horizon T_O(B) is non-decreasing in B, lies between the Euclidean horizons at B / sqrt(b) and B / sqrt(a) for a positive definite observer, and is never earlier than the Euclidean horizon for a projection"
entries = ["budget", "read-operator"]
outcome = "survived"
record = "experiments/OD/D3/grade.json exact H1"
witness = "8,960 of 8,960 checks"
absorbed_by = ""
revision = "none"

[[test]]
transformation = "OD:observer-family"
claim = "at fixed budget the horizon depends on the observer where no symmetry of the flow relates the observers (Lorenz-63, x against z) and not where one does (Lorenz-96, one block of ten sites against the next)"
entries = ["observer", "budget"]
outcome = "boundary"
record = "experiments/DISCOVERY-TRACK.md, D3 record; experiments/OD/D3/grade.json H2"
boundary = "x later than z for the same perturbation in 77, 78, 70 and 64 percent of pairs at B = 10, 100, 1000, 10000 with sign-test p 0.0000, 0.0000, 0.0022 and 0.033 against the registered 0.01 at every budget; the Lorenz-96 control at p 0.11 to 0.86"
witness = "the paired effect weakens as the budget grows and the perturbation aligns with the leading direction for longer, so a fixed per-budget level over the ladder was the wrong registration, not the wrong claim; the pilot at the same budget had 77 percent and p below 0.0001"
absorbed_by = "declaration"
revision = "none for the claim; for later gates, declare the level per budget or grade the ladder as a whole"

[[test]]
transformation = "OD:world-transfer"
claim = "the hubness law frozen on Gaussian clouds, skew = -0.026 + 0.421 / cv_d + 0.817 sqrt(d_eff) / k, predicts hubness on distributions it was not discovered on, on real embeddings and at larger N, within declared multiples of its pilot error"
entries = ["hubness", "observer", "read-operator"]
outcome = "failed"
record = "experiments/DISCOVERY-TRACK.md, D2 record; experiments/OD/D2/grade.json"
witness = "fresh seeds of the discovery family replicate (0.93 against 1.19) but uniform balls (error up to 4.5, the law over-predicting by up to 2.8), Student t (under-predicting by up to 2.4) and Wikipedia embeddings (5.3, measured skewness at most 1.1 at effective dimension 156 where the law says 10) fail; the nominal-dimension competitor is worse pooled (14.8 against 2.9) and better on the unseen synthetic group alone (1.74 against 2.45)"
absorbed_by = "none"
revision = "not proposed here: a successor would need a shape variable that separates tails and roundness from the spectrum and a discovery set of more than one family"

[[test]]
