<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300" role="img" aria-label="The four scales and the transformations each permits, nested from ratio to nominal."><rect width="100%" height="100%" fill="#fcfcfb"/><rect x="250.0" y="110" width="52" height="44" rx="5" fill="#2a78d6" fill-opacity="0.35" stroke="#2a78d6" stroke-width="1.2"/><text x="276.00" y="137.00" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#0b0b0b" text-anchor="middle" font-weight="normal">ratio</text><rect x="306.0" y="110" width="52" height="44" rx="5" fill="#f3f2ee" fill-opacity="1" stroke="#8a897f" stroke-width="1.2"/><text x="332.00" y="137.00" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#0b0b0b" text-anchor="middle" font-weight="normal">interval</text><rect x="362.0" y="110" width="52" height="44" rx="5" fill="#f3f2ee" fill-opacity="1" stroke="#8a897f" stroke-width="1.2"/><text x="388.00" y="137.00" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#0b0b0b" text-anchor="middle" font-weight="normal">ordinal</text><rect x="418.0" y="110" width="52" height="44" rx="5" fill="#f3f2ee" fill-opacity="1" stroke="#8a897f" stroke-width="1.2"/><text x="444.00" y="137.00" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#0b0b0b" text-anchor="middle" font-weight="normal">nominal</text><text x="360.00" y="220.00" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#52514e" text-anchor="middle" font-weight="normal">rescale ⊂ affine ⊂ increasing ⊂ injective</text></svg>