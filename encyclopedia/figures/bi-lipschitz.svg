<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300" role="img" aria-label="Every distance stretched or shrunk by at most a fixed factor."><rect width="100%" height="100%" fill="#fcfcfb"/><line x1="80.00" y1="220.00" x2="640.00" y2="80.00" stroke="#2a78d6" stroke-width="2.5" stroke-linecap="round" stroke-opacity="1.0"/><line x1="80.00" y1="250.00" x2="640.00" y2="140.00" stroke="#8a897f" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="5 4" stroke-opacity="1.0"/><line x1="80.00" y1="190.00" x2="640.00" y2="20.00" stroke="#8a897f" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="5 4" stroke-opacity="1.0"/><text x="360.00" y="270.00" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#52514e" text-anchor="middle" font-weight="normal">every distance lands between the two lines, a factor each way</text></svg>