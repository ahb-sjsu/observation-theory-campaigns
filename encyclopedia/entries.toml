[[entry]]
id = "youden-f1-bound"
kind = "correction"
title = "Youden F1 bound"
glossary = ""
equations = ["5.4"]
ledger = []
first_stated = "The AUROC form, theorem \"AUROC-F1 Bound\" in `theory-radar/paper/astar_paper.tex` and the derivation in `theory-radar/src/symbolic_search/_auroc_proof.py`, repository DOI 10.5281/zenodo.20660206. The corrected form at theory-radar 1b3d105."
book_records = ["theory-radar\\paper\\astar_paper.tex", "theory-radar\\results\\rerun_youden", "theory-radar\\ERRATA.md"]
book_terms = ["Youden"]
lean = "observation-data-mining:lean/DataMiningAsObservation/MonotoneInvariance.lean"
related = ["monotone-invariance", "formula-search", "safe-pruning", "apriori"]
conditions = [
  "The Youden form holds for every score with a finite sample.",
  "The AUROC form holds for concave ROC curves, and as a pruning bound it is safe only there.",
  "Inside a tree search either form bounds the formula itself and not its descendants, so pruning a subtree by its root's ceiling is a heuristic in both cases.",
]
[[entry.errata]]
repo = "theory-radar"
file = "ERRATA.md"
match = "AUROC to F1 bound"
[[entry.results]]
repo = "theory-radar"
file = "results/rerun_youden_2026_09_03.json"
note = "Rerun of the A* paper's pruning tables by `theory-radar/rerun_youden_2026_09_03.py`. Part A is depth-2 pairwise enumeration on eight datasets, exhaustive against the AUROC pre-filter at seven thresholds and against Youden pruning. Part B is the depth-3 A* search with 50,000 expansions in strict mode (no pre-filter), the published fast mode (AUROC pre-filter at 0.52), and the youden mode."

