# The map from an entry id to the records it is built from. tools: encyclopedia/generate.py
# reads this file and the records, and writes encyclopedia/generated/<id>.md. Paths are
# repo-relative; the repo's local checkout is found under the source root given on the command
# line. A term's definition comes from the book's glossary, its equations from the book's
# numbered displays, its ledger rows from the claims ledger, its measurements from the book's
# sources tables (the rows that cite the entry's records) and from campaign track tables, its
# corrections from ERRATA files, and its uses from the chapters that mention it.

[repos]
geometric-observation = "geometric-observation"
observation-theory-campaigns = "observation-theory-campaigns"
theory-radar = "theory-radar"
observation-data-mining = "observation-data-mining"
turboquant-pro = "turboquant-pro"
gtc-prototype = "gtc-prototype"

[[entry]]
id = "flip"
kind = "result"
title = "the flip"
glossary = "flip, the"
equations = ["4.3", "3.1", "0.10"]
ledger = ["GO-2 (neg. half", "GO-2 (pos. half", "GO-4", "NEG-16"]
first_stated = "Volume 14, chapter 8, `geometric-observation/chapters/ch08_value.md:1-30`, DOI 10.5281/zenodo.21776291. The two-dimensional case is the cover and equation 3.1 of *Data Mining as Observation*."
book_records = ["geometric-observation\\chapters\\ch08_value.md", "rows GO-2", "row GO-4", "ch16_honest_negatives.md"]
book_terms = ["the flip", "flip(?:s|ped)?\\b"]
lean = "observation-data-mining:lean/DataMiningAsObservation/Flip.lean"
related = ["read-distortion", "alignment", "anti-arm", "rank-certificate", "coupling-null"]
conditions = [
  "Matched bits, and reconstruction matched or reported, for every comparison of two codes.",
  "A read operator misaligned with where the signal has its energy. The alignment of book equation 4.6 is the dial, and near one, the coupling null, no flip is possible.",
  "The read operator is the average of local linearizations, and the ordering it predicts is the ordering on average over the workload.",
]
[[entry.errata]]
repo = "geometric-observation"
file = "chapters/ch16_honest_negatives.md"
match = "NEG-(4|5|6|7|8|9|10)\\b"

