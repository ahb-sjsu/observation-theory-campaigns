[volume]
number = 4
title = "Geometric Economics"
repo = "geometric-economics"
slug = "geometric-economics"
standing = "The README's epistemic-status block of 2026-07-14 calls the volume a posited framework, speculative theory awaiting instruments, and says that no economics instrument has been evaluated by the series' admission filter and that none passes its gate. Its claims are to be read as theory at licensed strength and not as validated measurement, and the chapters tag each claim as established mathematics, empirical, modeling axiom, conditional theorem or speculation."

[[entry]]
id = "economic-decision-complex"
kind = "concept"
title = "economic decision complex"
definition = "A weighted simplicial complex whose vertices are economic states, each carrying an attribute vector of nine scores, whose edges are available actions carrying a nonnegative total cost, and whose higher simplices are bundles of actions that can be taken jointly."
first_stated = "Definition 3, Section 3.3, `geometric-economics/chapters/ch03_decision_manifold.md:93-99`, with the formal statement in the chapter's technical appendix, `geometric-economics/chapters/ch03_decision_manifold.md:390-390`."
conditions = [
  "The object is combinatorial and not a smooth manifold. The volume uses manifold language as an approximation when alternatives are many and finely graded.",
  "Not every pair of states is joined by an edge. Only feasible transitions are, and an edge weight may be infinite.",
  "The chapter states that the complex is a claim about the space in which decisions are made, not a utility function and not a prescription of what agents should do.",
]
related = ["economic-decision-dimensions", "moral-economic-boundary", "economic-metric-tensor", "bond-geodesic", "manifold", "graph"]

[[entry]]
id = "economic-decision-dimensions"
kind = "concept"
title = "nine dimensions of the economic decision manifold"
definition = "The nine coordinates on which the volume scores an economic state. They are consequences $d_1$, rights $d_2$, fairness $d_3$, autonomy $d_4$, privacy and trust $d_5$, social impact $d_6$, virtue and identity $d_7$, legitimacy $d_8$ and epistemic status $d_9$. Only $d_1$ is visible to a purely monetary agent."
first_stated = "Definition 1, Section 3.1, `geometric-economics/chapters/ch03_decision_manifold.md:32-50`."
conditions = [
  "The number nine is tagged a modeling axiom inherited from Geometric Ethics. The chapter says the key claim is a dimension well above one, not exactly nine, and that Geometric Ethics treats the nine as a chart chosen for coverage and not a measured dimensionality.",
  "The chapter says the claim that the nine are operative is posited and not yet validated. The support it names is the cross-lingual work of Geometric Ethics, which that volume's ledger classes as exploratory, and the eris-econ calibration, an in-sample benchmark. It adds that no economics instrument has passed the series' admission filter, and that in a sealed test on moral-judgment data reported in Geometric Ethics learned coordinates outperformed a nine-axis codebook built on this chart.",
  "The volume names a falsifier. A replicable economic behavior that cannot be decomposed into any subset of the nine would show the framework wrong.",
]
related = ["economic-decision-complex", "transferable-and-evaluative-dimensions", "economic-metric-tensor", "posited-versus-measured"]

[[entry]]
id = "transferable-and-evaluative-dimensions"
kind = "concept"
title = "transferable and evaluative dimensions"
definition = "Dimensions $d_1$, $d_2$ and $d_4$ are transferable, meaning a gain to one party requires a matching cost to another in a closed bilateral exchange. Dimensions $d_3$ and $d_5$ to $d_9$ are evaluative, meaning both parties can gain on them at once."
first_stated = "Definition 2, Section 3.2, `geometric-economics/chapters/ch03_decision_manifold.md:83-85`."
conditions = [
  "The split is stated for closed bilateral exchanges. Chapter 9 derives conservation on the transferable dimensions from it.",
  "Fairness $d_3$ is evaluative throughout the volume. Section 8.2 and other passages grouped it with the transferable dimensions until the correction of 2026-11-26.",
  "Evaluative dimensions are not necessarily conserved. Chapter 9 adds that they can also fall for both parties.",
]
related = ["economic-decision-dimensions", "attribute-conservation-law", "economic-bond-invariance-principle"]

[[entry]]
id = "moral-economic-boundary"
kind = "concept"
title = "moral-economic boundary and boundary penalty"
definition = "A threshold in the decision complex where the local decision regime changes discontinuously. Crossing boundary k adds a penalty $\\beta_k$ to the edge weight on top of the Mahalanobis term, and the penalty may be infinite."
first_stated = "Section 3.4 on boundary penalties and Definition 5, Section 3.5, `geometric-economics/chapters/ch03_decision_manifold.md:152-166`, with the three penalty regimes in the technical appendix, `geometric-economics/chapters/ch03_decision_manifold.md:399-404`."
conditions = [
  "The three regimes of the penalty, infinite, finite and zero, are tagged a modeling axiom.",
  "The volume says finite penalties are measurable as the compensation at which agents become willing to cross, after the taboo trade-off paradigm of Tetlock. It reports no such measurement of its own.",
  "The four named types are the theft, promise, sacred-value and market-norm against social-norm boundaries. The last changes the covariance matrix itself and not only a penalty.",
  "Chapter 16 leaves open whether infinite boundaries are topological features or only very high penalties.",
]
known_as = "Tetlock's forbidden or taboo trade-offs, which the volume names as the infinite-penalty case."
related = ["economic-decision-complex", "geometric-decision-cost", "economic-heuristic-truncation-theorem", "economic-no-escape-conjecture", "threshold"]

[[entry]]
id = "economic-metric-tensor"
kind = "concept"
title = "economic metric (inverse covariance as metric tensor)"
definition = "In the continuous limit of the decision complex the cost of a small displacement is $ds^2 = g_{ij}\\,da^i\\,da^j$ with the metric tensor g equal to the inverse of the nine by nine dimensional covariance matrix Sigma. Cost is counted in standard deviations of behavioral expectation, so unusual displacements are costly."
first_stated = "Section 4.1, `geometric-economics/chapters/ch04_economic_metric.md:40-50`, after Definition 4 of Chapter 3, `geometric-economics/chapters/ch03_decision_manifold.md:129-133`. The registered test named in the standing is scored in `geometric-economics/experiments/RESULTS_coupling_scorecard.md:8-14`."
conditions = [
  "Taking the inverse covariance as the metric tensor is tagged a modeling axiom.",
  "Sigma is symmetric positive semidefinite with at most 45 free parameters and is to be estimated from a calibration sample before prediction. The distance is a proper metric only when Sigma is positive definite and a pseudometric otherwise.",
  "Chapter 16 calls the calibration partial and lists as open whether Sigma can be estimated from large observational data, whether it is stable in time and whether it is universal or culture specific.",
  "The symmetric quadratic form cannot express the asymmetry between gains and losses. Section 4.10 replaces it with a Finsler metric for that purpose.",
]
standing = "Modeling axiom in the volume's tags. The repository's registered test prereg-coupling-v1, which predicted that one shared metric couples risk and social preferences as a rank-one factor, was scored on the Global Preferences Survey and falsified on that proxy. The same-subject angle test that the scorecard names as decisive is unrun. The preface and Section 16.1 report the failed test."
known_as = "The Mahalanobis distance of 1936, read as a Riemannian metric."
related = ["geometric-decision-cost", "mahalanobis-distance", "covariance-matrix", "economic-finsler-metric", "economic-singularity", "geometric-evaluation-theory"]

[[entry]]
id = "geometric-loss-aversion-coefficient"
kind = "result"
title = "geometric loss-aversion coefficient"
definition = "The ratio of the edge weight of a loss to the edge weight of an equal gain, $\\lambda = w_- / w_+$. A gain is taken to move the state on $d_1$ alone while a loss also moves it on rights, fairness, social and identity dimensions, so the ratio exceeds one and grows with the number and intensity of dimensions activated."
first_stated = "Theorem 34, Section 4.2, `geometric-economics/chapters/ch04_economic_metric.md:68-99`."
conditions = [
  "The theorem is given with an argument that posits which dimensions a loss activates. The activations are not measured.",
  "Section 4.2 takes the ratio of edge weights, which are squared distances. Section 4.10 and the technical appendix take the ratio of Finsler lengths, which is the square root of that ratio. Section 4.10 states the relation, and the volume does not settle which of the two is compared with 2.25.",
  "The volume states its falsifiers. A coefficient that is constant across conditions, or one that varies but not monotonically with the count of activated dimensions, would show the derivation wrong.",
  "The chapter says the value 2.25 should be derivable from a fitted Sigma and calls that fitting an empirical programme.",
]
standing = "An argument from posited activations, tagged in parts as conditional theorem and as empirical prediction. Section 4.2 calls it a derivation, while the chapter opening says the chapter reads loss aversion as a property of the metric and that sealed tests of reduced-form geometric models against cumulative prospect theory have so far favored prospect theory (Geometric Ethics, Section 20.8). The chapter cites the eris-econ calibration for a range of 1.0 to 3.53 and calls it an in-sample calibration, not a held-out test. The README of 2026-07-14 says no economics instrument has passed the series' admission filter."
known_as = "Loss aversion in the prospect theory of Kahneman and Tversky, where the coefficient is a fixed parameter near 2.25."
related = ["economic-metric-tensor", "economic-finsler-metric", "metric-feature-versus-heuristic-error", "economic-decision-dimensions"]

[[entry]]
id = "economic-finsler-metric"
kind = "concept"
title = "Finsler metric of the decision manifold"
definition = "A cost function F(x, v) of position x and direction v that uses one inverse covariance matrix for gain directions and another for loss directions, so that F(x, v) and F(x, -v) differ. The loss-aversion coefficient at x is the ratio F(x, -v) / F(x, v)."
first_stated = "Section 4.10, `geometric-economics/chapters/ch04_economic_metric.md:400-416`, with the formal statement in the technical appendix, `geometric-economics/chapters/ch04_economic_metric.md:453-465`."
conditions = [
  "Tagged a modeling axiom. The gain and loss metric tensors are not estimated in the volume.",
  "The tangent space at each point is split into a gain cone and a loss cone by the sign of the net change on the salient dimensions.",
  "Within one cone and for small displacements it reduces to the Mahalanobis metric. When the gain and loss matrices are equal it is the Mahalanobis metric and the coefficient is one.",
]
known_as = "Finsler geometry, which the volume cites from Bao, Chern and Shen."
related = ["economic-metric-tensor", "geometric-loss-aversion-coefficient", "mahalanobis-distance", "metric"]

[[entry]]
id = "metric-feature-versus-heuristic-error"
kind = "concept"
title = "metric feature versus heuristic error"
definition = "The volume's two-way classification of behavioral phenomena. A metric feature follows from the manifold's metric and would persist for an agent with perfect information. A heuristic error is a different evaluation of the same state under a different description. Gauge invariance is the criterion that separates them."
first_stated = "Section 4.4, `geometric-economics/chapters/ch04_economic_metric.md:166-180`, with the full table in Section 4.9, `geometric-economics/chapters/ch04_economic_metric.md:370-386`."
conditions = [
  "The table lists loss aversion, reference dependence, the endowment effect, hyperbolic discounting and status quo bias as metric features. It lists framing, anchoring, availability bias and the sunk cost fallacy as heuristic errors.",
  "The classification rests on the posited metric. It is not an observed property of the phenomena.",
  "The volume gives a test and reports no run of it. Loss aversion should resist debiasing while framing effects should shrink when the attribute vector is made explicit, and identical responses to debiasing would show the classification wrong.",
]
related = ["geometric-loss-aversion-coefficient", "economic-bond-invariance-principle", "economic-gauge-violation-tensor", "market-pathology-taxonomy"]

[[entry]]
id = "economic-heuristic-truncation-theorem"
kind = "result"
title = "Heuristic Truncation Theorem (moral heuristics as admissible heuristics)"
definition = "A moral heuristic that charges, at each state, the sum over boundaries of the penalty times the probability that the action crosses the boundary is admissible when each penalty is a lower bound on the true cost of crossing. A* search with it then finds the optimal path on the decision complex."
first_stated = "Theorem 7, Chapter 5, `geometric-economics/chapters/ch05_price_as_heuristic.md:92-98`, within the pathfinding setting of Definition 6, `geometric-economics/chapters/ch05_price_as_heuristic.md:34-41`."
conditions = [
  "The decision is modelled as A* search with cost f = g + h, where g is the accumulated edge weight and h the heuristic estimate of the remaining cost. The identification of g with deliberate and h with intuitive judgment is the volume's modelling.",
  "The premise is that each penalty does not exceed the true cost of crossing. A heuristic that overestimates moral cost is inadmissible, and the volume calls that case genuine bias.",
  "Theorem 10 makes admissibility relative to the space. An infinite penalty can be admissible on the full complex and inadmissible on the monetary projection.",
  "Definition 11 and Theorem 12 relax the claim to a heuristic within a factor one plus epsilon of the true cost, with path cost at most that factor times the optimum.",
]
known_as = "The admissibility theorem for A* search of Hart, Nilsson and Raphael, and the bounded suboptimality of weighted A*."
related = ["moral-economic-boundary", "price-as-scalar-heuristic", "bond-geodesic", "economic-decision-complex"]

[[entry]]
id = "price-as-scalar-heuristic"
kind = "concept"
title = "price signal as scalar heuristic"
definition = "The price is read as a heuristic estimate of the remaining cost that reports only the monetary coordinate. It is the projection onto $d_1$ of the full edge weight to the goal, and it carries nothing about the other eight dimensions."
first_stated = "Chapter 5, `geometric-economics/chapters/ch05_price_as_heuristic.md:72-82`, restated in `geometric-economics/chapters/ch05_price_as_heuristic.md:214-235`."
conditions = [
  "An efficient market is restated as a price heuristic that is admissible on $d_1$. The strongest efficient market hypothesis is restated as a price heuristic that is exact on $d_1$.",
  "The reading holds inside the A* model of decision of Definition 6 and is a reinterpretation. The volume reports no test of it.",
  "Externalities, information asymmetry and coercive pricing are read as gaps on $d_6$, $d_9$ and $d_4$ between the price heuristic and the full cost.",
]
known_as = "Hayek's account of prices as carriers of dispersed information, which the volume says holds on the monetary dimension only."
related = ["economic-heuristic-truncation-theorem", "economic-scalar-irrecoverability", "market-pathology-taxonomy", "projection"]

[[entry]]
id = "economic-scalar-irrecoverability"
kind = "result"
title = "Scalar Irrecoverability Theorem (economic form)"
definition = "Any continuous map from nine-dimensional attribute vectors to a scalar utility is not injective and has no left inverse, and the optimal path on the decision complex can differ from the utility-maximizing path by an amount that no function of the scalar bounds."
first_stated = "Theorem 14, Chapter 6, `geometric-economics/chapters/ch06_economic_tensors.md:42-48`, with its proof at `geometric-economics/chapters/ch06_economic_tensors.md:52-60`."
conditions = [
  "The map is assumed continuous. Non-injectivity is proved from Brouwer's invariance of dimension on the unit cube.",
  "The unbounded divergence of paths in part 3 uses a boundary penalty that can be infinite while the scalar difference stays finite.",
  "The front matter tags irrecoverability a conditional theorem. It is a statement about maps, and it bears on economic choice only where choice depends on more than one coordinate, which the volume posits.",
]
standing = "Parts 1 and 2 are proved from established mathematics in the chapter. The application to economic behavior shares the volume's posited standing."
known_as = "Brouwer's invariance of dimension, and the non-injectivity of a continuous map from a higher-dimensional space to the line."
related = ["economic-projected-intransitivity", "price-as-scalar-heuristic", "inequality-tensor", "projection", "quotient", "null-space"]

[[entry]]
id = "economic-projected-intransitivity"
kind = "result"
title = "Projected Intransitivity"
definition = "Preference on the full complex, ordering alternatives by path cost from the current state under a fixed metric, is transitive. A projected preference can cycle when the projection compares different pairs on different dimensions."
first_stated = "Theorem 16, Chapter 6, `geometric-economics/chapters/ch06_economic_tensors.md:92-102`."
conditions = [
  "Transitivity on the full complex needs a fixed metric and a single reference state, so that path cost is one real-valued function of the alternative.",
  "The theorem states that the cycle arises only when the projection is context dependent, comparing each pair on a different subset of dimensions. A single fixed real-valued projection gives no cycle.",
  "The volume reads Tversky's intransitivity experiments this way. That reading is an interpretation and no fitted test of it is reported.",
]
related = ["economic-scalar-irrecoverability", "economic-metric-tensor", "economic-decision-dimensions", "projection"]

[[entry]]
id = "bond-geodesic"
kind = "concept"
title = "Bond geodesic"
definition = "The minimum-cost path on the economic decision complex from an initial state to a goal region, where the cost of a path is the sum of its edge weights and each edge weight is the Mahalanobis term plus the penalties of the boundaries crossed."
first_stated = "Definition 18, Chapter 7, `geometric-economics/chapters/ch07_bond_geodesic_equilibrium.md:40-48`."
conditions = [
  "It is the discrete analogue of a Riemannian geodesic. In the smooth limit the volume identifies it with a geodesic of the metric given by the inverse covariance.",
  "It needs the covariance matrix and the boundary penalties as inputs. The volume says the framework does not supply those measurements.",
  "Edge weights are squared Mahalanobis terms, so the volume notes that two half steps cost half as much as one full step and the path favors gradual transitions.",
  "A path that crosses a boundary with infinite penalty has infinite cost and is never the geodesic when a finite-cost path exists.",
]
known_as = "A shortest path in a weighted graph, which the volume computes by A* search."
related = ["economic-decision-complex", "bond-geodesic-equilibrium", "moral-economic-boundary", "geodesic-distance", "geometric-decision-cost"]

[[entry]]
id = "bond-geodesic-equilibrium"
kind = "concept"
title = "Bond geodesic equilibrium (BGE)"
definition = "A profile of paths, one per agent, in which each agent's path is a Bond geodesic on that agent's decision complex given the paths of the others. No agent can lower its behavioral friction, its total path cost on the full complex, by changing path alone."
first_stated = "Definition 19, Chapter 7, `geometric-economics/chapters/ch07_bond_geodesic_equilibrium.md:58-66`."
conditions = [
  "The front matter tags the choice of the BGE as the equilibrium concept a modeling axiom.",
  "A pure BGE need not exist. Theorem 23 gives a mixed BGE for a finite game in which every agent always has a path of finite cost to its goal.",
  "A BGE is not Pareto optimal in general, and several can coexist. Lemma 26 gives uniqueness when each agent's self-separation exceeds its cross-sensitivity.",
  "Agents are assumed to pathfind on the manifold they perceive. The volume says a miscalibrated heuristic or covariance gives a BGE of the perceived game that can differ from that of the true game.",
]
known_as = "Nash equilibrium, applied to the augmented game whose payoffs are the negative of behavioral friction."
related = ["bond-geodesic", "bge-nash-relationship", "economic-metric-tensor", "moral-economic-boundary"]

[[entry]]
id = "bge-nash-relationship"
kind = "result"
title = "BGE and Nash relationship (augmented game)"
definition = "A profile is a BGE exactly when it is a Nash equilibrium of the augmented game, whose strategies are the simple paths to the goal and whose payoffs are the negative of behavioral friction. With zero penalties and covariance on $d_1$ alone it is the Nash equilibrium of the monetary game. Positive penalties exclude scalar equilibria that cross a boundary."
first_stated = "Definition 20 and Theorem 21, Chapter 7, `geometric-economics/chapters/ch07_bond_geodesic_equilibrium.md:72-90`, with the proof at `geometric-economics/chapters/ch07_bond_geodesic_equilibrium.md:94-106`."
conditions = [
  "Equivalence holds by construction of the augmented game, with finite sets of simple paths as strategies.",
  "Scalar nesting is stated for a single-action game with all penalties zero and the covariance confined to the monetary dimension, and it uses the goal region to restrict the feasible actions.",
  "Refinement removes a boundary-crossing equilibrium only when the penalty exceeds the scalar cost disadvantage of the path that avoids the boundary.",
]
standing = "Tagged a conditional theorem in the front matter. Existence of a mixed BGE follows from Nash's theorem of 1950 through the equivalence."
known_as = "Nash equilibrium and Nash's existence theorem."
related = ["bond-geodesic-equilibrium", "bond-geodesic", "moral-economic-boundary", "price-as-scalar-heuristic"]

[[entry]]
id = "economic-bond-invariance-principle"
kind = "concept"
title = "economic Bond Invariance Principle and gauge group"
definition = "An economic evaluation J satisfies the principle when J of a re-described state equals J of the state for every meaning-preserving transformation, one that changes labels, units or accounting conventions and not the economic reality. The transformations form the economic gauge group, scalings of the monetary dimension by a positive real together with permutations of the numeraire."
first_stated = "Definition 34, Section 8.1, `geometric-economics/chapters/ch08_gauge_invariance.md:32-36`, with the gauge group in Definition 35, `geometric-economics/chapters/ch08_gauge_invariance.md:62-72`."
conditions = [
  "Tagged a modeling axiom and described as a consistency condition, not a normative preference.",
  "The three named classes of meaning-preserving transformation are currency relabeling, unit scaling and numeraire choice.",
  "Theorem 37 states that the edge weight is invariant under monetary scaling because the covariance rescales with the units. The violations the chapter studies are in the agent's heuristic and not in the manifold cost.",
  "Remark 45 limits the principle. A changed evaluation may show that the transformation was not meaning preserving and that the descriptions carried different information.",
]
related = ["economic-gauge-violation-tensor", "metric-feature-versus-heuristic-error", "attribute-conservation-law", "market-pathology-taxonomy"]

[[entry]]
id = "economic-gauge-violation-tensor"
kind = "instrument"
title = "economic gauge violation tensor and Bond Index"
definition = "For a heuristic h, transformations i and states j, the entry $V_{ij}$ is h of the transformed state minus h of the state. An invariant heuristic has every entry zero, and the Frobenius norm of V is the total violation. The Bond Index of Chapter 4 is the same difference in absolute value divided by h of the state."
first_stated = "Definition 41, Section 8.7, `geometric-economics/chapters/ch08_gauge_invariance.md:258-266`, with the Bond Index in Section 4.4, `geometric-economics/chapters/ch04_economic_metric.md:160-164`."
conditions = [
  "The transformations must be meaning preserving. Under Remark 45 a nonzero entry can be a pseudo-violation that reflects real economic content.",
  "Proposition 42 gives the composition rule. The violation of a composed transformation is the sum of the violations along the chain.",
  "The chapter describes a measurement protocol, the same states shown under each transformation to the same or matched subjects, which adapts to human subjects the experiments Geometric Ethics ran in an embedding model. It reports published experiments by others and no measurement of the tensor itself.",
  "The Bond Index of Section 4.4 is the deviation under one re-description. Section 4.4 says it is a different quantity from the Bond Index of Geometric Ethics, Chapter 18, which is the mean of such deviations over the tested inputs and declared re-descriptions, divided by a tolerance.",
]
related = ["economic-bond-invariance-principle", "metric-feature-versus-heuristic-error", "market-pathology-taxonomy", "frobenius-norm"]

[[entry]]
id = "attribute-conservation-law"
kind = "result"
title = "attribute conservation in closed exchange"
definition = "In a closed bilateral exchange between agents A and B the changes on each transferable dimension sum to zero, so that the change for A plus the change for B is zero on money $d_1$, rights $d_2$ and autonomy $d_4$. The evaluative dimensions are not conserved and may rise for both parties."
first_stated = "Theorem 9.1, Section 9.2, `geometric-economics/chapters/ch09_conservation_laws.md:30-42`."
conditions = [
  "The exchange is closed. No third party enters and no external rule changes during it.",
  "In an open system the sum equals the net external input on that dimension. The volume reads an observed violation as a sign that the system boundary was drawn too narrowly.",
  "The theorem is tagged conditional. Money is conserved by accounting identity, rights by the Hohfeldian correlative structure taken from Geometric Ethics, and autonomy in the sense that voluntary constraints are symmetric.",
  "Section 9.9 rederives the law from the invariance principle by a Noether argument, also tagged conditional. Chapter 16 lists the empirical pattern as an untested prediction.",
]
known_as = "The accounting identity that every payment is a receipt, and Noether's theorem for the derivation the volume gives."
related = ["transferable-and-evaluative-dimensions", "economic-bond-invariance-principle", "bond-geodesic-equilibrium"]

