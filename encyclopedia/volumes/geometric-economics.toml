related = ["moral-economic-boundary", "economic-bond-invariance-principle", "economic-decision-complex"]

[examples]
economic-decision-complex = "In the volume's running example the state with no new barista and the state after the hire are two vertices, the hire is the edge between them, and each vertex carries nine scores."
economic-decision-dimensions = "In the volume's running example a salary of 3,200 dollars a month is scored on $d_1$, a wish to pay at least 18 dollars an hour on $d_3$, and payroll tax compliance on $d_8$."
transferable-and-evaluative-dimensions = "A payment of 5 dollars changes the buyer by -5 and the seller by +5 on $d_1$, which sums to zero. In the volume's illustration both parties gain trust, +0.3 and +0.4, which sums to +0.7."
moral-economic-boundary = "The volume's grocery example. Buying for 50 dollars has weight $50^2/\\sigma_1^2$, which is 1 when the monetary scale is 50, and stealing crosses the theft boundary with infinite penalty. The buy edge is the cheaper one."
economic-metric-tensor = "With a diagonal covariance each dimension adds its squared change over its variance. In the volume's illustration a 100 dollar expense at monetary scale 50 adds $100^2/50^2 = 4.0$ and a fairness change of 0.6 at scale 0.8 adds 0.5625, for 4.5625 on those two dimensions."
geometric-loss-aversion-coefficient = "The volume's Remark 35. A loss that activates four further dimensions at half a standard deviation each gives $1 + 4 \\times 0.25 = 2.0$, against 1.0 for a loss that moves $d_1$ alone."
economic-finsler-metric = "If a direction v has quadratic form 1 under the gain matrix and 4 under the loss matrix, the lengths are 1 and 2 and the coefficient is 2. Equal matrices give a coefficient of 1."
metric-feature-versus-heuristic-error = "In the volume's table loss aversion is a metric feature. Choosing differently between a 90 percent survival rate and a 10 percent mortality rate is a heuristic error, since both describe one state."
economic-heuristic-truncation-theorem = "One boundary with penalty 5, true crossing cost 8 and crossing probability 0.5 gives a heuristic value of 2.5. The same sum with the true cost is 4, so the heuristic does not overestimate."
price-as-scalar-heuristic = "In the volume's example fair-trade beans cost 8.20 dollars a pound and conventional beans 4.50. The price reports a difference of 3.70 dollars on $d_1$ and nothing about fairness, labor conditions or trust."
economic-scalar-irrecoverability = "In two dimensions the map that adds the coordinates sends (1, 0) and (0, 1) both to 1, so the pair cannot be recovered from the sum. The volume's illustration is a shop valued at 200,000 dollars, a value shared by every configuration on one level set."
economic-projected-intransitivity = "The volume's proof uses x = (3, 1, 5), y = (5, 3, 1) and z = (1, 5, 3). On dimensions 1 and 2 y beats x, on 2 and 3 z beats y, and on 1 and 3 x beats z, which is a cycle."
bond-geodesic = "Two paths to the goal with edge weights 1 + 4 = 5 and 2 + 2 = 4. The second is the Bond geodesic. A third path that crosses a boundary with infinite penalty costs infinity and is excluded."
bond-geodesic-equilibrium = "The volume's ultimatum game with 10 dollars. A responder whose fairness penalty exceeds $1^2/\\sigma_1^2$ rejects an offer of 1 dollar, and a proposer who anticipates this offers 40 to 50 percent."
bge-nash-relationship = "Two paths with behavioral friction 4 and 6 have augmented payoffs -4 and -6. The path of least friction is the strategy of greatest payoff, so the two best-response conditions coincide."
economic-bond-invariance-principle = "The experiment of Shafir, Diamond and Tversky as the volume reports it. A 2 percent raise under 4 percent inflation is a real change of -2 percent and was rated better than a 1 percent cut under zero inflation, a real change of -1 percent. The rating followed the label, which violates the principle."
economic-gauge-violation-tensor = "A heuristic that scores a wage offer 100 in annual terms and 110 in monthly terms has an entry of 10 for that transformation and state, and a Bond Index of 10 / 100 = 0.10."
attribute-conservation-law = "The volume's worked example. Maria pays 2,000 dollars and Elena receives 2,000, which sums to zero on $d_1$. The evaluative gains sum to 0.7 + 0.5 + 0.9 + 0.3 = 2.4."
market-pathology-taxonomy = "The volume's reading of 2008. Mortgage models that ignored tail risk are heuristic corruption, rating agencies paid by issuers are objective hijacking, the housing bubble is a local minimum, and rising nominal prices over flat real prices are gauge breaking."
economic-singularity = "For two dimensions with unit variances and correlation r the determinant of Sigma is $1 - r^2$. It is 0.64 at r = 0.6 and 0.19 at r = 0.9, and it goes to zero as r goes to 1."
inequality-tensor = "In the volume's illustration a 100 dollar expense costs 4.0 at monetary scale 50 and 0.0004 at scale 5,000, a ratio of 10,000. For two agents whose $g_{11}$ are 1 and 3 the average is 2 and the monetary entry of the tensor is 1."
economic-no-escape-conjecture = "The volume's candidate is the organ market. If no path joins the state of holding an organ to the state of holding money, the conjecture says that no instrument can complete the trade, whatever its price."
