[[entry]]
id = "inverse-flavor-problem"
kind = "instrument"
title = "inverse flavor problem"
definition = "Given a target flavor $\\mathbf{f}^\\star$, a palette matrix $B$ and a positive-definite metric matrix $M$, choose nonnegative doses $\\mathbf{x}$ to minimize $(B\\mathbf{x} - \\mathbf{f}^\\star)^\\top M (B\\mathbf{x} - \\mathbf{f}^\\star)$ under a cost ceiling and admissibility constraints. It is a convex quadratic program. Zero distance is reachable exactly when the target lies in the admissible hull of the palette."
first_stated = "Section 13.4, `geometric-gastronomy/chapters/ch13_designing_flavors.md:72-80`."
conditions = [
  "The program is a modeling axiom and the reachability statement is tagged a theorem. It is stated for the linear-mixing regime with a positive-definite metric and a convex admissible set, and the volume's proof is one sentence from strict convexity in the flavor point $B\\mathbf{x}$. The minimum is attained at a unique flavor point, and the dose vector is unique only when the palette vectors are linearly independent.",
  "Convexity fails where mixing is nonlinear, in synergy and antagonism and in threshold and saturation effects at high dose. There the program is a local model, refined by panel-tested iterations.",
  "When the target lies outside the reachable polytope, the residual distance is what the volume calls the artificiality gap, and the active constraints say which limit blocks a closer match.",
  "Masking, mimicry, cost-limited formulation and personalization are presented as the same program under different targets, palettes, constraints and metrics.",
]
standing = "A theorem in the volume's tagging, with a one-sentence proof and no machine-checked proof. The metric matrix and palette vectors it needs are posited, and the volume conjectures that measuring the metric for a given eater is the binding constraint."
known_as = "Nonnegative least squares and convex quadratic programming."
related = ["flavor-riemannian-metric", "mahalanobis-distance", "positive-definite", "quadratic-form", "receptor-basis-rotation", "substitution-distance"]

[examples]
flavor-space = "Adding the block sizes the volume gives, 5 taste, 10 to 30 aroma and 5 trigeminal dimensions make 20 to 40 before the texture and temperature block, against about 400 receptor types. In the volume's line-cook example a flat dish is fixed by solving for two amounts, one of lime and one of miso."
binding-affinity-matrix = "Take one receptor with affinities (2, 1) for two species. The stimuli (1, 0) and (0, 2) both give response 2, so they are metamers, and their difference (1, -2) lies in the null space. At the volume's sizes, about 400 rows against about 10,000 columns leave a null space of dimension at least 9,600. The small numbers are illustrative."
receptor-basis-rotation = "Let $R$ multiply the bitter coordinate by 2 and leave the rest fixed. A dish at bitter 1 in the reference frame reads as 2 for that eater, so a target of 1 needs a reference-frame design at 0.5, the pre-image under the inverse. The factor 2 is illustrative."
effective-flavor-dimensionality = "With eigenvalues (5, 2, 0.8, 0.3) and a noise threshold of 1, the effective dimensionality is 2. Doubling the gain with the threshold unchanged multiplies every eigenvalue of the covariance by 4, giving (20, 8, 3.2, 1.2), and all 4 clear the threshold. The numbers are illustrative."
flavor-riemannian-metric = "With $k = 1$ and natural logarithms, going from 1 to 2 grams of salt per litre and going from 2 to 4 grams both cover a distance of log 2, about 0.69, although the second step adds twice the salt. The volume's kitchen form of this is salt held at a fixed percentage of total mass, often cited near 1%."
hedonic-manifold = "On one axis with $H(f) = -(f - 3)^2$ and a threshold of -1, the high-value region is the interval from 2 to 4 and the ridge is the point 3. Pleasantness falls on both sides of the optimum, the inverted-U the volume describes. The function is illustrative."
food-pairing-cosine-hypothesis = "An ingredient with 4 compounds and one with 9, sharing 3, have cosine 3 / (2 times 3) = 0.5. Two ingredients with no shared compound have cosine 0. The counts are illustrative."
western-eastern-pairing-asymmetry = "If the pairs in a cuisine's recipes share 12 compounds on average and the pairs in frequency-matched random recipes share 10, the effect is +2, the Western sign. An average of 8 against 10 gives -2, the East Asian sign. The numbers are illustrative, and the volume prints no effect size."
pairing-alignment-span-curvature = "Two unit vectors at angle 0 sum to a vector of length 2 in the same direction. Two at a right angle sum to length square root of 2, about 1.41, in a new direction. Their cosines are 1 and 0, and neither number records the resultant or any interaction term."
flavor-uncanny-valley = "With $\\sigma = 1$ the shell penalty is 0 at the anchor, $e^{-1}$ or about 0.37 at distance 1, and $4e^{-4}$ or about 0.07 at distance 2. The largest penalty sits at the moat radius, as the volume states."
seasoning-operators = "Take the vector (3, 4) with the savory subspace as the first axis and $\\lambda = 1.5$. Salt gives (4.5, 4). On the vector (0, 4), which has no savory component, the same operator changes nothing, the volume's point that salt cannot make a savory direction from nothing. The numbers are illustrative."
seasoning-fixed-point = "On one salt axis with $H(s) = -(s - 2)^2$, the gradient at 2 is 0 and the second derivative is -2, so 2 is the fixed point. A step to 2.1 or to 1.9 lowers $H$ by 0.01 either way. The function is illustrative."
culinary-transformation-types = "In the volume's translation model, smoked salmon is the salmon vector plus a smoke vector. With salmon at (5, 1, 0) and smoke at (0, 0, 2) the result is (5, 1, 2), so the base survives and one new component is added. The numbers are illustrative."
time-temperature-path-dependence = "One hour at 200 degrees followed by one hour at 100 gives 300 degree-hours, and so do two hours at 150. If browning runs only above about 140 degrees, the volume's threshold, the first schedule browns for one hour and the second for two, so the integral does not fix the result. The schedules are illustrative."
cooking-non-commutativity = "Let one step double a number, $D(x) = 2x$, and another add one, $A(x) = x + 1$. Then $D(A(1)) = 4$ and $A(D(1)) = 3$, so the two orders differ by 1. Two doublings commute. The operators are illustrative stand-ins, not the volume's."
substitution-distance = "On the axes (sour, citrus aroma) let lime be (4, 3), lemon (4, 2.5) and distilled vinegar (4.5, 0). At amount 2 with a Euclidean metric the lemon swap moves the dish by 2 times 0.5 = 1. The vinegar swap moves it by 2 times the length of (0.5, -3), about 6.1. The lemon and vinegar case is the volume's and the vectors are illustrative."
cuisine-flavor-eigenvectors = "With eigenvalues 6, 3 and 1 the first axis carries 6/10 = 60% of the variance and the first two carry 90%. The numbers are illustrative."
fusion-geodesic = "In one dimension, two Gaussians with means 0 and 10 and standard deviations 1 and 3 have a Wasserstein midpoint with mean 5 and standard deviation 2, a single cloud. Their half-and-half mixture also has mean 5 and keeps two modes, near 0 and near 10. The numbers are illustrative."
culinary-convergence-conjecture = "On the landscape $-(x^2 - 1)^2$, gradient ascent from 0.5 and from 2 both reach the peak at 1, and a start at -0.5 reaches the other peak at -1. Independent searches on one landscape share a small set of attractors, and the basin decides which one a search finds. The landscape is illustrative."
embedding-lossy-projection = "Describe a food by a pair (direction, dose) and let the embedding keep the direction only. A blue cheese at dose 1 and the same cheese at dose 10 map to the same vector, so no function of the embedding tells them apart. This is the volume's case of the two blue cheeses, with illustrative doses."
geometric-diet-set = "With two nutrients bounded by 50 to 100 and by 20 to 40, the intake (60, 30) is feasible and (60, 45) is not. In the volume's figures Stigler's hand solution of 39.93 dollars exceeds the simplex optimum of 39.69 by 0.24 dollars."
inverse-flavor-problem = "With palette vectors (1, 0) and (0, 1), the identity as metric and no other constraint, the target (2, 3) is reached exactly by doses (2, 3). The target (2, -1) is outside the hull, the best doses are (2, 0), and the residual distance is 1. The numbers are illustrative."
