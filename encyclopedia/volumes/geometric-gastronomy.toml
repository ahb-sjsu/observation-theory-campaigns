[volume]
number = 12
title = "Geometric Gastronomy"
repo = "geometric-gastronomy"
slug = "geometric-gastronomy"
standing = "The README's epistemic-status note of 2026-07-14 calls this volume a posited framework, speculative theory awaiting instruments, with no gastronomy instrument evaluated by the series' admission filter (xbse) and the nearest evaluated perceptual domains, aesthetics and music, rated inadmissible to medium. Its claims are to be read as theory at licensed strength and not as validated measurement, and the chapters tag each statement as a modeling axiom, empirical, a conjecture or a theorem. Since the corrections of 2026-11-26 the analyses the volume describes carry the tag that no run is recorded for this volume, and their outcomes are worded as predictions."

[[entry]]
id = "flavor-space"
kind = "concept"
title = "flavor space and the flavor vector"
definition = "A posited finite-dimensional perceptual space $\\mathcal{F}$ in which every flavor experience is a point, every ingredient a vector and every culinary operation a map from the space to itself. The flavor vector concatenates a taste block (about 5 dimensions), an aroma block (about 10 to 30), a trigeminal block (about 5) and a texture and temperature block."
first_stated = "Chapter 1, `geometric-gastronomy/chapters/ch01_taste_as_geometry.md:26-26`, with the full flavor vector in Section 1.4, `geometric-gastronomy/chapters/ch01_taste_as_geometry.md:66-68`."
conditions = [
  "Tagged a modeling axiom. The existence of the space and its modest dimension are posited, not measured.",
  "The coordinates are perceptual, recovered by dimensionality reduction from receptor responses, and are not columns of a chemistry table. The chain the volume gives runs from about 10,000 volatiles through about 400 receptor types to perceptual dimensions on the order of tens.",
  "The static point is an idealization. The volume says the honest object is a curve traced in time, and Chapter 14 lists that temporal geometry as an open problem.",
]
related = ["manifold", "projection", "intrinsic-dimension", "binding-affinity-matrix", "flavor-riemannian-metric"]

[[entry]]
id = "binding-affinity-matrix"
kind = "concept"
title = "binding affinity matrix"
definition = "The matrix $A$ with one row per receptor type (about 400) and one column per chemical species (about 10,000), whose entry $A_{ij}$ is the affinity of receptor i for molecule j. Transduction is modeled as $\\mathbf{r} = A\\mathbf{c}$. Chemical variation in the null space of $A$ is odorless and tasteless, and distinct stimuli with the same image are metamers."
first_stated = "Section 2.3, `geometric-gastronomy/chapters/ch02_the_receptor_basis.md:54-64`."
conditions = [
  "Tagged a modeling axiom, valid within the sub-saturating regime of each receptor. Real dose-response curves are sigmoidal, and the linear form fails at saturation.",
  "Competitive binding and state-dependent receptors, such as miraculin switching the sweet receptor to acid activation, change the entries with context. The volume calls the linear map the tangent-plane approximation.",
  "The matrix is wide and rank-deficient, so the map from chemistry to receptor response is far from injective. It is also sparse and structured, which the volume uses to argue for the second compression to 10 to 30 perceptual dimensions.",
]
related = ["null-space", "kernel", "quotient", "matrix", "read-operator", "flavor-space"]

[[entry]]
id = "receptor-basis-rotation"
kind = "concept"
title = "individual variation as a rotation of the receptor basis"
definition = "Heritable receptor variation is modeled as a near-identity linear transformation $R$ of the reference affinity matrix, so an individual's basis is $A' = RA$ and their receptor vector is $\\mathbf{r}' = R\\mathbf{r}$. For a single-receptor polymorphism the action is approximately a rotation in the plane of the affected axis and its perceptual neighbors, together with a change of gain along that axis where the polymorphism rescales it."
first_stated = "Section 2.5, `geometric-gastronomy/chapters/ch02_the_receptor_basis.md:99-99`, and its inverse use in Section 13.5, `geometric-gastronomy/chapters/ch13_designing_flavors.md:90-90`."
conditions = [
  "Tagged a modeling axiom. The rotation is an approximation for single-receptor polymorphisms such as TAS2R38 and OR6A2, where $R$ rescales or reorients one coordinate and leaves the others fixed. The volume notes that a rotation preserves length and cannot by itself represent a gain change.",
  "Variation in receptor density and gain is a second form that changes resolution and not orientation. The volume treats it separately as effective flavor dimensionality.",
  "Personalized design in Section 13.5 replaces the target by its pre-image $R^{-1}\\mathbf{f}^\\star$, an argument that needs only that $R$ is invertible. The volume conjectures that the binding constraint is measuring $R$ for one eater with enough fidelity, not the optimization.",
]
related = ["orthogonal-matrix", "basis", "effective-flavor-dimensionality", "binding-affinity-matrix", "inverse-flavor-problem"]

[[entry]]
id = "effective-flavor-dimensionality"
kind = "concept"
title = "effective flavor dimensionality"
definition = "The count of eigenvalues of an individual's receptor-response covariance $\\Sigma_r$ that exceed that person's perceptual noise threshold. Supertasting raises gain and lifts marginal eigenvalues above the threshold. Specific anosmias and non-taster haplotypes drop particular eigenvalues below it and collapse dimensions."
first_stated = "Section 2.6, `geometric-gastronomy/chapters/ch02_the_receptor_basis.md:111-113`."
conditions = [
  "Tagged a modeling axiom. The volume gives no measured spectrum or threshold for any person.",
  "The receptor types are the same across people. The volume's reading is that supertasters make fuller use of the available dimensions, not that they inhabit a higher-dimensional space.",
  "Two palates can share a receptor basis and differ in effective rank. A dish tuned for one rank can be illegible or overwhelming at another.",
]
related = ["effective-rank", "eigenvalue-eigenvector", "covariance-matrix", "threshold", "receptor-basis-rotation"]

[[entry]]
id = "flavor-riemannian-metric"
kind = "concept"
title = "Riemannian metric of flavor"
definition = "A symmetric positive-definite tensor $g_{ij}(\\mathbf{f})$ at each point of flavor space that gives a small displacement the squared length $ds^2 = \\sum g_{ij}\\,df_i\\,df_j$. Along one intensity axis the coordinate is the logarithm of concentration, so the distance between concentrations $C_1$ and $C_2$ is $|k \\log(C_2/C_1)|$, a ratio and not a difference."
first_stated = "Chapter 3, `geometric-gastronomy/chapters/ch03_the_metric_of_flavor.md:24-26`, with the logarithmic ruler in Section 3.1, `geometric-gastronomy/chapters/ch03_the_metric_of_flavor.md:40-40`."
conditions = [
  "Tagged a modeling axiom. No component of the tensor is given a measured value.",
  "The logarithm (Weber-Fechner) is a first approximation. The volume says Stevens' power law $P = kC^a$ describes many continua better, with exponents it quotes near 1.3 for sucrose and about 1.4 for salt, a value it says it gives without a source.",
  "The tensor depends on position, with off-diagonal entries for cross-modal taste interactions, and on history. Cross-adaptation is modeled as $g \\mapsto A^\\top g A$ for an operator set by recent exposure.",
  "Chapter 14 states that with a path-dependent metric the space is not a Riemannian manifold in the usual sense, and leaves the choice of formalism open.",
]
related = ["metric", "positive-definite", "mahalanobis-distance", "geodesic-distance", "curvature", "flavor-space"]

[[entry]]
id = "hedonic-manifold"
kind = "concept"
title = "hedonic manifold"
definition = "A hedonic function $H$ assigns each flavor point a scalar pleasantness. The hedonic manifold is its high-value region, the set where $H$ exceeds a threshold $\\theta$, or its ridge, where $H$ is locally maximal across the transverse directions. Pairing is the choice of two flavors whose sum lands on it."
first_stated = "Chapter 5, `geometric-gastronomy/chapters/ch05_the_pairing_manifold.md:24-24`, after the hedonic field posited in Section 3.6, `geometric-gastronomy/chapters/ch03_the_metric_of_flavor.md:100-100`."
conditions = [
  "Tagged a modeling axiom. The field is indexed by person and culture, with an evolved component common to the species and a learned component that deforms it.",
  "The volume describes the manifold as bounded, curved and thin, from inverted-U responses whose optima interact. The split into a rigid low-dimensional biological layer and a plastic cultural layer is tagged a conjecture, and the volume says the decisive cross-cultural factor analysis has not been run.",
  "The five principal components proposed in Section 5.5 (intensity, balance, complexity, contrast, familiarity) are tagged a conjecture. The evidence for three to five dominant axes is described as reported, and the volume says it cites no study and records no analysis for it.",
  "Chapter 14 treats the field as deforming with satiety and over a lifetime. Both are listed as open problems.",
]
related = ["seasoning-fixed-point", "flavor-uncanny-valley", "geometric-diet-set", "threshold", "manifold", "flavor-space"]

[[entry]]
id = "food-pairing-cosine-hypothesis"
kind = "concept"
title = "food-pairing hypothesis as cosine similarity"
definition = "Represent each ingredient by a binary compound vector, with a 1 for each compound it contains. The food-pairing hypothesis is then the claim that pairing quality rises with the cosine of two such vectors, the number of shared compounds divided by the square roots of the two compound counts."
first_stated = "Section 4.1, `geometric-gastronomy/chapters/ch04_similarity_and_complementarity.md:32-36`."
conditions = [
  "The volume calls the hypothesis half a theory. It describes similarity pairing, which the volume places in Western cuisine, and it does not describe complementarity.",
  "In the flavor network of Ahn et al. (2011) East Asian cuisines pair ingredients that share fewer compounds than chance, so the hypothesis is not a universal law.",
  "The binary vector ignores concentration and odor thresholds. The volume's phrase is that presence is not perception.",
  "A single scalar angle cannot separate echoing from completing. The volume adds span and curvature terms to it.",
]
known_as = "The food-pairing hypothesis of Blumenthal and Benzi, tested on recipe data by Ahn, Ahnert, Bagrow and Barabasi (2011)."
related = ["cosine", "bag-of-words", "hub", "western-eastern-pairing-asymmetry", "pairing-alignment-span-curvature"]

[[entry]]
id = "western-eastern-pairing-asymmetry"
kind = "correction"
title = "Western/Eastern pairing asymmetry"
definition = "Against a null of randomly assembled recipes, North American and Western European recipes use ingredient pairs that share more flavor compounds than chance, and East Asian recipes use pairs that share fewer. The food-pairing hypothesis is reversed in East Asian cuisine, so it cannot be a universal law."
first_stated = "Section 4.3, `geometric-gastronomy/chapters/ch04_similarity_and_complementarity.md:50-54`."
conditions = [
  "The result is that of Ahn et al. (2011), which the volume reports as about 380 ingredients, about 1,021 compounds and 56,498 recipes, with a null model that controls for ingredient frequency.",
  "The Western effect is driven largely by a few high-frequency hub ingredients such as milk, butter, egg, vanilla and wheat. Removing them weakens it dramatically.",
  "Section 4.7 proposes a reanalysis with a perceptual embedding and predicts that it would sharpen the asymmetry. The section is tagged a proposed reanalysis with no run recorded for this volume, and the README classes the volume's claims as posited and not measured.",
  "The volume reads the split as similarity against complementarity and says both are good, for different reasons.",
]
standing = "A published external result (Ahn et al. 2011) that the volume reports and uses to bound the food-pairing hypothesis. The reading of it as diagonal against off-diagonal pairing is the volume's interpretation."
related = ["food-pairing-cosine-hypothesis", "pairing-alignment-span-curvature", "null-model", "hub", "cosine", "correction"]

[[entry]]
id = "pairing-alignment-span-curvature"
kind = "result"
title = "alignment, span and curvature of a pairing"
definition = "The volume's conjecture that pairing quality is a function of three geometric quantities. Alignment is the cosine of the two flavor vectors, span is how much of the space they jointly cover, and curvature is the symmetric bilinear interaction $\\mathbf{B}(\\mathbf{f}_1, \\mathbf{f}_2)$ added to their sum. A single-number summary discards two of the three."
first_stated = "Section 4.7, `geometric-gastronomy/chapters/ch04_similarity_and_complementarity.md:115-115`, with the interaction term in Section 4.6, `geometric-gastronomy/chapters/ch04_similarity_and_complementarity.md:95-99`."
conditions = [
  "Tagged a conjecture. The volume says the cross-corpus validation is not yet in hand.",
  "The interaction term is a modeling axiom. It adds along an axis for synergy, as with salt and umami, subtracts for antagonism, as with sweet and bitter, and is zero in a flat space. The volume reads it as curvature in the loose sense of a second-order correction to the linear sum, and defines no embedding of which it would be the second fundamental form.",
  "Similar summands add nearly colinearly and complementary summands add by the Pythagorean rule. Both statements are for the linear sum without the interaction term.",
  "That the three-term model tracks recipe co-occurrence and panel ratings better than cosine alone is a prediction of the proposed reanalysis of Section 4.7, for which no run is recorded.",
]
standing = "A conjecture in the volume's own tagging. The volume presents it as the kitchen form of scalar irrecoverability, which it cites from Volume 4 and does not prove here."
related = ["scalar-irrecoverability", "food-pairing-cosine-hypothesis", "cosine", "span", "curvature", "orthogonal"]

[[entry]]
id = "flavor-uncanny-valley"
kind = "concept"
title = "uncanny valley of flavor"
definition = "The conjecture that hedonic response dips in the near shell of a familiar flavor anchor, close enough that the category fires and far enough that the prediction is violated. The volume's shell penalty is $K(d) = (d^2/\\sigma^2)\\exp(-d^2/\\sigma^2)$, zero at the anchor, largest at distance $\\sigma$ and fading far away."
first_stated = "Section 5.3, `geometric-gastronomy/chapters/ch05_the_pairing_manifold.md:54-54`, with the shell penalty in Section 5.6, `geometric-gastronomy/chapters/ch05_the_pairing_manifold.md:108-114`."
conditions = [
  "Tagged a conjecture, by analogy with Mori's uncanny valley for faces. The evidence cited is the literature on expectation and sensory incongruity.",
  "The penalty is one term of a posited hedonic kernel, beside an inverted-U term and a complementarity reward $\\gamma[1 - \\cos(\\mathbf{f}_1, \\mathbf{f}_2)]$.",
  "The anchors, their weights and the moat radius are said to be personal and cultural, fit to one person's experience. That a recommender fitted this way avoids the valley is a conjecture the volume calls falsifiable and does not test.",
  "The strawberry and tomato case is the chapter's running example, told as a story about a pairing app. No data are given for it.",
]
known_as = "The uncanny valley of Mori (1970), carried over to flavor expectation."
related = ["hedonic-manifold", "food-pairing-cosine-hypothesis", "surprise", "cosine"]

[[entry]]
id = "seasoning-operators"
kind = "concept"
title = "seasoning operators (salt, acid, fat, heat)"
definition = "Four maps from flavor space to itself. Salt stretches the savory component by a factor $\\lambda > 1$, as $T(\\mathbf{f}) = \\mathbf{f} + (\\lambda - 1)P_{sav}\\mathbf{f}$. Acid rotates the vector toward a brightness axis. Fat is a low-pass filter on the temporal flavor curve. Heat is a flow that releases volatiles at temperature-dependent rates. They do not commute."
first_stated = "Chapter 6, `geometric-gastronomy/chapters/ch06_the_algebra_of_seasoning.md:24-24`, with the generating set and its non-commutation in Section 6.5, `geometric-gastronomy/chapters/ch06_the_algebra_of_seasoning.md:94-100`."
conditions = [
  "Each operator is tagged a modeling axiom. The forms are posited, and none is fitted to data.",
  "Salt cannot create a savory direction the dish lacks, and its factor is bounded. Past the bound the dish moves toward the salt vertex and the no-rotation approximation fails.",
  "The four are a generating set for a monoid of transformations, with leaving the dish alone as the identity, and not a basis of a vector space. Some have partial inverses, and the volume says the structure is not a group. It calls the basis imperfect, since heat bundles a thermal flow with a trigeminal translation.",
  "The inverses are lossy. Salt can be added and cannot be cleanly removed.",
]
known_as = "The four elements of Nosrat's Salt, Fat, Acid, Heat (2017)."
related = ["seasoning-fixed-point", "cooking-non-commutativity", "projection", "anisotropic", "flavor-space"]

[[entry]]
id = "seasoning-fixed-point"
kind = "concept"
title = "seasoning fixed point"
definition = "A dish is properly seasoned at a point $\\mathbf{f}^\\star$ that is a fixed point of taste-and-adjust, a local maximum of the hedonic function $H$. No small admissible move raises $H$, the gradient is about zero and the Hessian is negative semidefinite."
first_stated = "Section 6.6, `geometric-gastronomy/chapters/ch06_the_algebra_of_seasoning.md:108-112`."
conditions = [
  "Tagged a modeling axiom. It rests on the posited hedonic function of Chapter 5.",
  "The fixed point is stable only against small moves. Seasoning finds the nearest peak and not the highest, and a distant configuration can beat it.",
  "Because the inverse operators are lossy, the volume's prudent dynamics is small steps from below. Under-seasoning stops short of the peak and over-seasoning overshoots it.",
  "Section 8.4 restates balance as a tolerance region around a target and not a single point.",
]
related = ["hedonic-manifold", "seasoning-operators", "gradient", "hessian"]

[[entry]]
id = "culinary-transformation-types"
kind = "concept"
title = "geometric types of culinary transformation"
definition = "Each cooking process is a map $\\Phi_\\theta$ on flavor space set by process variables such as temperature, time, water activity and pH. The volume sorts the maps into five types. Maillard browning expands dimension, caramelization follows a one-dimensional curve, protein denaturation collapses dimensions, fermentation is a slow flow, and smoking, curing and aging are approximately translations."
first_stated = "Chapter 7, `geometric-gastronomy/chapters/ch07_transformations_under_heat.md:24-24`, with the summary of the five motions at `geometric-gastronomy/chapters/ch07_transformations_under_heat.md:109-109`."
conditions = [
  "Tagged a modeling axiom. The types are a classification, and no map is fitted.",
  "The Maillard map is close to the identity until the surface dries and passes about 140 degrees Celsius, where it switches on sharply.",
  "Caramelization cannot be reversed, since its progress coordinate is monotone in accumulated heat.",
  "The volume qualifies two types. Denaturation also frees substrate for other maps and can open texture dimensions, and the translations carry second-order couplings through water activity and pH.",
]
related = ["flavor-space", "time-temperature-path-dependence", "cooking-non-commutativity", "jacobian", "manifold"]

[[entry]]
id = "time-temperature-path-dependence"
kind = "correction"
title = "time-temperature path dependence"
definition = "The cooked flavor is the time-ordered composition of local transformation maps along the schedule $T(t)$, and not a function of the total heat $\\int T\\,dt$. Two schedules give the same flavor only if their paths are equivalent under the kinetics, a stronger condition than equal energy."
first_stated = "Section 7.5, `geometric-gastronomy/chapters/ch07_transformations_under_heat.md:88-96`."
conditions = [
  "The path model is tagged a modeling axiom. The reason given is that Maillard and caramelization rates rise roughly exponentially with temperature (Arrhenius kinetics).",
  "The supporting comparison is qualitative. Sous-vide at 56 degrees Celsius for two days delivers, by the integral of temperature in degrees Celsius over time, about seventeen times as much as a roast at 230 degrees for forty minutes, yet it is the roast that browns, and the two land at different flavors.",
  "The volume rejects the equal-integral simplification as false. It gives no measured flavor distance between two such paths.",
]
related = ["culinary-transformation-types", "cooking-non-commutativity", "scalar-irrecoverability", "aggregation"]

[[entry]]
id = "cooking-non-commutativity"
kind = "concept"
title = "non-commutativity of cooking operations"
definition = "Cooking operations are operators on flavor space, and in general their order matters. For searing $S$ and braising $B$, $S(B(\\mathbf{f}_0)) \\neq B(S(\\mathbf{f}_0))$. The commutator $[S, B] = SB - BS$ is zero exactly when two operations can be freely reordered. Sequenced operations form a non-abelian monoid."
first_stated = "Section 8.2, `geometric-gastronomy/chapters/ch08_recipe_as_geometric_construction.md:44-48`, with the recipe graph in Section 8.5, `geometric-gastronomy/chapters/ch08_recipe_as_geometric_construction.md:84-86`."
conditions = [
  "Tagged a modeling axiom. The comparison of sear-then-braise with braise-then-sear is qualitative.",
  "The structure is a monoid and not a group, since most cooking operations have no inverse.",
  "Mixing alone is addition and commutes. The volume says salting and resting roughly commute.",
  "In the recipe graph, operations on different branches commute freely. Order matters only along a single path.",
]
related = ["seasoning-operators", "culinary-transformation-types", "time-temperature-path-dependence", "graph", "matrix"]

[[entry]]
id = "substitution-distance"
kind = "instrument"
title = "substitution distance"
definition = "Replacing ingredient j by j' at amount $a_j$ moves the dish, to first order, by $\\Delta\\mathbf{f} \\approx a_j(\\mathbf{f}_{j'} - \\mathbf{f}_j)$. The substitution is safe when this displacement is short in the flavor metric. Agreement on one coordinate, such as sourness, does not guarantee a short distance."
first_stated = "Section 8.6, `geometric-gastronomy/chapters/ch08_recipe_as_geometric_construction.md:98-104`."
conditions = [
  "Tagged a modeling axiom, to first order. It ignores curvature corrections and the nonlinearities of downstream operators.",
  "It assumes the substitute passes through the same downstream operators. A substitution near the source of a long branch can grow through each transformation, and one near the sink does not.",
  "It rests on the additive model of a dish as a weighted sum of ingredient vectors, which the volume says is linear only locally.",
]
related = ["flavor-riemannian-metric", "euclidean-distance", "vector", "flavor-space", "inverse-flavor-problem"]

[[entry]]
id = "cuisine-flavor-eigenvectors"
