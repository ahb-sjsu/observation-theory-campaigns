definition = "A cuisine is a probability distribution over flavor space, estimated from a corpus of recipes and summarized by its mean and covariance $\\Sigma_C$. The eigenvectors of $\\Sigma_C$ are the cuisine's flavor eigenvectors, and $\\lambda_k / \\sum_j \\lambda_j$ is the share of its flavor variation along axis k."
first_stated = "Chapter 9, `geometric-gastronomy/chapters/ch09_the_eigenvalues_of_a_kitchen.md:24-24`, with the eigendecomposition in Section 9.2, `geometric-gastronomy/chapters/ch09_the_eigenvalues_of_a_kitchen.md:40-44`."
