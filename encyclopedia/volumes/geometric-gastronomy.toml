definition = "A fusion dish is modeled as a point on the geodesic between two cuisine distributions under the Wasserstein metric on Gaussians. The means interpolate linearly and the covariances along a curved path of valid covariances. A mixture $(1-t)\\,p_A + t\\,p_B$ is bimodal and is not fusion. Curdling is leaving the support of both parents."
first_stated = "Section 9.4, `geometric-gastronomy/chapters/ch09_the_eigenvalues_of_a_kitchen.md:60-64`."
conditions = [
  "Tagged a modeling axiom. It treats each cuisine as a Gaussian with a mean and a covariance.",
  "Interpolation is stable on dimensions where both covariances have support. Where one cuisine has variance and the other has none, the volume says the transport map has nothing to transport to.",
  "The mole and dashi case is the chapter's running example. No distance or covariance is computed for it.",
]
known_as = "Displacement interpolation in optimal transport, the Wasserstein geodesic between Gaussian distributions."
