definition = "The pedagogical heuristic $h_T(x)$ is the teacher's estimate of the geodesic distance from the student's state x to the nearest point of the goal region. It is admissible when $h_T(x)$ is at most that distance for every x, and epsilon-admissible when it exceeds the distance by at most a small epsilon."
first_stated = "Definitions 6.1 and 6.2 with Theorem 6.1, `geometric-education/manuscript/part_ii/ch06_teaching_geodesic.md:24-28` and `geometric-education/manuscript/part_ii/ch06_teaching_geodesic.md:50-56`, with the weaker grades in Sections 6.2.2 and 6.2.3, `geometric-education/manuscript/part_ii/ch06_teaching_geodesic.md:62-70`."
conditions = [
  "Theorem 6.1 states that A* search with an admissible heuristic finds the learner geodesic. The volume gives it as a direct instantiation of the A* optimality theorem of Geometric Reasoning.",
  "With an epsilon-admissible heuristic the teaching path is within epsilon of optimal.",
  "The volume's prose reads the admissible case as a teacher who never judges a student ready too early, and the inadmissible case, written $h_T(x) > d(x, G) + \\epsilon$, as a teacher who overestimates readiness. The inequality and the prose do not agree, and the volume's corrections record of 2026-11-26 lists the choice between them as unresolved.",
  "The mapping of master, competent and miscalibrated teachers onto the three grades is posited. No teacher's heuristic has been measured.",
]
known_as = "Admissible heuristics for A* search, after Hart, Nilsson and Raphael (1968). The volume ties the calibration of the heuristic to Shulman's pedagogical content knowledge (1986)."
related = ["heuristic-admissibility", "educational-heuristic-field", "euclidean-heuristic-admissibility", "gauge-variant-pedagogical-heuristic", "learner-geodesic"]

