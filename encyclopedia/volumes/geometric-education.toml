  "The text gives a proof sketch. Each part is referred to an earlier statement, namely the prerequisite connectivity of the manifold, Corollary 5.2.1, Theorem 5.3 and Theorem 9.1.",
  "It applies to a system operating within the volume's framework and inherits every posit of that framework.",
  "Section 18.6 notes its limit. It does not say that an AI tutor cannot give misleading guidance inside the manifold, for example from a wrong estimate of the metric.",
  "The volume adds that automated grading performs the same contraction as human grading and lacks the teacher's discomfort signal.",
]
standing = "Stated as a theorem with a proof sketch. It is a restatement for AI systems of results that are themselves posited or elementary, and no AI system was tested."
related = ["no-escape-theorem", "economic-no-escape-conjecture", "gpa-irrecoverability-theorem", "assessment-geodesic-divergence", "assessment-gauge-invariance", "sycophancy-parameter"]

[[entry]]
id = "educational-bond-index"
kind = "instrument"
title = "Educational Bond Index"
definition = "For an institutional policy P and a student population S, the expected learning deviation of the path the policy allows, measured against each student's geodesic. The learning deviation of a path is the integral over time of its manifold distance from the geodesic. An index of zero means the policy imposes no deviation."
first_stated = "Definition 13.1, `geometric-education/manuscript/part_iv/ch13_educational_bond_index.md:17-23`, with the computation in Section 13.3, `geometric-education/manuscript/part_iv/ch13_educational_bond_index.md:91-97`. It is also in the notation table, `geometric-education/manuscript/appendices/appendix_d_notation.md:50-53`, and as code in Appendix B.4, `geometric-education/manuscript/appendices/appendix_b_code.md:89-121`."
conditions = [
  "It is a property of the policy and not of the students. The volume says no real institution reaches zero.",
  "The computation needs an estimated learner metric, a computed geodesic and observed trajectories. The volume calls the metric estimate the most uncertain step.",
  "It is decomposed into access, heuristic, metric and residual parts. The volume gives no procedure for separating them.",
  "Section 18.5 states that no institution has performed the prospective test. Section 13.5 says of itself that it is an illustrative scenario, that the study of the composite student Alex and its numbers are hypothetical, and that no such study has been run.",
]
standing = "A proposed instrument that has not been computed on data. The value 2.1 and the shares of 45, 30, 15 and 10 percent in Section 13.5 belong to a scenario the section labels illustrative and hypothetical."
related = ["bond-index", "legal-bond-index", "learner-geodesic", "inherited-heuristic", "reasoning-geodesic-deviation", "mahalanobis-distance"]

[examples]
learner-manifold = "The volume's illustrative state for Alex at college entry is (0.45, 0.85, 0.70, 0.80, 0.75, 0.65). The first coordinate, domain knowledge, is the lowest and the second, procedural skill, is the highest, and all six lie between 0 and 1."
learner-metric = "A symmetric 6 by 6 covariance matrix has 6 diagonal and 15 off-diagonal entries, 21 in all, as the volume counts. With the identity as covariance, two states that differ by 0.3 on one dimension and 0.4 on another are at distance 0.5."
learner-geodesic = "Suppose two routes reach the goal region. One has segments of cost 2 and 3 and the other has segments of cost 1.5 and 4.5. The totals are 5 and 6, so of the two the first is the geodesic even though its first segment costs more."
educational-boundary = "With a prerequisite threshold of 0.6 on linear algebra, a student at 0.4 cannot reach the region labeled quantum mechanics and a student at 0.7 can. The volume's example of an institutional boundary is a 3.0 grade point average to stay in an honors program."
educational-heuristic-field = "With weights of 0.5 on the teacher and 0.5 on the student's own estimate, and estimates of 4 and 6, the field value is 0.5 times 4 plus 0.5 times 6, which is 5. The other three sources have weight zero in this example."
three-point-five-decomposition = "With the volume's weights, Alex scores 0.270 + 0.213 + 0.035 + 0.040 + 0.023 + 0.013 = 0.593 and Ethan 0.671. The coordinate differences are 0.35, 0.35, 0.30, 0.25, 0.35 and 0.30, whose squares sum to 0.61. The square root of 0.61 is 0.78, the distance the volume prints."
gpa-irrecoverability-theorem = "With the volume's weights (0.60, 0.25, 0.05, 0.05, 0.03, 0.02), the states (0.5, 0.4, 0, 0, 0, 0) and (0.4, 0.64, 0, 0, 0, 0) both score 0.40, since 0.30 + 0.10 and 0.24 + 0.16 are equal. For six dimensions the level set of any score has dimension 5."
assessment-geodesic-divergence = "In the volume's illustration Ethan ends at (0.90, 0.55, 0.40, 0.50, 0.40, 0.30) with a 3.7 average and Alex at (0.70, 0.90, 0.80, 0.75, 0.85, 0.70) with 3.2. The coordinate sums are 3.05 and 4.70, so the higher score goes with the lower sum, as Corollary 5.3.2 says."
scalar-grade-adequacy-conditions = "The volume's adequate case is a typing speed test in a homogeneous population. Its inadequate case is a university calculus exam in a diverse population, which activates at least three dimensions and feeds consequential decisions, so all three conditions fail."
pedagogical-heuristic-admissibility = "If the true distance to the goal is 10, an estimate of 8 is admissible. An estimate of 10.5 is not admissible and is epsilon-admissible for epsilon equal to 1. An estimate of 13 is neither."
gauge-variant-pedagogical-heuristic = "Two students are at the same learner state, at true distance 5 from the goal. A teacher who estimates 4 for one and 7 for the other because of their accents has a gauge-variant heuristic, since the state is the same and the estimates differ by 3."
scaffolding-as-metric-adjustment = "For a step of 0.1 in domain knowledge, a natural metric component of 4 gives a cost of 0.1 times the square root of 4, which is 0.2. A scaffold that lowers the component to 1 gives a cost of 0.1."
inherited-heuristic = "With the parents' estimate at zero and all other sources absent, the field is zero everywhere and A* expands states in order of cost from the start alone. The volume's stated indicator is 1.5 to 2 extra semesters to a degree for first-generation students, given without a source."
curriculum-pathfinding = "Suppose a formal-first sequence of three courses costs a student 3, 4 and 5, and an applied-first sequence to the same goal region costs 2, 3 and 4. The totals are 12 and 9, so the minimum-cost curriculum for that student is the applied-first one, with the same number of courses."
educational-local-minimum = "A student with a 1.8 average over 90 credits has 162 grade points and needs 2.0 to graduate, the volume's example threshold. Nine more credits at 4.0 give 198 points over 99 credits, which is 2.0. At 3.0 it takes 18 credits, since 216 over 108 is 2.0."
grading-moral-injury = "If the teacher sees a state (0.3, 0.9) on two dimensions and the grade alone suggests (0.6, 0.6), the increment is the square root of 0.09 + 0.09, about 0.42. Ten assessment events with 30 students at 0.42 each total about 127."
assessment-gauge-invariance = "A student scores 82 on a free-response form and 74 on a multiple-choice form of the same content, and the noise bound is 3 points. The difference of 8 exceeds 3, so for this pair of instruments the assessment is not gauge-invariant."
educational-gauge-violation-tensor = "The volume's estimated ranges for the SAT are 50 to 150 points for format, 80 to 200 for language, 10 to 30 for time and 50 to 100 for context. The lower ends sum to 190 and the upper ends to 480, which the volume rounds to 200 to 500."
gauge-invariance-test-battery = "If the five ratios of effect size to threshold are 0.5, 1.0, 0.2, 0.5 and 0.3, their mean is 2.5 divided by 5, which is 0.5, and GIS is 1 minus 0.5, which is 0.5. That is below 0.60, the band the appendix does not recommend for consequential decisions."
knowledge-transfer-holonomy = "With a maximum curvature of 2 and a path that encloses an area of 0.3, the bound of Theorem 11.1 gives a holonomy norm of at most 0.6. On a flat region the curvature is 0 and the holonomy is 0."
educational-ai-no-escape = "An autograder that measures 2 of the 6 learner dimensions leaves 6 minus 2, which is 4, dimensions that Corollary 5.2.1 says it cannot infer. The volume's case is a grader that runs test cases and sees domain knowledge and procedural skill only."
educational-bond-index = "For two students whose mean distances from their geodesics are 0.4 and 0.8, the index computed as in Appendix B.4 is the average, 0.6. In the volume's illustrative scenario the shares of the index are 45, 30, 15 and 10 percent, which sum to 100."
