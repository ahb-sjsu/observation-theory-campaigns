[volume]
number = 9
title = "Geometric Education"
repo = "geometric-education"
slug = "geometric-education"
standing = "The README's epistemic-status note of 2026-07-14 calls this volume a posited framework, speculative theory awaiting instruments. No education-domain instrument has been evaluated by the series' admission filter, and Chapter 18 states that the six predictions of Section 16.3 have not been tested and that no method for estimating the learner metric has been validated at scale."

[[entry]]
id = "learner-manifold"
kind = "concept"
title = "learner manifold"
definition = "The six-dimensional Riemannian manifold of learner states. A state is a point $(d_1, \\ldots, d_6)$ whose coordinates are domain knowledge, procedural skill, metacognitive awareness, motivation and engagement, transfer ability, and creativity, each scored from 0 to 1. Learning is a path on it."
first_stated = "Section 4.2, `geometric-education/manuscript/part_ii/ch04_learner_manifold.md:36-38`, with the summary table of Section 4.11, `geometric-education/manuscript/part_ii/ch04_learner_manifold.md:252-266`."
conditions = [
  "The description is exact where learning is continuous and smooth. Where learning has discontinuities such as sudden insight, the volume calls it an approximation.",
  "Whether six is the right number of dimensions is, in the volume's words, an open empirical question. Proposition 4.1 is checked against six scenarios the volume itself lists.",
  "Domain knowledge is treated as one aggregate of many subject-specific dimensions, and the volume notes that this aggregation is itself a contraction.",
  "The manifold grows as the student learns, so a path is planned on a space that will have changed by the time the student reaches each waypoint.",
]
related = ["manifold", "learner-metric", "learner-geodesic", "reasoning-manifold", "cognitive-manifold", "posited-versus-measured"]

[[entry]]
id = "learner-metric"
kind = "concept"
title = "learner metric"
definition = "A symmetric positive-definite tensor field $g_{ij}(x)$ on the learner manifold. The squared length of a small step is $ds^2 = \\sum_{i,j} g_{ij}(x) dx^i dx^j$, read as the educational effort of that transition. In practice the volume takes it as the inverse of the 6 by 6 learner covariance matrix, which gives a Mahalanobis distance."
first_stated = "Definition 4.1 and Section 4.4.1, `geometric-education/manuscript/part_ii/ch04_learner_manifold.md:125-137`, with the dependence on the individual student in Section 10.1, `geometric-education/manuscript/part_iii/ch10_personalized_learning.md:18-20`."
conditions = [
  "The metric depends on position. The same increment of knowledge costs less for a student with strong knowledge and metacognition than for a student weak in both, and the volume calls this dependence curvature.",
  "Chapter 10 adds that the metric also differs between two students at the same position. A uniform metric is an approximation the volume accepts only for a homogeneous population, content on one dimension, and a short course.",
  "No covariance matrix is printed. The volume describes three cross terms in words and says the matrix is to be estimated from data.",
  "Section 10.4 states that no current adaptive learning system estimates the 6 by 6 metric or computes a geodesic from it.",
]
known_as = "The Mahalanobis distance, with the inverse covariance matrix as a constant metric."
related = ["mahalanobis-distance", "covariance-matrix", "positive-definite", "curvature", "learner-manifold", "legal-mahalanobis-distance"]

[[entry]]
id = "learner-geodesic"
kind = "concept"
title = "learner geodesic"
definition = "The path from a student's current state to the goal region that minimizes total learning cost, the integral of $\\sqrt{g_{ij} \\dot{\\gamma}^i \\dot{\\gamma}^j}$ along the path. The goal region is the set of states at or above a minimum acceptable attribute vector."
first_stated = "Definition 4.2, `geometric-education/manuscript/part_ii/ch04_learner_manifold.md:157-161`, with the goal region in Definition 4.4, `geometric-education/manuscript/part_ii/ch04_learner_manifold.md:217-219`."
conditions = [
  "The geodesic is in general not a straight line, and it differs between students because the cost of a transition depends on the student's position.",
  "The goal is a region and not a point. The university, the employer and the student may each define a different one.",
  "The manifold changes as the student traverses it, so the optimal path at one time may not be optimal later.",
  "It is a posited object. Computing it needs the learner metric, which the volume has not estimated from data.",
]
related = ["geodesic-distance", "learner-metric", "learner-manifold", "assessment-geodesic-divergence", "curriculum-pathfinding", "bond-geodesic"]

[[entry]]
