[[entry]]
id = "gpa-irrecoverability-theorem"
kind = "result"
title = "GPA Irrecoverability Theorem"
definition = "On a connected learner manifold of dimension at least 2, a continuous surjective scalar assessment G is not injective, so distinct learner states share one score. No function then maps the score back to the state. For k scalar assessments with k below the dimension d, the joint assessment is still not injective."
first_stated = "Theorem 5.1, `geometric-education/manuscript/part_ii/ch05_assessment_contraction.md:30-36`, Theorem 5.2, `geometric-education/manuscript/part_ii/ch05_assessment_contraction.md:48-50`, and Corollary 5.2.1, `geometric-education/manuscript/part_ii/ch05_assessment_contraction.md:60-64`. Stated informally as Theorem 1.1, `geometric-education/manuscript/part_i/ch01_gpa_trap.md:177-185`."
conditions = [
  "The only restriction on G is continuity. The printed proof takes a regular value of G and applies the preimage theorem, so the level set has dimension d minus 1.",
  "It is a statement about the map and holds for the six learner dimensions only if they are independent dimensions of a real space of learner states, which the volume posits.",
  "The estimate that one grade value is compatible with 100 to 1000 qualitatively distinct profiles is called a rough estimate. No computation is printed.",
  "Scores that all project mainly onto domain knowledge are correlated, so a battery of them spans fewer independent dimensions than it has scores.",
]
standing = "Theorems 5.1 and 5.2 are proved in the text and are elementary. The volume calls the result the education-specific instance of the Scalar Irrecoverability Theorem of Geometric Reasoning. Its application to real grades rests on the posited six-dimensional manifold."
related = ["scalar-irrecoverability", "benchmark-scalar-irrecoverability", "three-point-five-decomposition", "assessment-geodesic-divergence", "scalar-grade-adequacy-conditions", "null-space"]

[[entry]]
