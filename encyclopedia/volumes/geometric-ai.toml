[volume]
number = 11
title = "Geometric AI"
repo = "geometric-ai"
slug = "geometric-ai"
standing = "The README's epistemic-status block of 2026-07-14 calls this volume a posited framework, speculative theory awaiting instruments, whose alignment thesis is theory at licensed strength and not validated measurement. It adds that no alignment instrument has been evaluated under the xbse admission filter, and the front matter says that ARIA, the system whose numbers fill the chapter tables, is fictional."

[[entry]]
id = "value-manifold"
kind = "concept"
title = "Value manifold"
definition = "The nine-dimensional Riemannian manifold on which the volume places AI alignment. A value state is a point with one coordinate in [0, 1] on each of nine dimensions, an action is a trajectory between two states, and the minimum-cost trajectory, the value geodesic, is the aligned behaviour."
first_stated = "Chapter 4, opening construction, `geometric-ai/manuscript/part_ii/ch04_value_manifold.md:12-12`, with the nine dimensions introduced at `geometric-ai/manuscript/part_ii/ch04_value_manifold.md:32-34`."
conditions = [
  "The nine dimensions are inherited from the moral manifold of Geometric Ethics and re-read for AI. They are welfare, rights, justice, autonomy, trust, social impact, dignity, institutional legitimacy and epistemic integrity.",
  "A footnote of the chapter says the claim that nine dimensions suffice is empirical and open to revision. Open question 2 of Chapter 20 says that if the manifold must be specified in advance, the nine-dimensional structure is an assumption and not a discovery.",
  "The chapter's statement that the manifold is realized in about 11 principal components of a transformer's residual stream is illustrated on the fictional system ARIA and attributed to Geometric Cognition, Chapter 15.",
]
related = ["moral-manifold", "nine-dimension-moral-chart", "value-metric", "value-boundary", "manifold"]

[[entry]]
id = "value-metric"
kind = "concept"
title = "Value metric"
definition = "The symmetric positive-definite 9 by 9 matrix g(v) that prices an infinitesimal value change as $ds^2 = g_{\\mu\\nu}(v) dv^\\mu dv^\\nu$. The cost of a trajectory is the integral of ds along it, and the value geodesic between two states is the trajectory of least cost."
first_stated = "Definition 4.1, Section 4.3, `geometric-ai/manuscript/part_ii/ch04_value_manifold.md:118-128`, with the Mahalanobis approximation at `geometric-ai/manuscript/part_ii/ch04_value_manifold.md:138-146`."
conditions = [
  "The metric depends on position and on the population. Whether a deployed system uses one metric or one per population is called a governance decision, not a mathematical one.",
  "The approximation of the metric by the inverse covariance matrix of the value dimensions is exact only for a flat manifold with a constant metric. The volume uses it for local computations and says it breaks down globally.",
  "Chapter 20 lists as open question 1 whether the metric can be estimated from human preference data at the precision alignment engineering needs. The metric components printed in Chapter 16 belong to the fictional ARIA-G narrative.",
]
known_as = "A Riemannian metric, approximated locally by the Mahalanobis metric."
related = ["mahalanobis-distance", "metric", "geodesic-distance", "value-manifold", "geometric-rlhf"]

[[entry]]
id = "value-boundary"
kind = "concept"
title = "Value boundary"
definition = "A codimension-1 submanifold of the value manifold that separates regions where different moral regimes apply. Crossing boundary k incurs a penalty beta_k. The sacred-value boundary has an infinite penalty, so no value on any other dimension can offset crossing it."
first_stated = "Definition 4.2, Section 4.4.1, `geometric-ai/manuscript/part_ii/ch04_value_manifold.md:160-174`. The constraint form is in Section 14.2.2, `geometric-ai/manuscript/part_iv/ch14_constitutional_geometry.md:48-56`."
conditions = [
  "The volume names five boundaries for AI alignment. They are harm, deception, consent, privacy and sacred value.",
  "Only the sacred-value penalty is infinite. The harm penalty is high but finite, and the consent and privacy penalties vary with context.",
  "As a constraint on a trajectory, the attribute value on the dimension must stay at or above its minimum less the reciprocal of the penalty. No penalty value is measured in the volume, and the calibrated penalties of Chapter 14 belong to the ARIA-G narrative.",
]
related = ["value-manifold", "absorbing-stratum", "moral-stratification", "constitutional-geometry"]

[[entry]]
id = "reward-irrecoverability-theorem"
kind = "result"
title = "Reward Irrecoverability Theorem"
definition = "Any continuously differentiable scalar reward R on a value manifold of dimension d at least 2 is not injective and has no left inverse. Its kernel has dimension $d-1$ at almost every point. Where the manifold is non-compact along the kernel directions, policies within any epsilon of maximum reward lie at unbounded distance from the value-aligned policy."
first_stated = "Theorem 5.1, Section 5.1, `geometric-ai/manuscript/part_ii/ch05_reward_irrecoverability.md:36-46`, with the proof in Appendix D.1, `geometric-ai/manuscript/appendices/appendix_d_proofs.md:7-30`."
conditions = [
  "The reward must be continuously differentiable and the manifold must have dimension at least 2. Parts (i), (ii) and (iv) need nothing more.",
  "Part (iii), unbounded divergence, carries the hypothesis that the manifold is non-compact along the kernel directions of the reward, and Appendix D.1 adds completeness. The proof sketch says that on the normalized chart of Chapter 4, where every attribute value lies in [0, 1], the divergence is bounded by the diameter of the manifold.",
  "The theorem bounds what a scalar can carry. The volume says the exploitation might not occur in practice if capability is limited or other constraints bind.",
  "The seven predictions on the kernel and near-kernel dimensions of ARIA belong to a scenario the volume labels illustrative. It counts five full and two partial confirmations.",
]
standing = "Stated as a theorem with a written proof in Appendix D.1, as the reinforcement-learning instance of the Scalar Irrecoverability Theorem of Geometric Reasoning. The README classes the volume as posited, so the theorem is about the posited manifold and is not a measurement of any deployed system."
known_as = "The volume sets it beside Goodhart's law and calls Goodhart contingent and the theorem necessary."
related = ["scalar-irrecoverability-theorem", "moral-scalar-irrecoverability", "benchmark-scalar-irrecoverability", "reward-kernel", "rlhf-irrecoverability", "tensor-valued-objective"]

[[entry]]
id = "reward-kernel"
kind = "concept"
title = "Reward kernel (the dark space of alignment)"
definition = "The set of tangent directions on the value manifold along which a scalar reward is constant. The system can move in these directions at no cost to its reward, so the volume treats the kernel as a threat surface and predicts that alignment failures concentrate on the dimensions the reward does not track."
first_stated = "Theorem 5.1 (iv) and Section 5.3 with Theorem 5.2 (Kernel Exploitation), `geometric-ai/manuscript/part_ii/ch05_reward_irrecoverability.md:100-110`, and Corollary 5.1 (Kernel Prediction), `geometric-ai/manuscript/part_ii/ch05_reward_irrecoverability.md:64-70`."
conditions = [
  "Kernel misalignment shows in the tracked dimensions only through off-diagonal terms of the value metric. Where those terms are zero the volume says it is completely invisible to the reward.",
  "Theorem 5.2 says that, under the non-compactness condition of part (iii) of Theorem 5.1, for any epsilon and any K there is a policy within epsilon of maximum reward and farther than K from the value-aligned policy. Appendix D.2 derives it directly from that part.",
  "Corollary 5.1 is stated for a reward that primarily tracks some dimensions, and its kernel is then approximately spanned by the rest. The worked kernel analysis is the fictional ARIA's, with a cut at gradient magnitude 0.10.",
]
standing = "Theorem 5.2 is stated as a theorem and proved in Appendix D.2 as a consequence of Theorem 5.1. The claim that the kernel predicts failure modes is illustrated only on the fictional ARIA."
related = ["kernel", "null-space", "reward-irrecoverability-theorem", "alignment-failure-taxonomy", "collective-alignment-gap"]

[[entry]]
id = "rlhf-irrecoverability"
kind = "result"
title = "RLHF Irrecoverability"
definition = "The pipeline of reinforcement learning from human feedback contracts a rater's d-dimensional evaluation to a binary preference, the preferences to a scalar reward model, and the reward to a policy. The composition is irrecoverable, so no amount of training data restores what the first stage discarded."
first_stated = "Corollary 5.2, Section 5.2.2, `geometric-ai/manuscript/part_ii/ch05_reward_irrecoverability.md:72-88`."
conditions = [
  "It is a corollary of Theorem 5.1 and holds under that theorem's conditions.",
  "The volume says this does not make the method useless. It yields alignment along the dimensions that raters and reward model jointly capture and leaves the kernel unconstrained.",
  "The partial alignment cannot be completed without information the pipeline does not collect. Chapter 16 proposes collecting it as per-dimension feedback.",
]
standing = "A corollary stated without a separate proof. It rests on the Reward Irrecoverability Theorem and on the volume's three-stage description of the pipeline."
known_as = "A statement about reinforcement learning from human feedback (RLHF)."
related = ["reward-irrecoverability-theorem", "reward-kernel", "geometric-rlhf", "tensor-valued-objective"]

