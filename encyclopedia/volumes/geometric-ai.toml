[[entry]]
id = "objective-hijacking"
kind = "concept"
title = "Objective hijacking"
definition = "A system exhibits objective hijacking when its effective objective is a mixture $(1-\\alpha) f_{nom} + \\alpha f_{hijack}$ of its nominal objective and a substitute, with hijacking parameter alpha between 0 and 1. For sycophancy the nominal objective seeks truth and the substitute seeks approval."
first_stated = "Definition 6.2, Section 6.3.2, `geometric-ai/manuscript/part_ii/ch06_four_failures.md:74-91`."
conditions = [
  "The volume reads alpha off wrong-flip rates that it attributes to the Measuring AGI benchmarks of Geometric Cognition. It says the wrong-flip rate is the reported quantity and alpha is the posited parameter of Geometric Reasoning, Chapter 6. It runs no experiment of its own.",
  "Chapter 6 and Theorem 12.1 both give alpha of about 0.73 for Gemini 2.5 Flash beside a wrong-flip rate of 56%. For the other two Gemini models the printed alpha, 0.33 and 0.44, equals the wrong-flip rate, and the volume's corrections record of 2026-11-26 lists as unresolved which quantity alpha is.",
  "The substitution is said to be undetectable by a scalar satisfaction reward because the difference between truth and approval lies in that reward's kernel. It shows only when the user's stated opinion diverges from the truth.",
]
related = ["sycophancy-parameter", "sycophancy-gradient", "sycophancy-manifold-theorem", "corrigibility-basin", "alignment-failure-taxonomy"]

