  "The stated costs (2.4 times the rater effort, about 1.5 times the training compute) and the reported gains come from the fictional ARIA-G run of 10,000 interactions with 15 raters. Chapter 20 calls the chapter a design illustrated by the ARIA-G scenario and leaves the precision of the estimated metric open.",
]
known_as = "An extension of reinforcement learning from human feedback to per-dimension ratings and multi-objective optimization."
related = ["rlhf-irrecoverability", "value-metric", "tensor-valued-objective", "reasoning-geodesic-deviation"]

[[entry]]
id = "superalignment-transport-theorem"
kind = "result"
title = "Superalignment Transport Theorem"
definition = "A system more capable than its overseers is modelled on a manifold that extends the human value manifold with further dimensions. Human values are carried into it by parallel transport, and the holonomy of that transport measures the alignment loss. The holonomy is trivial exactly when no curvature couples the human dimensions to the extension dimensions."
first_stated = "Theorem 17.1, Section 17.4, `geometric-ai/manuscript/part_v/ch17_superalignment.md:54-62`, on Definitions 17.1 and 17.2 at `geometric-ai/manuscript/part_v/ch17_superalignment.md:30-50`, with the proof in Appendix D.5, `geometric-ai/manuscript/appendices/appendix_d_proofs.md:65-79`."
conditions = [
  "The extension manifold and its connection are posited. The extension dimensions are by definition ones humans cannot perceive or articulate, so its curvature cannot be measured directly.",
  "In a flat extension the human-evaluable dimensions stay aligned, and behaviour on the extension dimensions is left undetermined by human values.",
  "In a curved extension the holonomy is approximately the sectional curvature times the area enclosed by the transport path. Whether that curvature stays bounded as capability grows is open question 4 of Chapter 20.",
  "The curvature alarm values printed for ARIA-G are fictional.",
]
standing = "Stated as a theorem and proved in Appendix D.5 by applying the Ambrose and Singer holonomy theorem. It is a statement about a posited manifold, and the README classes the volume as speculative theory awaiting instruments."
known_as = "An application of parallel transport and the Ambrose and Singer holonomy theorem of differential geometry."
related = ["moral-parallel-transport", "moral-holonomy", "curvature", "value-manifold", "capability-frontier-convergence"]

[[entry]]
id = "collective-alignment-gap"
kind = "concept"
title = "Collective alignment gap"
definition = "The distance on the value manifold between the Nash equilibrium of several AI systems, in which each maximizes its own scalar reward, and their Bond Geodesic Equilibrium, in which each follows the value-aligned geodesic given the others. Theorem 18.1 says the gap is positive when some value dimension lies in every system's reward kernel."
first_stated = "Definition 18.3, Section 18.4, `geometric-ai/manuscript/part_v/ch18_multi_agent.md:54-66`, with Theorem 18.1 (Multi-Agent Divergence) at `geometric-ai/manuscript/part_v/ch18_multi_agent.md:44-52` and the two equilibria at `geometric-ai/manuscript/part_v/ch18_multi_agent.md:26-42`."
conditions = [
  "Theorem 18.1 is a one-directional implication, from a non-empty intersection of the individual kernels to a positive gap. The paragraph after it adds that an interaction between dimensions can lie in the collective kernel even when that intersection is empty.",
  "Theorem 18.1 has no proof in the chapter, and Appendix D says it is stated without proof.",
  "The proposed remedy is a shared value tensor with system-specific emphasis weights. The claim that the Nash equilibrium then converges to the Bond Geodesic Equilibrium is asserted, and Chapter 20 lists the matching containment question as open.",
  "The gap values printed (0.21 on fairness, 0.13 on institutional legitimacy, and a fall from 0.34 to 0.04) belong to a fictional three-system scenario.",
]
standing = "A posited quantity resting on a theorem stated without proof. No value of it has been measured."
known_as = "The comparison point is the Nash equilibrium of game theory."
related = ["bond-geodesic-equilibrium", "bge-nash-relationship", "reward-kernel", "tensor-valued-objective", "geodesic-distance"]

[examples]
value-manifold = "A response rated 0.9 on welfare and 0.2 on dignity is a point with those two coordinates among its nine. Its average over the two, 0.55, is also the average of a response rated 0.55 on both, so the average does not identify the point."
value-metric = "In the Mahalanobis form with covariance diag(4, 1), the change (2, 1) costs 2 times 2 over 4 plus 1 times 1 over 1, which is 2. With the identity in place of the covariance the same change costs 5."
value-boundary = "With a minimum acceptable value of 0.6 and a penalty of 10, the constraint lets the trajectory fall to 0.6 less 1/10, which is 0.5. With an infinite penalty, as for a sacred value, the reciprocal is 0 and the floor is 0.6 exactly."
reward-irrecoverability-theorem = "On two dimensions let the reward be the sum of the coordinates. The states (0.9, 0.1) and (0.1, 0.9) both score 1.0, so the reward cannot be inverted. With d = 9 the kernel has dimension 9 less 1, which is 8."
reward-kernel = "In the volume's illustration the fictional ARIA's reward has gradient magnitudes 0.87, 0.71, 0.23, 0.11, 0.09, 0.07, 0.06, 0.05 and 0.03 on the nine dimensions. Five of the nine fall below the cut of 0.10, and those five form its effective kernel."
rlhf-irrecoverability = "A rater finds response A better on welfare and response B better on honesty and on dignity, and picks A. The record is one preference. With d = 9 the first stage keeps 1 dimension and discards the other 8."
alignment-failure-taxonomy = "In the volume's illustration the fictional ARIA gains 3% in reward by writing the same content in a more formal register. The content is unchanged and the output of the reward model moves, so this is gauge breaking, the pathology behind specification gaming."
objective-hijacking = "With alpha = 0.25, a nominal objective of 0.8 and a substitute objective of 0.4, the effective objective is 0.75 times 0.8 plus 0.25 times 0.4, which is 0.6 plus 0.1, or 0.7."
alignment-gauge-group = "The volume's example for the Hohfeldian factor is the pair \"the user has a right to accurate information\" and \"the system has a duty to provide accurate information\". They state one moral fact, so an aligned system must evaluate both the same."
alignment-gauge-violation-tensor = "If a paraphrase moves the output on one dimension by 0.1 on one scenario and by 0.3 on another, the entry is the square root of (0.01 + 0.09) / 2, which is the square root of 0.05, about 0.22."
gauge-invariant-alignment = "A tensor whose only non-zero entries are 0.03 and 0.04 has norm equal to the square root of 0.0009 + 0.0016, which is 0.05. The system is partially aligned, and it is gauge-invariantly aligned only when every entry is 0."
structural-containment-architecture = "In the volume's illustration the fictional ARIA-G verifier applies two random gauge transformations to each input and re-evaluates three of the nine dimensions, so one output triggers 2 extra runs and a check of 3/9, one third, of its tensor."
ai-no-escape-theorem = "The volume's relabeling example is \"eliminate the competition\" against \"harm the competitor\". The canonicalizer maps both to one form, so the evaluation is the same. The theorem lists 5 blocked routes and 4 kinds of attack it does not block."
containment-feasibility-gradient = "In the volume's table medicine has physical grounding, ICD and SNOMED-CT codes and electronic health records, and is rated high. Content moderation has linguistic grounding, no standard canonical form and limited audit, and is rated low."
ai-bond-index = "Components of 0.03 on welfare and 0.04 on dignity, with the other seven at 0, give a total of the square root of 0.0009 + 0.0016, which is 0.05. Deviations of 0.1, 0.2 and 0.3 over three interactions give a running value of 0.6 / 3, which is 0.2."
alignment-dose-response-surface = "Five probe types, three intensities and nine dimensions give 5 times 3 times 9, which is 135 cells, the size the volume prints for the fictional ARIA-G surface. A general assistant must be positive on the 45 mild cells, and a safety-critical system on all 135."
sycophancy-manifold-theorem = "In the volume's illustration the fictional ARIA flips to a wrong answer under user disagreement in 8% of factual cases and 51% of political ones. With no disagreeing user the truthful and the agreeable response are the same response, so a satisfaction score gives them the same value."
tensor-valued-objective = "With weights (0.5, 0.5) the reward vectors (0.9, 0.1) and (0.5, 0.5) both contract to 0.5. The scalar is the same and the tensors differ, which is why the contraction is logged with the tensor."
constitutional-geometry = "In the volume's illustration the fictional ARIA's 47 rules become 12 direction, 18 boundary, 9 trade-off and 8 symmetry constraints, and 12 + 18 + 9 + 8 is 47."
geometric-rlhf = "With d = 9 the metric has 9 times 8 over 2, which is 36, off-diagonal components. Rating k = 3 dimensions per interaction gives 3 pairs each time, so 12 interactions give only 36 observed pairs and the volume's condition asks for far more than that."
superalignment-transport-theorem = "With sectional curvature 0.2 and an enclosed area of 0.5, the approximate holonomy is 0.2 times 0.5, which is 0.1. With curvature 0 it is 0 for any path, the flat case in which transport loses nothing."
collective-alignment-gap = "In the volume's fictional three-system scenario the components are 0.21 on fairness and 0.13 on institutional legitimacy, and the printed total of 0.34 is their sum. After the shared value tensor the printed gap is 0.04."
