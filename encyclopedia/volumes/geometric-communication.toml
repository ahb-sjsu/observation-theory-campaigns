[[entry]]
id = "spectral-trajectory-geodesic-deviation"
kind = "instrument"
title = "spectral trajectory and its geodesic deviation"
definition = "Slide a window of w frames with hop h across a spectrogram and compute a covariance matrix at each position, giving a sequence $\\Sigma_1, \\ldots, \\Sigma_K$ of SPD matrices. The geodesic deviation is the sum of the log-Euclidean distances between consecutive matrices minus the log-Euclidean distance from $\\Sigma_1$ to $\\Sigma_K$."
first_stated = "Definitions 4.9 and 4.10, `geometric-communication/manuscript/part_ii/ch04_three_geometries.md:358-370`."
conditions = [
  "The number of windows is $K = \\lfloor (T - w)/h \\rfloor + 1$ for a spectrogram of T frames.",
  "By the triangle inequality the deviation is at least zero, with equality if and only if the trajectory is a geodesic.",
  "The chapter reads high deviation as song complexity (a trill) and low deviation as a smooth transition (a descending whistle). This reading is the chapter's interpretation and is not tested separately.",
]
related = ["acoustic-geometric-feature-vector", "log-euclidean-distance", "geodesic-distance", "reasoning-geodesic-deviation", "covariance-matrix"]

[[entry]]
id = "hyperbolic-attention-bias"
kind = "instrument"
title = "hyperbolic attention bias"
definition = "A term $B_{geo}(i, j) = -\\alpha \\, d_{\\mathbb{B}}(e_i, e_j)$ added to a transformer's attention logits beside the position bias. Here $e_i$ and $e_j$ are Poincare ball embeddings of the tokens at positions i and j, $d_{\\mathbb{B}}$ is the Poincare distance, and $\\alpha$ is a learnable scalar. Tokens with nearby embeddings attend to each other more."
first_stated = "Section 5.6.2, `geometric-communication/manuscript/part_ii/ch05_hyperbolic_embeddings.md:256-264`, and Section 9.4.1, `geometric-communication/manuscript/part_iv/ch09_cuneiform.md:114-120`."
conditions = [
  "In the cuneiform model the embeddings are learnable, 32-dimensional, one for each of ByT5's 384 byte tokens, with curvature fixed at 1.0 and the scale initialised to 0.1. The bias enters the first four encoder layers.",
  "The bias is monotonically decreasing in hyperbolic distance when the scale is positive (Proposition 5.5).",
  "The ablation is reported as qualitative trends. A footnote of Chapter 9 says final numbers are not reported because they depend on seed, hardware and session, and the validation split has about 156 examples.",
  "Chapter 9 lists what was not measured. Supplementary data and augmentation are confounded, the number of biased layers and the curvature were not varied, and the bias acts on bytes and not on signs.",
]
standing = "A construction with an ablation that the volume reports only as relative trends. The volume's claim is a measurable improvement concentrated on rare and polysemous signs, with no score stated."
related = ["attention", "hyperbolic-embedding-advantage-regime", "translation-loop-residual", "translation-error-decomposition", "einstein-midpoint"]

[[entry]]
id = "hyperbolic-embedding-advantage-regime"
kind = "result"
title = "when hyperbolic embedding wins (Proposition 5.3)"
definition = "The advantage of a hyperbolic over a Euclidean embedding of a hierarchy grows with tree depth, with branching factor, and when the embedding dimension is fixed. It is negligible when the hierarchy is shallow (depth at most 3) and narrow (branching at most 4), when the dimension is unrestricted, or when the task does not depend on the tree."
first_stated = "Proposition 5.3 and the paragraphs around it, `geometric-communication/manuscript/part_ii/ch05_hyperbolic_embeddings.md:320-335`, with the coda comparison in Section 7.2.2, `geometric-communication/manuscript/part_iii/ch07_whale_communication.md:52-52`."
conditions = [
  "For the 28 sperm whale coda types in 16 dimensions the Euclidean baselines preserved taxonomic distance better. Classical MDS and PCA reached a Spearman correlation of 0.79, Isomap 0.77, and the Poincare embedding was lower. The chapter prints no value for it.",
  "The hyperbolic classifier reached 74.3% accuracy, which the chapter calls competitive with Euclidean baselines and not better. The split was random and not grouped by whale.",
  "The chapter says the decisive test would be a large hierarchy and that it has not run one. The scaling figure of Chapter 5 is simulated.",
]
standing = "A proposition stated without proof, motivated by the cited tree-embedding theorems. On the volume's own two cases the hyperbolic embedding did not outperform Euclidean baselines, and the chapters say so."
known_as = "The low-distortion tree embedding of Sarkar (2011) and the Poincare embeddings of Nickel and Kiela (2017), both cited by the chapter."
related = ["hyperbolic-attention-bias", "spearman-correlation", "distortion", "embedding", "split"]

[[entry]]
id = "decoder-robustness-index"
