definition = "With normative relations modelled by a $D_4$ gauge group on the Hohfeldian square, the order in which two considerations are presented changes the judgment only on cross-type paths, where the factors point toward different vertices. On within-type paths the gate elements commute and the Wilson loop is the identity."
first_stated = "Proposition 13.3, `geometric-communication/manuscript/part_v/ch13_gauge_theory.md:398-406`, with the Wilson loop table at `geometric-communication/manuscript/part_v/ch13_gauge_theory.md:375-388`."
conditions = [
  "The evidence cited is SQND Protocol 2 with 640 evaluations over 8 scenarios. Two scenarios, journalist and teacher, showed path dependence (0.659 and 0.862 in the table) and six did not, with combined chi-squared 72.14 on 16 degrees of freedom.",
  "The sorting of the eight scenarios into cross-type and within-type is given after the results table, in the same section.",
  "The $D_4$ group itself rests on a quarter-turn r that cycles the four positions. The chapter says r needs a semantic trigger and is probabilistic, while the correlative exchange s held at 100%.",
  "For cross-type paths the proposition says the Wilson loop differs from the identity generically, not always.",
]
standing = "A proposition whose support is two of eight scenarios in one protocol. The chapter calls it a structural prediction confirmed by that protocol."
known_as = "Order effects in judgment, stated in the vocabulary of lattice gauge theory. Geometric Ethics v1.25 withdrew the dihedral group D4 for Hohfeldian transitions, a withdrawal this volume's text does not record."
related = ["hohfeldian-d4-group", "hohfeldian-dihedral-withdrawal", "semantic-gate", "legal-wilson-loop", "communication-fiber-bundle", "moral-holonomy"]

[examples]
communication-manifold = "In the volume's illustration, a spoken English apology and a formal Japanese apology with a bow are close in pragmatics and content and far apart in signal. A casual text message two hours later is closer to the English one in signal and far in pragmatics."
communication-metric = "With all three weights equal to 1 and factor distances of 3 in signal, 0 in pragmatics and 4 in content, the block-diagonal distance is the square root of 9 + 0 + 16, which is 5."
communication-distance-patterns = "A metric that sees only the signal distance reads a translation (large) and a paraphrase (moderate) as two sizes of the same thing, since both have pragmatic and content distances near zero. This is the volume's case of a word error rate."
communication-heuristic-field = "If the true cost to the intended reading is 5, an estimate of 3 is admissible and an estimate of 7 is not. In the volume's illustration, hearing the word bank in a talk about fishing gives a steep descent toward the riverbank reading."
communication-gauge-group = "In the volume's example, turning the sentence about the cat on the mat into its passive form is an element of R, reading it aloud is an element of F, and rendering it in French is an element of T. Saying it sarcastically is in none of them."
meaning-as-gauge-orbit = "An English assertion, its French translation and its written transcript are three points of one orbit, so they have one meaning. The sarcastic utterance of the same English words is a point of a different orbit."
communication-bond-invariance-principle = "Take a reference translation and a perfect paraphrase of it. They are related by an element of R, so a meaning evaluation must score them equally. The volume notes that the BLEU score of the paraphrase may be near zero, which is a gauge anomaly."
signal-scalar-gauge-trilemma = "A semantic distance read off the content coordinate is invariant and content-sensitive, and it needs the content, which the signal alone does not give. An n-gram overlap score is computable from the signal and content-sensitive, and it changes under paraphrase."
communication-scalar-irrecoverability = "If the signal, pragmatic and content factors had 20, 4 and 10 dimensions, a level set of one score would have 20 + 4 + 10 - 1 = 33 dimensions. The factor sizes are chosen for the arithmetic and are not the volume's."
acoustic-geometric-feature-vector = "A symmetric 16 by 16 matrix has 16 times 17 over 2 = 136 independent entries. Adding 4 trajectory features and 2 times 8 = 16 persistence features gives 156, as the volume prints."
spectral-trajectory-geodesic-deviation = "A spectrogram of 100 frames with window 20 and hop 10 gives (100 - 20)/10 + 1 = 9 matrices. If the three steps of a four-matrix path each have length 1 and the endpoints are 1 apart, the deviation is 3 - 1 = 2."
hyperbolic-attention-bias = "At the initial scale of 0.1, token pairs at hyperbolic distances 2 and 5 receive biases of -0.2 and -0.5, so the nearer pair gets more attention. The module adds 384 times 32 plus 1 = 12,289 parameters, as the volume prints."
hyperbolic-embedding-advantage-regime = "The coda taxonomy has 28 types and 3 distance levels in 16 dimensions, which the volume places in the negligible-advantage regime. There classical MDS reached a rank correlation of 0.79 and the Poincare embedding a lower one."
decoder-robustness-index = "A flip that changes tempo only scores 0.5 + 0.5 times 0.7/2.3, about 0.65, since the four weights sum to 2.3. Scores with mean 0.2, 75th percentile 0.5 and 95th percentile 1.0 give an index of 0.10 + 0.15 + 0.20 = 0.45. These scores are chosen for the arithmetic."
coda-boundary-asymmetry = "The volume's case is the pair 5R3 and 4R2. With 223 crossings one way and 0 the other, all 223 of 223 crossings run in one direction, which is the value 1 on the asymmetry scale for that pair."
coda-menzerath-law = "The volume's figures are a Spearman correlation of -0.269 over 8,719 codas. The sign is negative, so a coda with more clicks tends to have a shorter mean interval between clicks, and the size is well short of -1."
language-chart = "In the volume's example the English word silver, the Akkadian word kaspum and the Sumerian logogram KU.BABBAR label one point of the content manifold. The translation map sends the Akkadian label to the English one through that point."
translation-loop-residual = "A round trip that returns a text with similarity 0.92 to the original has a residual of 1 - 0.92 = 0.08, the volume's mean for commercial records. Its mean for private letters, 0.31, is about 3.9 times that."
translation-error-decomposition = "If the intrinsic holonomy were 0.05, the path error 0.10 and the chart error 0.08, the total would be 0.23, and better path selection could remove at most 0.10 of it. The three values are chosen for the arithmetic and are not the volume's."
hohfeldian-cross-lingual-transfer = "From the volume's figures, 44.5 divided by 79.99 is 0.556, the transfer efficiency of 55.6%. The transfer F1 exceeds the four-class chance level by 44.5 - 25 = 19.5 points."
communication-fiber-bundle = "In the volume's example the fiber over the content five units of silver is parameterised by language, register and notation. An English and a Hebrew rendering are two points of that fiber with the same image under the projection."
selective-path-dependence = "With the volume's actions r taking O to C to L to N to O and s exchanging O with C and L with N, applying r then s to O gives s(C) = O, and applying s then r gives r(C) = L. The two orders disagree, and in the volume's table 2 of 8 scenarios showed an order effect."
