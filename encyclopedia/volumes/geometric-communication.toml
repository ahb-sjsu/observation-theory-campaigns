  "In Chapter 8 the vector feeds a LightGBM model that carries 0.30 of the ensemble weight beside two convolutional networks.",
]
standing = "A definition of a feature pipeline. The complementarity claim made for it (Proposition 4.3) is stated without printed numbers."
