[volume]
number = 7
title = "Geometric Communication"
repo = "geometric-communication"
slug = "geometric-communication"
standing = "The README's epistemic-status note of 2026-07-14 calls this volume a posited framework, speculative theory awaiting instruments. It says that no communication-domain instrument has been evaluated by the series' admission filter (xbse), that none currently passes its gate, and that the claims are theory at licensed strength and not validated measurement."

[[entry]]
id = "communication-manifold"
kind = "concept"
title = "communication manifold"
definition = "The product $M = S \\times P \\times C$ of a signal manifold S (the physical carriers), a pragmatic manifold P (intentions, social relations, illocutionary forces) and a content manifold C (semantic meanings). A communicative act is a point (s, p, c) of M, and a scalar evaluation is a projection of M to the real line."
first_stated = "Definition 3.1, `geometric-communication/manuscript/part_i/ch03_communication_manifold.md:46-56`."
conditions = [
  "The three factors are treated as independent. The chapter says the independence is not absolute and calls the product structure a zeroth-order approximation, with the dependencies carried by the off-diagonal terms of the metric.",
  "The chapter calls the product structure an empirical bet. Section 7.8 says the dimensionality of the communication manifold is not known.",
  "Coordinates are given only in part. The pragmatic factor is described as the hardest to measure directly.",
]
related = ["manifold", "communication-metric", "communication-gauge-group", "communication-scalar-irrecoverability", "projection"]

[[entry]]
id = "communication-metric"
kind = "concept"
title = "communication metric"
definition = "A Riemannian metric on the communication manifold written in three by three block form. The diagonal blocks are the metrics on signal, pragmatics and content, and the off-diagonal blocks carry the correlations between factors. With the off-diagonal blocks zero it reduces to $d^2 = \\alpha_S d_S^2 + \\alpha_P d_P^2 + \\alpha_C d_C^2$ with positive weights."
first_stated = "Definition 3.2, `geometric-communication/manuscript/part_i/ch03_communication_manifold.md:135-141`, with the block-diagonal form at `geometric-communication/manuscript/part_i/ch03_communication_manifold.md:127-131`."
conditions = [
  "The metric tensor is symmetric and positive definite. The chapter calls the block-diagonal form an approximation.",
  "The blocks are proposed, not fitted. The chapter suggests the log-Euclidean distance between spectral covariance matrices for acoustic signals, an embedding distance for content, and the Poincare ball distance for hierarchical content.",
  "No values of the weights or of the off-diagonal blocks are given.",
]
related = ["communication-manifold", "metric", "log-euclidean-distance", "communication-distance-patterns", "positive-definite"]

[[entry]]
id = "communication-distance-patterns"
kind = "concept"
title = "diagnostic distance patterns (translation, sarcasm, paraphrase)"
definition = "Three profiles of the factor distances. Translation has a large signal distance with pragmatic and content distances near zero. Sarcasm has a small signal distance with large pragmatic and content distances. Paraphrase has a moderate signal distance with the other two near zero. A scalar evaluation that projects onto one factor conflates at least two of them."
first_stated = "Proposition 3.2, `geometric-communication/manuscript/part_i/ch03_communication_manifold.md:183-191`."
conditions = [
  "The profiles are stated for a faithful translation and for the textual representation of sarcasm. In the acoustic representation the signal distance of sarcasm is nonzero because prosody differs.",
  "The entries of the table are qualitative (large, small, moderate, near zero). No distances are measured.",
  "In the full metric with cross-terms a signal change may induce a small content shift, which the volume calls the holonomy of translation.",
]
related = ["communication-metric", "communication-manifold", "communication-gauge-group", "translation-loop-residual"]

[[entry]]
id = "communication-heuristic-field"
kind = "concept"
title = "communication heuristic field"
definition = "A smooth function h on the communication manifold that gives, at each point, the estimated cost of reaching the intended communicative act. Its negative gradient points toward the interpretations the heuristic judges more likely. It is admissible if it never overestimates the distance to the intended meaning."
first_stated = "Definitions 3.3 and 3.4, `geometric-communication/manuscript/part_i/ch03_communication_manifold.md:205-217`."
conditions = [
  "Interpretation is modelled as search on the manifold. The hearer is given the signal and partial information about pragmatics and content.",
  "The field is not static. The chapter says it is assembled from at least four sources, among them linguistic convention and discourse context.",
  "An admissible heuristic may underestimate ambiguity. It is consistent only if it also satisfies the triangle inequality $h(m_1) \\le d(m_1, m_2) + h(m_2)$.",
  "The formalism is inherited from Geometric Reasoning. No heuristic field is estimated in this volume.",
]
known_as = "Admissible and consistent heuristics of A* search, and the principle of charity of Grice and Davidson, which the chapter names."
related = ["heuristic-field", "heuristic-admissibility", "communication-manifold", "communication-metric"]

[[entry]]
id = "communication-gauge-group"
kind = "concept"
title = "communication gauge group"
definition = "The group $G = T \\times R \\times F$ of meaning-preserving transformations. T relabels across languages, R paraphrases within a language, and F changes the modality between spoken, written and signed. A gauge transformation changes the signal coordinates and preserves the content and pragmatic coordinates, up to the holonomy of the transformation path."
first_stated = "Definition 3.5, `geometric-communication/manuscript/part_i/ch03_communication_manifold.md:263-273`."
conditions = [
  "Preservation is approximate for pragmatics. For a translation the chapter requires the content to be equal and the pragmatic force to be approximately equal.",
  "The chapter calls the re-description group the largest and least well-defined component, and says the framework does not solve the question of when two expressions are true paraphrases.",
  "Chapter 13 restates the group as the fiber-preserving automorphisms of a bundle and adds a register group. For Hohfeldian normative relations it reduces the group to $D_4 \\times U(1)_H$.",
]
related = ["communication-manifold", "meaning-as-gauge-orbit", "communication-bond-invariance-principle", "reasoning-gauge-transformation", "communication-fiber-bundle"]

[[entry]]
id = "meaning-as-gauge-orbit"
kind = "concept"
title = "meaning as a gauge orbit"
definition = "The meaning of a communicative act m is its equivalence class under the communication gauge group, the set of all $\\tau(m)$ for $\\tau$ in G. Two acts have the same meaning exactly when a gauge transformation relates them."
first_stated = "Proposition 3.4, `geometric-communication/manuscript/part_i/ch03_communication_manifold.md:319-323`, and earlier as the definition of Section 2.5.2, `geometric-communication/manuscript/part_i/ch02_saussure.md:223-225`."
conditions = [
  "It is a definition, and it depends on which transformations are admitted to the gauge group.",
  "The space of orbits is parameterized by the content manifold together with the pragmatic manifold.",
  "Sarcasm is not a gauge transformation, because it changes the pragmatic coordinates. A sarcastic and a sincere utterance of the same words lie in different orbits.",
]
related = ["communication-gauge-group", "quotient", "communication-bond-invariance-principle", "communication-manifold"]

[[entry]]
id = "communication-bond-invariance-principle"
kind = "concept"
title = "Communication BIP (Bond Invariance Principle for communication)"
definition = "An evaluation $\\phi$ that claims to measure meaning must satisfy $\\phi(\\tau(m)) = \\phi(m)$ for every act m and every transformation $\\tau$ of the communication gauge group. A dependence on the signal coordinates that is not mediated by the signal-pragmatic and signal-content cross-terms is called a gauge anomaly."
first_stated = "Definition 3.6, `geometric-communication/manuscript/part_i/ch03_communication_manifold.md:335-339`."
conditions = [
  "The chapter calls it a diagnostic criterion, not a normative aspiration. The test is to apply gauge transformations to a tool and check whether its output changes.",
  "Chapter 10 reads it as the claim that translation has zero holonomy, and says the principle is an ideal and not a description, because the content manifold is not flat everywhere.",
  "Features computable from the signal are invariant under a subgroup of the gauge group only. The chapter says they are not fully gauge-invariant.",
]
related = ["communication-gauge-group", "meaning-as-gauge-orbit", "reasoning-bond-invariance-principle", "moral-bond-invariance-principle", "signal-scalar-gauge-trilemma"]

[[entry]]
id = "signal-scalar-gauge-trilemma"
kind = "result"
title = "No Scalar Is Gauge-Invariant (Proposition 3.5)"
definition = "No scalar evaluation of a communicative act can be at once invariant under the communication gauge group, sensitive to differences in content, and computable from the signal alone. Any two of the three properties can hold together."
first_stated = "Proposition 3.5 and its proof sketch, `geometric-communication/manuscript/part_i/ch03_communication_manifold.md:353-355`."
conditions = [
  "The argument assumes that different signals can express the same content and that the same signal can arise in different languages, so a function of the signal alone cannot separate content classes.",
  "Invariance with content sensitivity is obtained by projecting onto the content manifold, which needs access to the content. Content sensitivity with computability from the signal is what standard metrics have, without invariance.",
  "The chapter names three ways to approximate invariance. They are parallel data, structured evaluation, and geometric features invariant under a subgroup.",
]
standing = "A proposition with a proof sketch. The volume gives no full proof and no machine-checked proof."
related = ["communication-bond-invariance-principle", "communication-gauge-group", "communication-scalar-irrecoverability", "meaning-as-gauge-orbit"]

[[entry]]
id = "communication-scalar-irrecoverability"
kind = "result"
title = "Communication Scalar Irrecoverability"
definition = "For any scalar evaluation $\\phi$ of a communicative act, each level set $\\phi^{-1}(r)$ is a submanifold of the communication manifold of codimension at most 1, so it has dimension dim(S) + dim(P) + dim(C) - 1. The scalar value alone does not recover the act's position in the discarded directions."
first_stated = "Theorem 3.1, `geometric-communication/manuscript/part_i/ch03_communication_manifold.md:389-395`, and in profile form as Theorem 1.1, `geometric-communication/manuscript/part_i/ch01_perplexity_trap.md:174-176`."
conditions = [
  "Chapter 3 says the statement follows from the dimensional mismatch between the manifold and the real line. Chapter 1 defers the proof to the parent theorem of Geometric Reasoning.",
  "The form of Theorem 1.1 needs quality profiles that are mutually Pareto-non-dominated across d independent dimensions. Its corollary says k scalar metrics with k below d still do not recover the profile.",
  "The corollary requires independent measurements. The chapter says BLEU, METEOR and chrF++ are nearly parallel projections.",
  "The examples in the theorem (a BLEU score of 0.35, a sentiment score of +0.8, a word error rate of 5%) are illustrations, not measurements.",
]
standing = "A theorem stated with an argument from dimension counting. The volume has no written proof of its own and refers to Geometric Reasoning, Chapter 13."
related = ["scalar-irrecoverability", "benchmark-scalar-irrecoverability", "communication-manifold", "projection", "pareto-dominance", "signal-scalar-gauge-trilemma"]

[[entry]]
id = "acoustic-geometric-feature-vector"
