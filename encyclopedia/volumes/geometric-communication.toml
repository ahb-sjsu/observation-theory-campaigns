title = "Decoder Robustness Index (DRI)"
definition = "Perturb each signal with nine acoustic transforms at eleven intensities, re-extract the inter-click intervals, decode, and score each outcome by a graded distance $\\omega$ that is 0 for an unchanged label and between 0.5 and 1 for a flip. The index is 0.5 times the mean of $\\omega$ plus 0.3 times its 75th percentile plus 0.2 times its 95th percentile."
