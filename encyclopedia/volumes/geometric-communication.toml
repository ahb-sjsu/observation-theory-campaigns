[[entry]]
id = "language-chart"
kind = "concept"
title = "language chart and translation map"
definition = "A language L is a coordinate chart on the content manifold, a domain $U_L$ of expressible meanings with a map $\\varphi_L$ to the language's expressions. The translation map from $L_1$ to $L_2$ is the transition function $\\varphi_{L_2} \\circ \\varphi_{L_1}^{-1}$, defined on the overlap of the two domains."
first_stated = "Definitions 10.1 and 10.2, `geometric-communication/manuscript/part_iv/ch10_translation.md:26-40`."
conditions = [
  "The chart is partial. The domain need not cover the whole content manifold, and different languages have different domains.",
  "A meaning outside the overlap is untranslatable in this formulation. A meaning charted at lower resolution in the target language translates with a loss of precision.",
  "The chapter calls the transition map incomplete because it is pointwise. It adds parallel transport along a path, on the assumption that the content manifold is curved.",
]
related = ["communication-manifold", "translation-loop-residual", "translation-error-decomposition", "manifold", "meaning-as-gauge-orbit"]

[[entry]]
id = "translation-loop-residual"
kind = "instrument"
title = "translation loop residual"
definition = "For a text t and a chain of translations that returns to the starting language with result $\\hat{t}$, the residual is $\\rho(t) = 1 - \\mathrm{sim}(t, \\hat{t})$, where sim is a semantic similarity measure on the starting language. The volume uses it as a proxy for sectional curvature and as the empirical counterpart of holonomy."
first_stated = "Definition 10.7 and the genre table, `geometric-communication/manuscript/part_iv/ch10_translation.md:196-213`."
conditions = [
  "The value depends on the chosen similarity measure and on the translation systems in the chain. In the Old Assyrian run the similarity was chrF++ on the Akkadian transliteration and the return leg was a backtranslation by the trained model.",
  "The chapter reports mean residuals of 0.08 for commercial records, 0.14 for contracts, 0.23 for legal proceedings and 0.31 for private letters over 1,561 pairs, with F(3, 1557) = 142.7.",
  "Reading the residual as curvature of the content manifold is the volume's interpretation. The residual also contains the errors of the systems in the chain, which the chapter's own decomposition calls path error and chart error.",
  "A second table gives residuals with and without the hyperbolic attention bias. Chapter 9 says it does not report final numbers for that ablation.",
]
standing = "A defined quantity with one reported run. The identification with curvature is posited, in the sense of the README's status note of 2026-07-14."
known_as = "Round-trip or back-translation evaluation in machine translation."
related = ["language-chart", "translation-error-decomposition", "moral-holonomy", "curvature", "hyperbolic-attention-bias"]

[[entry]]
id = "translation-error-decomposition"
kind = "result"
title = "translation error decomposition"
definition = "The error of a translation system on a source text is written as a sum of three parts. Intrinsic holonomy is the minimum loss over all paths, fixed by the curvature of the content manifold. Path error is the extra holonomy of a path that is not the geodesic. Chart error comes from the system's imperfect representation of the two languages."
first_stated = "Proposition 10.3, `geometric-communication/manuscript/part_iv/ch10_translation.md:312-322`."
conditions = [
  "It presupposes the content manifold with a metric, its Levi-Civita connection, and languages as charts, all of which the volume posits.",
  "The holonomy part is called irreducible and is nonzero only where the source meaning lies outside the flat overlap of the two charts. The other two parts are called reducible.",
  "The path error is bounded through Proposition 10.2 by the maximum curvature times the area between the two paths, to leading order.",
  "The three parts are not measured separately anywhere in the volume.",
]
standing = "A proposition with a short proof inside the posited geometry. No experiment in the volume separates the three terms."
related = ["translation-loop-residual", "language-chart", "moral-parallel-transport", "curvature", "geodesic-distance"]

