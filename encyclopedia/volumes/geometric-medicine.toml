[[entry]]
id = "clinical-moral-injury"
kind = "concept"
title = "Moral injury as forced boundary crossing"
definition = "A clinician is morally injured when the institutionally mandated path requires crossing a boundary to which the clinician's own complex assigns a penalty above the clinician's tolerance threshold. Each such crossing adds the excess of the penalty over the threshold, and the sum over time is the cumulative moral injury."
first_stated = "Definition 13.1, `geometric-medicine/manuscript/part_v/ch13_moral_injury_theory.md:57-63`. It is anticipated in Section 7.2.3 and Proposition 7.5, `geometric-medicine/manuscript/part_ii/ch07_heuristic_spectrum.md:78-78` and `geometric-medicine/manuscript/part_ii/ch07_heuristic_spectrum.md:200-202`."
conditions = [
  "Three things must hold together, namely an institutional mandate, a boundary crossing, and a penalty above the threshold. A voluntary crossing or one below the threshold gives distress but not injury.",
  "Theorem 13.1 adds that the total never decreases and that above a clinician-specific critical level the heuristic is permanently altered, by inflated penalties (hypervigilance) or deflated ones (numbing).",
  "The penalties and thresholds of clinicians have not been measured. Chapter 14 marks its prediction from pre-crisis penalty profiles as not yet tested.",
  "Section 18.9 gives the claim the status consistent with the moral injury literature as Chapters 10 and 14 cite it, and says the attributed findings have not been checked against their sources. It adds that the claim generates novel predictions.",
]
standing = "A posited definition with stated predictions and no measurement. The volume distinguishes it from burnout and gives that distinction as a prediction to test."
related = ["clinical-moral-boundaries", "moral-residue-of-contraction", "clinical-heuristic-hierarchy", "forced-contraction", "triage-divergence-theorem"]

[examples]
clinical-decision-complex = "In the volume's intubation example the current state is a vertex with attribute vector (0.25, 0.5, 0.5, 0.2, 0.4, 0.3, 0.4, 0.6, 0.3), and intubation is an edge to the vertex (0.35, 0.5, 0.4, 0.1, 0.3, 0.2, 0.2, 0.7, 0.25). The outcomes score rises by 0.10 and the dignity score falls by 0.20."
clinical-edge-weight = "The volume's illustration for intubating a patient with advanced dementia has a change vector with squared Euclidean length 0.1025, an assumed covariance-weighted term of about 0.15, and a consent penalty of 10, so the weight is 0.15 + 10 = 10.15. Supportive care crosses no boundary and weighs about 0.05. Both totals are the volume's and are marked illustrative."
clinical-moral-boundaries = "Take a harm penalty of 10 and a futility penalty of 20, both inside the volume's typical ranges of 5 to 20 and 10 to 30. An action that crosses both adds 30 to its edge weight, and an action that crosses the sacred-value boundary has infinite weight whatever else it gains. The sum is arithmetic from the definition."
clinical-friction = "A path of three actions with weights 0.5, 10.25 and 1.25 has friction 12. If the only boundary crossed is one with penalty 10 on the second action, boundary friction is 10 and distance friction is 2. The numbers are arithmetic from the definition."
clinical-geodesic = "In the volume's illustration two edges leave the current state, intubation with weight 10.15 and supportive care with weight 0.05. The geodesic takes supportive care, although intubation is better on the outcomes score alone. The weights are the volume's illustrative ones."
forced-contraction = "In the volume's vignette Dr. Kim has ninety seconds for four patients, 22.5 seconds each, and can assess about two dimensions per patient. At zero time the operator keeps the outcomes score only, so two patients with outcomes 0.3 and trust 0.2 and 0.9 get the same category. The ninety seconds are the volume's and the two patients are arithmetic from the definition."
moral-residue-of-contraction = "If the path a triage rule forces has clinical friction 12 and the geodesic for the same patient has friction 4, the moral residue is 8. If the rule happens to pick the geodesic the residue is 0. The numbers are arithmetic from the definition."
qaly-irrecoverability = "The standard QALY reads the outcomes score only. Two patients with outcomes 0.5, one with trust 0.2 and one with trust 0.9, get the same value, and no function of that value can tell them apart. The kernel has dimension 9 - 1 = 8, which is the volume's count."
qaly-adequacy-conditions = "Comparing two pharmacologically similar drugs for one well-defined condition in a homogeneous population meets all three conditions, which is the volume's example. Add one available action that crosses the futility boundary and the third condition fails, so the scalar is no longer adequate whatever the first two say."
clinical-heuristic-admissibility = "Suppose one boundary has a trained penalty of 10, a true crossing cost of 15, and a probability of 0.5 of being crossed on the remaining path. The heuristic gives 5, the true expected boundary cost is 7.5, and the heuristic is admissible. With a trained penalty of 20 it gives 10 and overestimates. The numbers are arithmetic from the definition."
clinical-heuristic-hierarchy = "Let the true remaining cost be 10 and take epsilon as 0.1, the volume's figure for a clinician at the start of a career. An estimate of 10.5 is within 11 and is epsilon-admissible, with paths costing at most 1.1 times the optimum. An estimate of 15 is inadmissible. An estimate that reads 8 for continue the drug and 12 for do not stop the drug is gauge-variant."
consent-gauge-invariance = "The volume's test tells the patient that the surgery has a 90 percent success rate, and separately that it has a 10 percent failure rate. Since 100 - 90 = 10 the two say the same thing. A patient who accepts under the first and declines under the second fails the condition, whatever the signed form says."
consent-invariance-score = "A patient is tested under 5 reframings and keeps the same decision under 4 of them. The score is 4 / 5 = 0.8, which just meets the volume's example threshold of 0.8, and the one failed reframing shows where more explanation is needed. The count of 5 is arithmetic from the definition."
medical-bond-invariance-principle = "The volume's example is the algorithm studied by Obermeyer and colleagues (2019), which used health costs as a proxy for health needs. Changing the race recorded on the intake form, with the clinical state held fixed, would change its recommendation, and that is a violation. A recommendation that is the same for a dignity score recorded as 7 of 10 or 70 of 100 passes on that re-description."
proxy-pathfinding-divergence = "If the constant is 2 and the proxy's and the patient's heuristics differ by at most 3 at any state, the bound on the distance between their paths is 2 times 3 = 6. In the volume's case the son sets the futility penalty to 0 where the patient might have set it high. The numbers 2 and 3 are arithmetic from the statement."
triage-divergence-theorem = "One ventilator, a current patient and a new patient whose outcome gain from reallocation is worth 8. With an abandonment penalty of 15, the low end of the volume's typical range, and a trust penalty of 5, withdrawal costs 20 against a gain of 8, so the friction-minimizing allocation keeps the ventilator and the outcome-maximizing one moves it. The figures 8 and 5 are arithmetic from the statement."
collective-geodesic = "A healthy young adult bears friction 1 from vaccination and friction 0 from refusing, and vaccination lowers the friction of contacts by 3 in total. Alone the adult refuses. Summed over the population vaccination changes total friction by 1 - 3 = -2, so the collective geodesic includes it. The numbers are arithmetic from the definition."
public-health-mandate-justification = "If the covariance-weighted collective benefit is 4 and the autonomy cost is 1, the ratio is 4 and the third condition holds. If the same mandate crosses a sacred-value boundary it fails the second condition and is not justified at any ratio. The volume's own remark is that a mandate justified at 5 percent population immunity may not be justified at 85 percent."
clinical-bond-index = "A population of two patients under one policy. For the first the mandated path has friction 9 and the geodesic 5, an excess of 4. For the second the mandated path is the geodesic, an excess of 0. The index is (4 + 0) / 2 = 2. The numbers are arithmetic from the definition."
bond-index-disparity-ratio = "If the index is 4.6 for one population and 2.0 for another under the same policy, the ratio is 4.6 / 2.0 = 2.3, the volume's example reading. On the volume's illustrative thresholds a ratio of 2.0 or more is a critical disparity. The two index values are chosen to give the volume's 2.3."
clinical-moral-injury = "In the volume's example a clinician assigns the abandonment boundary a penalty of 100 and has a threshold of 50, so each forced crossing adds 100 - 50 = 50. A clinician with penalty 40 and the same threshold adds nothing. One forced crossing a day for thirty days gives thirty increments, a total of 30 times 50 = 1500, and that last product is arithmetic."
