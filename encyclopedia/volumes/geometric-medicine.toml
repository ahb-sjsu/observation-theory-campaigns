[volume]
number = 8
title = "Geometric Medicine"
repo = "geometric-medicine"
slug = "geometric-medicine"
standing = "The README's epistemic-status note of 2026-07-14 calls this volume a posited framework, speculative theory awaiting instruments, and says a clinical instrument is plausible but has not been built or gated. Its Section 18.9 says the framework has no direct empirical validation and the clinical Bond Index has not been computed from clinical data, and its front matter says the covariance matrix has not been estimated, so every number in these entries is an illustration unless the entry says otherwise."

[[entry]]
id = "clinical-decision-complex"
kind = "concept"
title = "Clinical decision complex"
definition = "A weighted simplicial complex on which clinical decisions are pathfinding problems. Each vertex is a clinical state with an attribute vector of nine clinical-moral scores, each edge is an available clinical action with a non-negative weight, and each higher simplex is a care bundle whose cost is evaluated as a unit."
first_stated = "Definition 4.1, `geometric-medicine/manuscript/part_ii/ch04_clinical_manifold.md:27-35`."
conditions = [
  "It is a simplicial complex and not a smooth manifold. The volume writes clinical manifold informally and means this complex.",
  "The nine dimensions are inherited from the moral manifold of Geometric Ethics, and each score lies between 0 and 1. Section 4.13 calls the nine-dimensional structure a model and an open empirical question.",
  "Section 4.13 says the complex is not a bedside calculator and does not produce unique solutions, because the covariance matrix, the boundary penalties and the goal region must be estimated from data.",
  "The covariance matrix has not been estimated. Section 18.9 gives the nine-dimensional claim the status theoretically grounded, empirically untested at scale.",
]
known_as = "A weighted simplicial complex. The volume gives it as the clinical instance of the moral manifold of Geometric Ethics."
related = ["moral-decision-complex", "nine-dimension-moral-chart", "clinical-edge-weight", "clinical-moral-boundaries", "clinical-geodesic", "moral-manifold"]

[[entry]]
id = "clinical-edge-weight"
kind = "concept"
title = "Clinical edge weight"
definition = "The cost of one clinical action. It is the quadratic form $\\Delta a^T \\Sigma^{-1} \\Delta a$ in the change of the patient's nine-component attribute vector, with $\\Sigma$ the 9 by 9 clinical-moral covariance matrix, plus the sum of the penalties $\\beta_k$ of the clinical-moral boundaries the action crosses."
first_stated = "Definition 4.2, `geometric-medicine/manuscript/part_ii/ch04_clinical_manifold.md:143-147`."
conditions = [
  "The volume calls the quadratic form the Mahalanobis distance. The formula has no square root.",
  "The covariance matrix has 45 independent entries and the theorems are said to hold for any positive-definite one. None of the entries has been estimated, and Section 4.5.2 says the framework runs on the qualitative structure until it is.",
  "With the identity as covariance matrix the first term reduces to the Euclidean form.",
  "The two worked weights of Section 4.4.3 are marked illustrative by the volume.",
]
related = ["mahalanobis-distance", "moral-decision-edge-weight", "clinical-moral-boundaries", "clinical-friction", "covariance-matrix"]

[[entry]]
id = "clinical-moral-boundaries"
kind = "concept"
title = "Clinical-moral boundaries"
definition = "Thresholds on the clinical decision complex where the decision regime changes discontinuously, each with a penalty added to the weight of any action that crosses it. Five are defined, namely harm, futility, consent, abandonment and sacred value. The sacred-value penalty is infinite, and the others are finite in at least some settings."
first_stated = "Definition 4.3, `geometric-medicine/manuscript/part_ii/ch04_clinical_manifold.md:165-175`."
conditions = [
  "The penalty ranges are given as typical calibrations in normalized units. They are not measured, and Section 4.12 says they must be calibrated for specific clinical populations.",
  "The consent penalty is about infinite for a competent patient outside an emergency and drops to a finite value in an emergency or when the patient lacks capacity.",
  "The harm penalty is high but finite, so a minimum-cost path may pass through harm, as in surgery.",
  "Later chapters use penalties outside the five, for example a trust penalty and a justice penalty in Theorem 10.1, without adding them to this definition.",
]
related = ["clinical-edge-weight", "clinical-decision-complex", "absorbing-stratum", "clinical-moral-injury", "clinical-heuristic-admissibility"]

[[entry]]
id = "clinical-friction"
kind = "concept"
title = "Clinical friction"
definition = "The total cost of a path on the clinical decision complex, the sum of the clinical edge weights of its steps. It splits into distance friction, the sum of the covariance-weighted terms, and boundary friction, the sum of the boundary penalties crossed."
first_stated = "Definition 4.6, `geometric-medicine/manuscript/part_ii/ch04_clinical_manifold.md:276-280`, with the decomposition at `geometric-medicine/manuscript/part_ii/ch04_clinical_manifold.md:288-294`."
conditions = [
  "Friction is a property of a path and not of a case. A clinically difficult case can have a low-friction minimum path.",
  "The volume calls distance friction reducible by better treatments and boundary friction structural.",
  "It inherits the unestimated covariance matrix and the uncalibrated boundary penalties of the edge weight.",
]
related = ["clinical-edge-weight", "clinical-geodesic", "clinical-bond-index", "moral-residue-of-contraction", "legal-friction"]

[[entry]]
id = "clinical-geodesic"
kind = "concept"
title = "Clinical geodesic"
definition = "The minimum-cost path on the clinical decision complex from the patient's initial state to the goal region, where cost is the sum of the nine-dimensional clinical edge weights. The volume takes it as the recommended plan of care."
first_stated = "Definition 6.2, `geometric-medicine/manuscript/part_ii/ch06_clinical_astar.md:106-112`."
conditions = [
  "The goal region is the set of states at or above a minimum acceptable attribute vector, and it is set jointly by clinician and patient.",
  "It may not exist. When a resource constraint removes edges, the goal region can become unreachable.",
  "It depends on the covariance matrix, the boundary penalties and the goal region, and different estimates give different geodesics.",
  "It is a minimum-cost path on a discrete complex and not a geodesic of a smooth metric. Section 18.9 gives the pathfinding model the status formally developed, not directly validated.",
]
known_as = "A shortest path in a weighted graph, which the volume searches with the A* algorithm of Hart, Nilsson and Raphael (1968)."
related = ["clinical-friction", "clinical-decision-complex", "clinical-edge-weight", "geodesic-distance", "bond-geodesic", "clinical-heuristic-admissibility"]

[[entry]]
id = "forced-contraction"
kind = "concept"
title = "Forced contraction"
definition = "A decision process in which a nine-dimensional clinical-moral state must be mapped to one of a finite set of triage categories under a time limit that prevents full nine-dimensional pathfinding. The contraction operator projects onto fewer dimensions as the available time falls, and onto survival probability alone at zero time."
first_stated = "Definition 2.1, `geometric-medicine/manuscript/part_i/ch02_triage_forced_contraction.md:86-86`."
conditions = [
  "The time limit is below a threshold. With unlimited time the operator is the clinical geodesic on the full complex.",
  "Time pressure contracts the assessment. Resource scarcity is treated separately, as the removal of edges from the complex.",
  "The claim that the operator loses dimensions as time falls is stated as part of the definition and is not measured.",
]
related = ["contraction", "moral-residue-of-contraction", "triage-divergence-theorem", "qaly-irrecoverability", "projection"]

[[entry]]
id = "moral-residue-of-contraction"
kind = "concept"
title = "Moral residue of contraction"
definition = "The clinical friction of the path a forced contraction mandates minus the clinical friction of the clinical geodesic on the full complex, for the same clinical state. It is never negative, and it is zero only when the contraction selects the same path as the geodesic."
first_stated = "Definition 2.2, `geometric-medicine/manuscript/part_i/ch02_triage_forced_contraction.md:102-108`."
conditions = [
  "Non-negativity holds because the forced path is one feasible path and the geodesic is the minimum-cost path.",
  "The definition is given in Chapter 2, before clinical friction is defined in Chapter 4.",
  "The volume says the residue accumulates in the clinician and alters the heuristic. That claim belongs to its account of moral injury and is not measured.",
]
known_as = "The volume takes the term moral residue from Epstein and Hamric (2009) and gives it this geometric reading."
related = ["forced-contraction", "clinical-friction", "clinical-geodesic", "clinical-moral-injury", "clinical-bond-index"]

[[entry]]
id = "qaly-irrecoverability"
kind = "result"
title = "QALY Irrecoverability Theorem"
definition = "Any continuous function that maps the nine-component clinical-moral attribute vector to one scalar value is not injective, has no left inverse, and yields a value-maximizing path that can differ from the clinical geodesic by more than any amount fixed in advance. For the standard QALY, which depends on the outcomes score alone, all variation on the other eight dimensions is lost."
first_stated = "Theorem 5.1, `geometric-medicine/manuscript/part_ii/ch05_qaly_irrecoverability.md:34-40`, with the kernel of the standard QALY in Corollary 5.1, `geometric-medicine/manuscript/part_ii/ch05_qaly_irrecoverability.md:72-76`. Previewed as Theorem 1.1."
conditions = [
  "The proof of non-injectivity uses rank and nullity where the function is differentiable and a dimension count where it is continuous.",
  "The unbounded divergence is shown by a constructed three-vertex complex in which the path the scalar prefers crosses a boundary whose penalty can be made as large as wished.",
  "Proposition 5.1 gives the case where the scalar is adequate. It needs a decision that activates mainly outcomes, a population homogeneous on the other eight dimensions, and no boundary crossed.",
  "The result is about loss of information under the map. That the nine dimensions are the right description of a clinical state is the volume's posited model.",
]
standing = "A theorem the volume proves in Section 5.2. Section 18.9 lists it as proved mathematically and consistent with the QALY critique literature."
known_as = "The rank-nullity theorem applied to a map from nine dimensions to one. The volume gives it as the clinical form of the Scalar Irrecoverability Theorem, which it cites as a conditional theorem of Geometric Reasoning (Theorem 13.1), and says its argument is a dimension count as in Geometric Ethics, Theorem 15.1."
related = ["scalar-irrecoverability", "moral-scalar-irrecoverability", "null-space", "qaly-adequacy-conditions", "clinical-geodesic", "economic-scalar-irrecoverability"]

[[entry]]
id = "qaly-adequacy-conditions"
kind = "result"
title = "When QALYs are adequate"
definition = "QALY-based analysis is an adequate approximation of the clinical geodesic when and only when three conditions hold together. The decision activates mainly the outcomes dimension, the patient population is homogeneous on the other eight dimensions, and no moral boundary is crossed by any available action."
first_stated = "Proposition 5.1, `geometric-medicine/manuscript/part_ii/ch05_qaly_irrecoverability.md:92-98`."
conditions = [
  "The volume says the conditions are approximately satisfied for routine cost-effectiveness comparisons of pharmacologically similar drugs for a well-defined condition in a homogeneous population.",
  "It says they are violated in end-of-life care, mental health, disability, resource rationing, vulnerable populations and cross-cultural care.",
  "The proposition is stated without a proof, and adequate approximation is not given a numerical tolerance.",
]
related = ["qaly-irrecoverability", "clinical-geodesic", "clinical-moral-boundaries", "triage-divergence-theorem"]

[[entry]]
id = "clinical-heuristic-admissibility"
kind = "result"
title = "Clinical heuristic admissibility"
definition = "A clinical moral heuristic estimates the remaining cost from a state as the sum over boundaries of the penalty $\\beta_k$ times the probability that the remaining path crosses boundary $k$. If each penalty is at most the true cost of crossing, the heuristic never overestimates the remaining cost, and A* search finds the clinical geodesic."
first_stated = "Theorem 7.1, `geometric-medicine/manuscript/part_ii/ch07_heuristic_spectrum.md:26-32`."
conditions = [
  "The hypothesis is that training calibrates each penalty as a lower bound on the true cost of crossing. The volume assumes this and does not measure it.",
  "The proof uses the fact that the heuristic ignores the remaining distance cost, which is non-negative.",
  "When a penalty exceeds the true cost somewhere, the heuristic is inadmissible and the search may avoid the optimal path. The volume names moral injury, defensive medicine and personal trauma as mechanisms.",
]
standing = "A theorem with a short proof in Section 7.1, conditional on the calibration hypothesis. Section 18.9 gives the underlying pathfinding model the status formally developed, behaviorally plausible, not directly validated."
known_as = "Admissibility of an A* heuristic, with the optimality result of Hart, Nilsson and Raphael (1968)."
related = ["heuristic-admissibility", "heuristic-field", "clinical-heuristic-hierarchy", "clinical-moral-boundaries", "clinical-geodesic", "euclidean-heuristic-admissibility"]

[[entry]]
id = "clinical-heuristic-hierarchy"
kind = "concept"
title = "Four-category hierarchy of clinical heuristics"
definition = "A grading of a clinical heuristic $h$ against the true remaining cost $h^*$. It is strictly admissible when it is far below $h^*$, epsilon-admissible when $h \\le (1 + \\varepsilon) h^*$ for a small $\\varepsilon$, inadmissible when it exceeds $h^*$ somewhere, and gauge-variant when its value changes under a meaning-preserving re-description of the situation."
first_stated = "Section 7.2, Definitions 7.1 to 7.4, `geometric-medicine/manuscript/part_ii/ch07_heuristic_spectrum.md:38-90`."
conditions = [
  "An epsilon-admissible heuristic gives paths that cost at most $(1 + \\varepsilon)$ times the optimal cost.",
  "The volume reserves the label cognitive bias for the gauge-variant category, with omission bias as its first example.",
  "The values of epsilon quoted for trainees and experienced clinicians are not measured. Proposition 7.5, that moral injury raises epsilon on the violated dimension only, is given as a testable prediction.",
  "As written, a heuristic that overestimates slightly meets both the epsilon-admissible and the inadmissible definitions. The volume separates them by whether the error is small.",
]
known_as = "Admissible and bounded-suboptimal heuristics of A* search. The fourth category is the framing effect of the decision literature."
related = ["clinical-heuristic-admissibility", "heuristic-admissibility", "reasoning-gauge-transformation", "consent-gauge-invariance", "clinical-moral-injury"]

[[entry]]
id = "consent-gauge-invariance"
kind = "result"
title = "Consent as gauge invariance"
definition = "Consent is valid only if the patient's chosen path is the same under every meaning-preserving change in how the options are described, for example 90 percent survival restated as 10 percent mortality. A decision that changes under such a reframing shows that understanding or voluntariness is inadequately calibrated."
first_stated = "Theorem 8.1, `geometric-medicine/manuscript/part_ii/ch08_consent_gauge.md:79-85`."
conditions = [
  "The theorem gives a necessary condition only. Its opening sentence says that valid consent requires the invariance, and the formal statement and the proof give that direction.",
  "The proof rests on the Bond Invariance Principle, which the volume calls the foundational axiom of the Geometric Ethics programme.",
  "The test covers the reframings presented and no others. The volume lists positive against negative framing, absolute against relative risk, gains against losses, and natural frequencies against percentages.",
  "The pilot figures of Chapter 17 (84 patients, a correlation of -0.41 between framing variance and health literacy) belong to the scenario of Sarah Chen, a composite character. Section 17.6 labels the scenario illustrative and says that no such study has been run and that the numbers are invented.",
]
standing = "A theorem derived from an axiom. Section 18.9 gives it the status formally developed, untested, illustrated by a hypothetical pilot (Section 17.6), full study not yet conducted."
known_as = "Framing effects in decision research. The volume's test asks for invariance of choice under equivalent descriptions."
related = ["medical-bond-invariance-principle", "consent-invariance-score", "moral-bond-invariance-principle", "judgment-gauge-invariance", "cognitive-framing-displacement", "paraphrase-class"]

[[entry]]
id = "consent-invariance-score"
kind = "instrument"
title = "Consent invariance score"
definition = "For a set of $m$ meaning-preserving transformations of the clinical information, the share of them under which the patient's decision stays the same. A score of 1 means the decision is invariant under all tested transformations, and 0 means it changes under every one."
first_stated = "Definition 8.4, `geometric-medicine/manuscript/part_ii/ch08_consent_gauge.md:265-269`."
conditions = [
  "The score depends on which transformations are in the set, and it says nothing about transformations not tested.",
  "It is proposed as a supplement to the legal consent checklist and not a replacement.",
  "The threshold of 0.8 is given as an example of an institutional standard. No study with the score is reported. The pilot of Section 17.6 is labelled an illustrative scenario with invented numbers.",
]
related = ["consent-gauge-invariance", "medical-bond-invariance-principle", "bond-index", "paraphrase-class"]

[[entry]]
id = "medical-bond-invariance-principle"
kind = "concept"
title = "Medical Bond Invariance Principle"
definition = "Clinical evaluations must be invariant under patient re-description. If a re-description of the patient's state preserves the attribute vector, for example a different physician, language or chart format, the clinical geodesic must be the same."
first_stated = "Definition 8.3, `geometric-medicine/manuscript/part_ii/ch08_consent_gauge.md:161-165`."
conditions = [
  "It is a normative requirement, stated as a definition. It applies only to re-descriptions that leave the nine-component attribute vector unchanged, and deciding which do is a judgment.",
  "The volume reads algorithmic bias as a violation, when a recommendation changes with race, zip code or insurance status.",
  "Section 18.3 says the symmetry group is identified in principle only, and the front matter says the conservation law for clinical reasoning remains conjectural. Section 18.3 adds that Noether's theorem needs a continuous symmetry, that the re-descriptions the book lists are discrete, and that whether the group has a continuous part is open.",
]
known_as = "The clinical instance of the Bond Invariance Principle of Geometric Ethics."
related = ["moral-bond-invariance-principle", "consent-gauge-invariance", "consent-invariance-score", "reasoning-bond-invariance-principle", "judicial-bond-invariance-principle"]

[[entry]]
id = "proxy-pathfinding-divergence"
kind = "result"
title = "Proxy pathfinding divergence"
definition = "When a proxy decides for a patient, the search runs on the patient's complex with the proxy's heuristic. The distance between the proxy's path and the patient's own is at most a constant $K$ times the largest difference between the two heuristics, and no calibration can guarantee that difference is small without direct knowledge of the patient's heuristic."
first_stated = "Theorem 9.1, `geometric-medicine/manuscript/part_iii/ch09_clinical_cases.md:282-288`, after Definition 9.2 at `geometric-medicine/manuscript/part_iii/ch09_clinical_cases.md:268-272`."
conditions = [
  "The constant is said to depend on the curvature of the clinical decision complex. Neither the constant nor the distance between two paths is defined.",
  "The theorem is stated without a proof.",
  "It applies when the patient lacks capacity, so the patient's heuristic cannot be observed directly. The volume's remedy is to elicit the patient's values indirectly before major decisions.",
]
standing = "Labelled a theorem and stated without proof. The volume reads it as a structural limitation, that proxy pathfinding is fundamentally uncertain."
related = ["clinical-geodesic", "clinical-heuristic-admissibility", "heuristic-field", "consent-gauge-invariance"]

[[entry]]
id = "triage-divergence-theorem"
kind = "result"
title = "Divergence of utilitarian and manifold-optimal triage"
definition = "The allocation that maximizes total outcomes equals the allocation that minimizes total clinical friction when triage activates only the outcomes dimension and crosses no moral boundary. They differ when a boundary is crossed or another dimension is active, as in ventilator withdrawal, age-based deprioritization and the choice of a lottery between similar prognoses."
first_stated = "Theorem 10.1, `geometric-medicine/manuscript/part_iv/ch10_pandemic_triage.md:79-89`, on the triage problem of Definition 10.1, `geometric-medicine/manuscript/part_iv/ch10_pandemic_triage.md:24-35`."
conditions = [
  "Both allocations obey the same resource bound. The triage problem is a set of patients, one complex and one goal region per patient, and that bound.",
  "In the withdrawal case the allocations differ only when the abandonment and trust penalties exceed the outcome differential between the two patients.",
  "The proof is an argument from the form of the edge weight. The penalties it uses are not calibrated, and the trust and justice penalties are not among the five boundaries of Definition 4.3.",
  "The three predictions about clinician distress in Section 10.5 are stated as expectations. A dated note of 2026-11-26 says the findings the section attributes to published work have not been checked against that work and that no study it cites was designed to test the predictions.",
]
standing = "A theorem with an argument given in Section 10.2. Its numerical content depends on boundary penalties that have not been estimated."
related = ["forced-contraction", "clinical-friction", "clinical-moral-boundaries", "qaly-adequacy-conditions", "clinical-moral-injury", "allocation"]

[[entry]]
id = "collective-geodesic"
kind = "concept"
title = "Collective geodesic"
definition = "For a population, the allocation of a resource such as vaccine doses that minimizes the sum of clinical friction over all its members. It differs from the Nash equilibrium of individual geodesics, in which each member minimizes their own friction without counting effects on others."
first_stated = "Definition 11.1 and Theorem 11.1, `geometric-medicine/manuscript/part_iv/ch11_allocation.md:23-37`."
conditions = [
  "Theorem 11.1 says the two diverge whenever individual decisions create externalities on the social dimension, and that the divergence is proportional to the herd immunity contribution.",
  "The theorem is stated without a proof.",
  "Friction here inherits the unestimated covariance matrix and boundary penalties.",
]
known_as = "The gap between a social optimum and a Nash equilibrium under externalities."
related = ["clinical-geodesic", "clinical-friction", "public-health-mandate-justification", "bge-nash-relationship", "bond-geodesic-equilibrium"]

[[entry]]
id = "public-health-mandate-justification"
kind = "concept"
title = "Geometric justification of a public health mandate"
definition = "A mandate is geometrically justified when three conditions hold together. The collective geodesic differs from the Nash equilibrium of individual choices, the restriction of autonomy crosses no sacred-value boundary, and the collective benefit on outcomes and social impact exceeds the individual cost on autonomy under the community's covariance matrix."
first_stated = "Definition 11.3, `geometric-medicine/manuscript/part_iv/ch11_allocation.md:124-134`."
conditions = [
  "All three conditions are necessary. A mandate that crosses a sacred-value boundary is never justified, whatever the collective benefit.",
  "Proposition 11.4 says the justification is not static, because the proportionality condition can stop holding as population immunity, transmissibility and treatment change.",
  "The proportionality ratio needs the community's covariance matrix, which has not been estimated. The applications to vaccination and quarantine are qualitative.",
]
related = ["collective-geodesic", "clinical-moral-boundaries", "clinical-edge-weight", "absorbing-stratum"]

