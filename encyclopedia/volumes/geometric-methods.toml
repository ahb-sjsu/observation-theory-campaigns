definition = "The mean number of retrieval slots per point, $\\rho = n_q k / n$, when $n_q$ queries each return k neighbours from n points. A corpus with no hub structure still shows a k-occurrence skewness of $1/\\sqrt{\\rho}$, so the null of a hubness reading rises as the budget falls."
first_stated = "Section 17.11.2, `geometric-methods/chapters/chapter-17-scaling.md:482-490`."
conditions = [
  "The null assumes every point is equally likely to be returned, so its count is close to Poisson with mean equal to the budget.",
  "Every count statistic is quoted with its budget, and a comparison made at two budgets compares two nulls.",
  "The volume's rule is to keep the budget at 2 or more where a decision depends on the count. Below that the null dominates every statistic.",
  "The measured table is from one corpus, 1024-dimensional embeddings of Wikipedia passages in the openvector-bench repository, and is not peer reviewed.",
]
standing = "The identities of Section 17.11 are proved and checked symbolically in `formal/matlab/ch17_neighbourhood_stats.m`. The measurements are demonstrated or exploratory, as each source file states."
related = ["hubness", "anti-hub", "poisson-ceiling", "skewness", "attractiveness-skew", "null-model"]

