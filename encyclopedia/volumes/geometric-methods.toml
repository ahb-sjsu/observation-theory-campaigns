[[entry]]
id = "pairwise-interaction-matrix"
kind = "concept"
title = "pairwise interaction matrix"
definition = "Let $\\Delta_i$ be the rise in error from removing dimension i alone. The pairwise interaction $\\Phi_{ij}$ is the rise from removing both i and j, minus $\\Delta_i + \\Delta_j$. A positive value marks a redundant pair, each standing in for the other. A negative value marks a complementary pair, each needing the other."
first_stated = "Section 12.1.3, `geometric-methods/chapters/chapter-12-compositional-testing.md:76-94`."
conditions = [
  "The matrix is symmetric with zero diagonal and costs 1 + n + n(n-1)/2 evaluations for n dimensions.",
  "Ablation from the full model is blind to redundant pairs, and adding dimensions one at a time is blind to complementary pairs.",
  "The two identities of Section 12.4.2 that tie the matrix to the gains of a build-up sequence hold exactly only when the evaluation function has no interactions above second order.",
  "The sign convention was corrected in the November 2026 review. The matrix printed in Section 12.2.2 is hypothetical.",
]
standing = "A definition. The identities of Section 12.4.2 are proved and checked symbolically in `formal/matlab/volume_checks.m`, and the tables of Chapter 12 are posited."
related = ["sensitivity", "subset-enumeration", "model-robustness-index", "independence"]

[[entry]]
