first_stated = "Section 22.4, `geometric-methods/chapters/chapter-22-the-read-metric.md:118-137`, with the estimator in Section 22.2, `geometric-methods/chapters/chapter-22-the-read-metric.md:44-48`."
conditions = [
  "Three predictions were written in the script, and the script was committed, before it ran. All three passed, the first at 1 nat with little room, 0.476 against a mark of 0.5.",
  "There is one synthetic consumer, one seed, and no registration outside the script.",
  "The consumer was built with a kernel that is the same at every point, the favourable case for an averaged metric.",
  "The estimate costs 2p queries for each probe point, 3,200 queries here, and recovers the local metric only. Whether a direction is unread or only weakly read cannot be settled by a finite number of probes.",
]
standing = "Exploratory in the sense of Chapter 21. Three predictions were fixed in the committed script before the run of 25 November 2026 and graded on that one run, with one synthetic consumer and one seed."
related = ["water-filling", "read-operator", "blind-probe", "mahalanobis-distance", "finite-difference", "moving-kernel-excess-rate"]

[examples]
pareto-dominance = "With two objectives to minimize, (2, 3) dominates (2, 4), and neither of (1, 5) and (3, 2) dominates the other."
scalar-irrecoverability = "With weights (1, 1) the vectors (0, 10) and (10, 0) both have summary 10 and differ by 10 in each component. For the volume's evaluation on 5 dimensions the null space has dimension 4."
einstein-midpoint = "For the points (0.9, 0) and (0, 0) in the unit ball with equal weights, the midpoint lies at radius tanh(0.5 artanh 0.9), about 0.627. The shortcut that averages ball coordinates weighted by 1/(1 - 0.81) and 1 gives 0.756. Both values are the volume's."
log-euclidean-distance = "The logarithm of the identity is the zero matrix and the logarithm of diag(e, e) is diag(1, 1), so their distance is the square root of 2, about 1.414."
persistent-homology = "For three points on a line at 0, 1 and 3, three components are born at threshold 0. One dies at 1, when the first two points join, one dies at 2, when the third joins, and one never dies, so the persistences are 1 and 2."
euclidean-heuristic-admissibility = "In the volume's posited covariance the Consequences axis has variance 25, so a Euclidean step of 1 along it has Mahalanobis length 0.2. The Euclidean heuristic says 1 and overestimates. For a diagonal covariance the matching eigenvalue of the inverse is 0.04, and scaling by its square root gives 0.2."
degenerate-balance-coordinate = "With g = 3 and l = 1 the coordinate is 2/4 = 0.5. With l = 0 it is 1 whether g is 3 or 7, so on that set it tells nothing about g."
model-robustness-index = "With a mean of 0.8, a 75th percentile of 1.4 and a 95th percentile of 3.1, the index is 0.40 + 0.42 + 0.62 = 1.44. These are the volume's hypothetical values."
subset-enumeration = "For the volume's 5 feature groups there are 5, 10, 10, 5 and 1 subsets of sizes 1 to 5, which is 31 in all and 30 with the size capped at 4."
pairwise-interaction-matrix = "In the volume's illustration, two copies of one signal cost 0 to remove singly and 1 to remove together, so the interaction is 1 - 0 = +1. Two halves of an exclusive-or cost 1 each and 1 together, so it is 1 - 2 = -1."
dihedral-augmentation = "A grid left unchanged by the identity and the half turn only has 2 such elements, so its orbit has 8/2 = 4 distinct grids."
gradient-reversal-layer = "With lambda 0.5, a domain-loss gradient of (2, -1) arriving at the layer reaches the encoder as (-1, 0.5), and the forward output equals the input."
reversal-shortcut-experiment = "P3 required the probe's accuracy to fall by at least 15 points under full reversal. It was 99.9% without reversal and 99.9% with it, a fall of 0.0, so P3 failed. The numbers are from the volume's recorded run."
log-cholesky-parameterization = "For a 2 by 2 matrix, log-diagonal entries of 0 and 0 with an off-diagonal entry of 1 give L with rows (1, 0) and (1, 1), and the product has rows (1, 1) and (1, 2), with determinant 1. A 9 by 9 matrix needs 36 + 9 = 45 numbers."
query-budget = "With 10,000 queries, 10 neighbours each and 200,000 points, the budget is 100,000/200,000 = 0.5 and the null skewness is 1 over the square root of 0.5, about 1.41. The volume's measured skewness in that cell is 1.79."
attractiveness-skew = "Counts with mean 2 and variance 6 give an attractiveness variance of (6 - 2)/4 = 1. Counts with mean 2 and variance 2 give 0, and the estimator returns no value."
defect-campaign-null-result = "A configuration that finds no defective module misses the precision, recall and F1 targets by 70, 65 and 67 points, so its mean absolute error over the five targets is at least (70 + 65 + 67)/5 = 40.4. The numbers are from the volume's recorded run."
frozen-null-gate = "With a score of 0.62 for the system and 0.48 and 0.55 for two nulls, the difference from the higher null is 0.07, below a margin of 0.10, so the gate fails. By the volume's figure, a margin of one standard error lets a system with no effect pass about 16% of the time."
admissibility-checks = "The A1 witness for an evaluation function is to evaluate it at two different parameter vectors and require the outputs to differ. In the volume's Chapter 19 run, 189,462 calls came down to 32 distinct models, one for each on or off pattern of 5 groups."
withdrawn-versus-refuted = "The volume's case is the claim that hubness rises with corpus size at about +0.5 per decade. With the rows shuffled before the split the slope was +0.26 plus or minus 0.20, which fits a rise and fits none, so the claim was withdrawn and its negation was not asserted."
moving-kernel-excess-rate = "For the volume's example, the consumer x1 + a sin(x2) reads one number, so k = 1. Its Jacobian is (1, a) at x2 = 0 and (1, 0) at x2 = pi/2, so the average has rank q = 2 and the leading excess is 0.5 log(1/D), which is 2 nats at D = exp(-4)."
read-weighted-allocation-run = "At 4 nats the volume's table gives consumer losses of 0.033 and 0.170 and reconstruction errors of 0.722 and 0.307. The loss ratio from these rounded values is 0.19, where the record gives 0.196, and the reconstruction ratio is 2.4."
