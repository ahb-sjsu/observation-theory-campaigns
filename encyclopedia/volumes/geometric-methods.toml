[volume]
number = 1
title = "Geometric Methods"
repo = "geometric-methods"
slug = "geometric-methods"
standing = "The README's status note of 2026-07-14 calls this volume the series' metrology discipline, a method that is normative and not a finding. Its Section 21.8 (November 2026) classes each result as proved, posited, or measured on a recorded run, and the tables of Chapters 1, 8, 9, 11 and 12 are posited illustrations."

[[entry]]
id = "pareto-dominance"
kind = "concept"
title = "Pareto dominance"
definition = "A configuration dominates another when it is no worse on every objective and strictly better on at least one. Two configurations of which neither dominates the other are mutually non-dominated, and the non-dominated set is the Pareto frontier."
first_stated = "Section 8.1.1, `geometric-methods/chapters/chapter-08-pareto-optimization.md:14-20`."
conditions = [
  "Every objective has a direction fixed in advance. The volume minimizes all of them.",
  "Dominance is a partial order. It ranks nothing inside the frontier, and a choice there needs a stated preference between the objectives.",
  "The frontier tables of Chapter 8 are posited illustrations. In the recorded run of Chapter 19 the frontier had two points, and one of them was a lucky draw on the test set.",
]
standing = "A definition. Appendix C proves in writing that dominance is a strict partial order (Theorem C.7), and its Corollary C.7.1 was restated in the November 2026 review."
known_as = "Pareto efficiency in economics and the non-dominated sorting of multi-objective optimization."
related = ["budget", "subset-enumeration", "scalar-irrecoverability", "defect-campaign-null-result"]

[[entry]]
id = "scalar-irrecoverability"
kind = "result"
title = "Scalar Irrecoverability Theorem"
definition = "A linear scalar summary $\\phi(v) = w^\\top v$ of an evaluation vector with n components, n at least 2, has a null space of dimension n minus 1. Vectors with the same summary can differ by any amount in their components, so the summary alone neither reconstructs the vector nor bounds its components."
first_stated = "Section 1.1.1, `geometric-methods/chapters/chapter-01-why-geometry.md:16-24`, and as Theorem C.1 in Appendix C, `geometric-methods/chapters/appendix-c-proofs.md:13-23`."
conditions = [
  "The summary is linear with a nonzero weight vector. The unbounded difference in every component needs at least two nonzero weights. With exactly one nonzero weight that component is determined by the summary and the others are free.",
  "For a continuous summary that is not linear the theorem says only that each interior value has an uncountable preimage, so the summary is not injective.",
  "The ultimatum-game vectors that illustrate it in Chapter 1 are posited.",
]
standing = "Proved in writing in Appendix C. Parts (iii) and (iv) were restated or reproved in the November 2026 review, and there is no machine-checked proof."
related = ["null-space", "projection", "pareto-dominance", "kernel"]

[[entry]]
id = "einstein-midpoint"
kind = "instrument"
title = "Einstein midpoint"
definition = "The weighted centroid of points on the Poincare ball of curvature minus c. It is the average in the Klein model with each point weighted by its Lorentz factor, carried back to the ball. In ball coordinates it is the Mobius half of $\\sum_i w_i \\lambda_i x_i / \\sum_i w_i (\\lambda_i - 1)$, with $\\lambda_i = 2/(1 - c\\|x_i\\|^2)$."
first_stated = "Section 3.6.1, `geometric-methods/chapters/chapter-03-hyperbolic-geometry.md:530-554`."
conditions = [
  "The points lie in the open ball, where c times the squared norm is below 1, and the weights are non-negative.",
  "Proposition 3.1 states that the midpoint lies in the ball, reduces to the Euclidean weighted mean as c goes to 0, and for two points with equal weights is the midpoint of their geodesic. The text gives a proof sketch.",
  "Weighting the ball coordinates by $1/(1 - c\\|x\\|^2)$ and averaging them directly is not a hyperbolic midpoint. The November 2026 review corrected the chapter's formula.",
]
standing = "Proved, and checked against an independent computation in `formal/matlab/volume_checks.m` (Section 21.8)."
related = ["geodesic-distance", "curvature", "manifold", "mean-median"]

[[entry]]
id = "log-euclidean-distance"
kind = "concept"
title = "log-Euclidean distance"
definition = "The distance between two symmetric positive definite matrices is the Frobenius norm of the difference of their matrix logarithms, $d_{LE}(S_1, S_2) = \\|\\log S_1 - \\log S_2\\|_F$. The logarithm is taken on the eigenvalues."
first_stated = "Definition 4.2 and Proposition 4.1, `geometric-methods/chapters/chapter-04-spd-manifolds.md:45-55`."
conditions = [
  "Both matrices are symmetric positive definite, so every eigenvalue is strictly positive and its logarithm exists. The printed code clamps eigenvalues at 1e-10.",
  "It is a proper metric, because the logarithm maps the positive definite matrices one to one onto the symmetric matrices, where the Frobenius norm is a metric.",
  "The Frechet mean under this distance has a closed form, the exponential of the weighted average of the logarithms. Under the affine-invariant metric the mean needs an iterative algorithm.",
  "The contribution the volume claims for this layer in the bioacoustics case study is posited. The comparison of Section 20.9.4 has not been run.",
]
standing = "A definition. Its metric property is stated with a proof sketch as Proposition 4.1 and proved in writing as Theorem C.4 of Appendix C, with no machine-checked proof."
known_as = "The log-Euclidean metric of Arsigny et al. (2006)."
related = ["positive-definite", "frobenius-norm", "covariance-matrix", "log-cholesky-parameterization", "mahalanobis-distance"]

[[entry]]
id = "persistent-homology"
kind = "concept"
title = "persistent homology"
definition = "Connect the points of a cloud that lie within a distance threshold, forming the Vietoris-Rips complex, and raise the threshold from zero. Each topological feature, a connected component or a loop, has a birth threshold and a death threshold, and its persistence is death minus birth."
first_stated = "Section 5.3.1, `geometric-methods/chapters/chapter-05-topological-data-analysis.md:105-122`."
conditions = [
  "Long persistence is read as structure and short persistence as noise. The volume calls this a heuristic, made formal by the stability theorem, under which a perturbation of the cloud by at most delta moves the persistence diagram by at most delta in bottleneck distance.",
  "One connected component never dies. It is excluded from summary statistics.",
  "Higher homology dimensions are expensive to compute and rarely interpretable. The volume says components and loops suffice for most applications.",
  "The contribution the volume claims for this layer in the bioacoustics case study is posited. The comparison of Section 20.9.4 has not been run.",
]
known_as = "Persistent homology of topological data analysis, with the stability theorem of Cohen-Steiner, Edelsbrunner and Harer (2007)."
related = ["graph", "hierarchical-clustering", "manifold", "intrinsic-dimension"]

[[entry]]
id = "euclidean-heuristic-admissibility"
kind = "result"
title = "admissibility of the Euclidean heuristic under a Mahalanobis metric"
definition = "In A* search with Mahalanobis edge weights, the straight-line Euclidean distance to the goal never overestimates the true cost exactly when every eigenvalue of the inverse covariance is at least 1. Otherwise scale it by the square root of the smallest eigenvalue, or use the Mahalanobis distance to the goal as the heuristic."
first_stated = "Proposition 6.1, `geometric-methods/chapters/chapter-06-pathfinding-on-manifolds.md:61-67`, with the corrected heuristics in Section 6.2.2, `geometric-methods/chapters/chapter-06-pathfinding-on-manifolds.md:71-81`."
conditions = [
  "The metric tensor is a constant inverse covariance, so the space is flat and anisotropic, not curved.",
  "The scaled heuristic is admissible and often very loose. The Mahalanobis heuristic is exact for one step and ignores boundary penalties, so it can fall far below the true cost where a boundary lies on the path.",
  "The covariance the chapter applies it to, with variances from 0.25 to 25, is posited. No record supports its values.",
]
standing = "Proposition 6.1 is proved in the text. The covariance, penalties and scaling functions of Chapter 6 that it is applied to are posited (Section 21.8)."
known_as = "Admissible heuristics for A* search, after Hart, Nilsson and Raphael (1968)."
related = ["mahalanobis-distance", "eigenvalue-eigenvector", "geodesic-distance", "anisotropic", "degenerate-balance-coordinate"]

[[entry]]
id = "degenerate-balance-coordinate"
kind = "concept"
title = "balance coordinate that degenerates at a boundary"
definition = "A balance coordinate d = (g - l)/(g + l) of two competing non-negative magnitudes equals plus or minus 1 exactly when one magnitude is absent. On those sets it is constant, an interaction term d times x equals plus or minus x, and its coefficient cannot be separated from the coefficient of x."
first_stated = "Section 6.4.4, `geometric-methods/chapters/chapter-06-pathfinding-on-manifolds.md:276-288`."
conditions = [
  "The chart-selection rule applies where the endpoints of a bounded coordinate mean absence and not extremity. Fit each side separately, and do not read an interaction coefficient estimated across an endpoint as a property of either side.",
  "The evidence is a study of 95,748 risky-choice trials in an archived draft of the geometric-economics repository. A pooled interaction of +0.25 fell to about -0.03, within its noise, once the regions were separated.",
  "The draft was archived on 2026-11-02 because the model it tested has a diagonal metric and hand-chosen coordinates. The volume states that the rule is about coordinates and does not depend on that model.",
  "The discontinuities the draft reports are jumps in a risk-sensitivity term at two different boundaries. They are not edge weights of the nine-dimensional decision complex.",
]
standing = "The rule follows from the definition of the coordinate. The numbers quoted with it are the record of an archived draft (Section 21.8)."
related = ["confound", "simpsons-paradox", "stratification", "euclidean-heuristic-admissibility"]

[[entry]]
id = "model-robustness-index"
kind = "instrument"
title = "Model Robustness Index (MRI)"
definition = "Multiply each parameter by an independent log-normal factor, and for each draw record $\\omega$, the absolute change in the model's error from baseline. The index is 0.5 times the mean of $\\omega$ plus 0.3 times its 75th percentile plus 0.2 times its 95th percentile. Lower is more robust."
first_stated = "Sections 9.2.1 and 9.2.2, `geometric-methods/chapters/chapter-09-adversarial-robustness.md:83-102`."
conditions = [
  "The defaults are 300 draws and a log-scale standard deviation of 0.5, with perturbed values clamped to the range 0.001 to 1,000,000. The volume asks for the index at several scales.",
  "An index of exactly zero can mean that the evaluation function cannot see the perturbation. In the recorded run of Chapter 19 it was zero because the function reads only whether each parameter is below 1000.",
  "The values in Chapter 9 are hypothetical. The recorded values are those of Chapter 19, which are exploratory.",
  "The Decoder Robustness Index of Section 10.5 applies the same formula to perturbations of the input signal, with a graded semantic distance in place of the change in error.",
]
standing = "A definition. Appendix C states the convergence of the empirical index as Theorem C.6, proved in writing, and the worked values of Chapter 9 are posited."
related = ["sensitivity", "percentile", "defect-campaign-null-result", "admissibility-checks", "pairwise-interaction-matrix"]

[[entry]]
id = "subset-enumeration"
