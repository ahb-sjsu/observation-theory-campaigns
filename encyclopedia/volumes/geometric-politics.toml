conditions = [
  "Option neutrality means that relabeling the candidates permutes the output in the same way. It does not mean the output is fixed.",
  "The volume reads Arrow's axioms as conditions of this kind. That reading is an interpretation given in prose in Chapters 5 and 7.",
  "Chapter 17 asks whether invariance under this group yields a conserved democratic legitimacy. It calls the idea speculative because no political Lagrangian has been specified.",
]
related = ["political-bond-invariance-principle", "geometrized-arrow-theorem", "reasoning-gauge-transformation", "quotient"]

[[entry]]
id = "political-bond-invariance-principle"
kind = "concept"
title = "Political Bond Invariance Principle"
definition = "A democratic evaluation, such as an election, a poll or a representation assessment, is epistemically well-posed if and only if it is invariant under voter anonymity, option neutrality and re-description invariance."
