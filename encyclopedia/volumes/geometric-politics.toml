[volume]
number = 10
title = "Geometric Politics"
repo = "geometric-politics"
slug = "geometric-politics"
standing = "The README's epistemic-status note of 2026-07-14 calls this volume a posited framework, speculative theory awaiting instruments, and says a political-argument instrument is plausible but has not been built or gated. District 7, the source of nearly every number in the volume, is a fictional district, and Chapter 18 says precise estimation of the manifold needs larger and richer datasets than currently exist."

[[entry]]
id = "political-preference-manifold"
kind = "concept"
title = "Political preference manifold"
definition = "The six-dimensional space $\\mathcal{P}$ in which each voter is a point with coordinates for economic policy, social values, environmental priority, foreign policy, institutional trust and identity. An electorate is a distribution of points on it."
first_stated = "Chapter 4, `geometric-politics/manuscript/part_ii/ch04_preference_manifold.md:22-34`."
conditions = [
  "The volume calls the claim empirical and not axiomatic. The six dimensions are proposed from a theoretical decomposition and factor analysis, and the exact decomposition varies with the survey year and the items.",
  "Chapter 18 lists the measurement of the manifold and its correct dimensionality as open questions. It says the effective dimensionality may differ across electorates, across time and across scale.",
  "The manifold is a model of the structure of disagreement. Chapter 4 says it is not a claim about the psychology of the voter.",
]
related = ["manifold", "political-metric", "electorate-effective-dimensionality", "democratic-irrecoverability-theorem", "posited-versus-measured"]

[[entry]]
id = "political-metric"
kind = "concept"
title = "Political metric"
definition = "A Riemannian metric tensor $g_{ij}(p)$ on the political preference manifold that gives the cost of moving a position along dimensions $i$ and $j$ at the point $p$. It is anisotropic and position-dependent, so equal coordinate steps can cost different amounts."
first_stated = "Chapter 4, `geometric-politics/manuscript/part_ii/ch04_preference_manifold.md:56-64`."
conditions = [
  "The metric is posited. Chapter 18 says estimating it, its off-diagonal terms and its curvature is an open problem that needs trade-off and intensity questions that existing surveys do not ask.",
  "In practice the volume replaces the geodesic distance with the Mahalanobis distance computed from the electorate's covariance matrix. It gives this as an approximation for a region of roughly constant curvature.",
  "The echo-chamber case of Chapter 11 is a degenerate limit in which the graded metric becomes a step function, zero inside the group and infinite outside it.",
]
related = ["metric", "mahalanobis-distance", "geodesic-distance", "sacred-value-singularity", "political-preference-manifold"]

[[entry]]
id = "sacred-value-singularity"
kind = "concept"
title = "Sacred value as curvature singularity"
definition = "A sacred value is a position a voter treats as non-negotiable. The volume models it as a region where the metric component $g_{ii}$ on that dimension grows without bound, so that crossing the boundary has infinite cost."
first_stated = "Chapter 4, `geometric-politics/manuscript/part_ii/ch04_preference_manifold.md:66-76`."
conditions = [
  "The construction is a hypothesis. Chapter 18 asks whether the manifold is flat in the center and curved near sacred values, as Chapter 4 hypothesizes, and says the data to test it do not exist.",
  "It applies to the dimension that carries the sacred value. The other five coordinates of the two voters may agree.",
  "The volume draws a design reading from it, that procedures which make voters trade a sacred value against other dimensions are ill-conditioned. That reading is not tested in the volume.",
]
related = ["political-metric", "curvature", "affective-metric-distortion", "economic-singularity"]

[[entry]]
id = "electorate-effective-dimensionality"
kind = "instrument"
title = "Effective dimensionality of an electorate"
definition = "The number of eigenvalues of the electorate's six-by-six covariance matrix, taken from the largest down, needed to reach 85 percent of the total variance. One dominant eigenvalue means the left-right axis is a good approximation, and evenly spread eigenvalues mean it is a poor one."
first_stated = "Appendix C.2, `geometric-politics/manuscript/appendices/appendix_c_voting.md:67-71`, with the reading of the eigenvalues in Chapter 4, `geometric-politics/manuscript/part_ii/ch04_preference_manifold.md:100-100`."
conditions = [
  "The inputs are standardized scores on the six dimensions from the 26-item instrument of Appendix C. The appendix recommends at least 500 voters, and 2,000 or more for the off-diagonal covariance terms.",
  "The 85 percent cut is the protocol's convention.",
  "The eigenvalues printed for the American electorate are given as approximate, and those for District 7 belong to a fictional district. Neither is a recorded measurement.",
]
related = ["covariance-matrix", "eigenvalue-eigenvector", "principal-component-analysis", "explained-variance", "political-preference-manifold"]

[[entry]]
id = "political-frechet-mean"
kind = "concept"
title = "Frechet mean of an electorate"
definition = "The point of the preference manifold that minimizes the sum of squared manifold distances to all voters. The volume uses it as the multi-dimensional counterpart of the median voter."
first_stated = "Chapter 4, `geometric-politics/manuscript/part_ii/ch04_preference_manifold.md:163-169`."
conditions = [
  "It depends on the metric. With sacred-value boundaries the volume says the mean is pulled into the interior of the acceptable region.",
  "It need not coincide with the median on any single dimension, because the dimensions are correlated.",
  "The District 7 coordinates given for it are an illustration from a fictional district.",
]
known_as = "The Frechet mean, or Karcher mean, of a distribution on a metric space. The one-dimensional comparison is the median voter of Downs."
related = ["political-preference-manifold", "political-metric", "manifold-condorcet-winner", "gerrymandering-index", "mean-median"]

[[entry]]
id = "democratic-irrecoverability-theorem"
kind = "result"
title = "Democratic Irrecoverability Theorem"
definition = "A voting function maps the positions of $n$ voters on a $d$-dimensional preference manifold to an outcome space of lower dimension. It is then non-injective, no function of the outcome recovers the preferences, and the fraction of manifold information destroyed is at least $(d - \\dim \\mathcal{O})/d$."
first_stated = "Theorem 1 of Chapter 5, `geometric-politics/manuscript/part_ii/ch05_voting_contraction.md:49-55`, after Definition 2 of the voting function at `geometric-politics/manuscript/part_ii/ch05_voting_contraction.md:24-33`."
conditions = [
  "The outcome space must have lower dimension than the preference manifold. The supporting Lemma 1 is stated with the weaker hypothesis that the outcome dimension is below $n$ times $d$.",
  "The bound depends on $d$. Chapter 18 notes that with an effective dimensionality of 4 the plurality bound falls from 83 percent to 75 percent.",
  "Part (c) treats the preference configuration as a random variable and bounds mutual information by the entropy of the outcome. The percentages of information preserved that the chapter lists for five voting systems in District 7 are illustrations and not outputs of the theorem.",
]
standing = "A theorem with a proof written in the chapter, inside a volume that is posited as a whole. The volume calls it the political instance of the Scalar Irrecoverability Theorem of Geometric Reasoning."
related = ["scalar-irrecoverability", "political-preference-manifold", "rcv-recovery-theorem", "geometrized-arrow-theorem", "political-bond-index", "binary-verdict-irrecoverability"]

[[entry]]
id = "democratic-gauge-group"
kind = "concept"
title = "Democratic gauge group"
definition = "The group $G_D$ of changes to a voting function's input that should leave its output unchanged. It is generated by voter anonymity, option neutrality and re-description invariance. A voting function invariant under it is called democratically well-posed."
