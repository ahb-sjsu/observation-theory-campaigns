[[entry]]
id = "rcv-recovery-theorem"
kind = "result"
title = "RCV Recovery Theorem"
definition = "In an election with $k$ candidates on a $d$-dimensional preference manifold, plurality keeps ordinal information along one axis and ranked-choice voting keeps it along $\\min(d, k-1)$ axes. The recovery ratios are $1/d$ and $\\min(d, k-1)/d$."
first_stated = "Theorem 7 of Chapter 13, `geometric-politics/manuscript/part_iv/ch13_ranked_choice.md:35-47`. The ratios are repeated in Appendix C.3, `geometric-politics/manuscript/appendices/appendix_c_voting.md:85-87`."
conditions = [
  "The recovery is ordinal and partial. Cardinal intensity is lost, and the Democratic Irrecoverability Theorem still applies.",
  "Positions on dimensions that do not affect any candidate ranking stay invisible, as they are under plurality.",
  "Chapters 5 and 15 list 45 percent of information preserved for ranked choice in the five-candidate District 7 example. The formula of this theorem gives 4 of 6 for that case, and the volume does not reconcile the two figures.",
  "The Alaska 2022, New York City 2021 and Maine 2018 elections are read through the theorem after the fact. They are not tests of it.",
]
standing = "A theorem with a proof written in the chapter, which counts independent pairwise comparisons. The information percentages listed elsewhere in the volume are illustrations."
known_as = "Ranked-choice voting is also called instant-runoff voting."
related = ["democratic-irrecoverability-theorem", "manifold-condorcet-winner", "political-bond-index", "geometrized-arrow-theorem"]
online_page = "appendix_c_voting.html"

[[entry]]
id = "political-bond-index"
kind = "instrument"
title = "Political Bond Index"
definition = "For a set of voters and an electoral system, $BI$ is the average over voters of the manifold distance to the actual representative minus the distance to the closest possible representative under an unconstrained optimal assignment. It is zero for a perfect system and positive otherwise."
first_stated = "Definition 8 of Chapter 15, `geometric-politics/manuscript/part_iv/ch15_political_bond_index.md:27-36`. The computation is specified in Appendix C.3, `geometric-politics/manuscript/appendices/appendix_c_voting.md:91-93`."
