[[entry]]
id = "polarization-illusion-theorem"
kind = "result"
title = "Polarization Illusion Theorem"
definition = "A preference distribution with a single region of high density on the manifold can look bimodal when projected onto one axis oblique to its principal axis. A bimodal one-dimensional projection is therefore necessary but not sufficient evidence of polarization on the manifold."
first_stated = "Theorem 4 of Chapter 8, `geometric-politics/manuscript/part_iii/ch08_polarization.md:35-41`."
conditions = [
  "The proof notes that every projection of a Gaussian is unimodal. The effect needs a non-Gaussian shape such as a ridge or a mixture, and the proof asserts the construction without working it through.",
  "The theorem does not say American polarization is illusory. The chapter reads the survey record as real separation on social values and institutional trust, sorting on three dimensions, and little structure on foreign policy.",
  "The dimension-by-dimension figures are given as approximate readings of survey series. The District 7 decomposition is illustrative.",
]
standing = "A theorem stated with a short proof in the chapter. Its application to the American electorate is the volume's reading of survey data and not a preregistered test."
related = ["sorting-polarization-distinction", "affective-metric-distortion", "projection", "political-preference-manifold", "simpsons-paradox"]

[[entry]]
