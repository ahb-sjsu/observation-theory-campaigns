[[entry]]
id = "overton-window"
kind = "concept"
title = "Overton window as geodesic constraint"
definition = "A connected, bounded subset $W$ of the preference manifold. Positions inside it cost nothing, and a position outside pays a penalty equal to a coefficient times the squared manifold distance to $W$. A trajectory is Overton-admissible when it stays inside the window of its time."
first_stated = "Chapter 10, `geometric-politics/manuscript/part_iii/ch10_overton_window.md:26-32`, with Definition 5 at `geometric-politics/manuscript/part_iii/ch10_overton_window.md:48-54`."
conditions = [
  "The boundary is a gradient and not a wall. The quadratic penalty and its coefficient are posited.",
  "The window moves. The volume names four forces, which are elite adoption, crisis events, generational replacement and media amplification.",
  "The Overton cost of a constrained path is its length minus the length of the unconstrained geodesic. It is zero when the geodesic stays inside the window.",
  "The shapes given for the American and Scandinavian windows and for District 7 over three decades are descriptive.",
]
known_as = "The Overton window of Joseph Overton, usually drawn as an interval on the left-right axis."
related = ["political-metric", "geodesic-distance", "curvature", "media-heuristic-corruption"]

