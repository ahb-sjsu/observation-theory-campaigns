[examples]
political-preference-manifold = "The volume's illustration places the university enclave of District 7 at $(-1.8, -2.0, 2.0, -1.0, 0.5, -1.5)$ in standardized coordinates. Reading the first and third numbers, the enclave is progressive on economics and high on environmental priority."
political-metric = "Take a diagonal metric with cost 1 on the economic dimension and cost 4 on the social dimension. A unit step on the social dimension has length $\\sqrt{4} = 2$, twice the length of a unit step on the economic dimension."
sacred-value-singularity = "Two voters agree on five dimensions and sit on opposite sides of a sacred boundary on the sixth. Their coordinate difference may be one scale point, and the volume puts their distance in the political metric at infinity."
electorate-effective-dimensionality = "The volume's District 7 eigenvalues are 3.2, 2.8, 1.9, 1.5, 1.0 and 0.6, which sum to 11.0. The first three reach 7.9, or 72 percent, and the first four reach 9.4, or 85 percent, so the effective dimensionality is 4."
political-frechet-mean = "Three voters sit at 0, 1 and 5 on a line with ordinary distance. The point 2 gives squared distances 4, 1 and 9, a sum of 14. The median voter at 1 gives 1, 0 and 16, a sum of 17, so the Frechet mean is 2 and not the median."
democratic-irrecoverability-theorem = "With six dimensions and a single-winner outcome of dimension 1, at least $(6-1)/6$, about 83 percent, of the manifold information is destroyed. With four effective dimensions the bound is $3/4$, or 75 percent."
democratic-gauge-group = "Five ballots read A, A, A, B, B. Swapping the ballots of the first and fourth voters gives B, A, A, A, B, and the count is still 3 to 2 for A, as anonymity requires."
political-bond-invariance-principle = "Suppose the same voters with the same preferences elect A when A is listed first and B when B is listed first. The outcome depends on the labeling of the ballot, so the election fails option neutrality and is not well-posed under the principle."
campaign-gradient-theorem = "Let the electorate have mean zero, variance 4 on axis 1 and variance 1 on axis 2, and let the candidate sit at $(0, 2)$. The mean squared projected distance is $4 + 0 = 4$ on axis 1 and $1 + 4 = 5$ on axis 2, so the campaign makes axis 1 salient."
media-heuristic-corruption = "In the volume's illustration two District 7 voters are 2.3 Mahalanobis units apart and each perceives 5.5. The ratio $5.5 / 2.3$ is about 2.4, the distortion factor the chapter reports."
geometrized-arrow-theorem = "On a six-dimensional manifold a contraction to a single ranking must drop $6 - 1 = 5$ dimensions of information, while the three conditions together ask that none be dropped."
manifold-condorcet-winner = "In the volume's table the three blocs are 1.2, 2.8 and 5.1 from A, 2.5, 0.3 and 2.2 from B, and 4.8, 2.5 and 1.4 from C. The means are about 3.0, 1.7 and 2.9, so B is the manifold Condorcet winner although the ordinal preferences cycle."
polarization-illusion-theorem = "A one-axis histogram with two peaks is consistent with two separated clusters and with one elongated cluster seen obliquely. In the volume's District 7 illustration the party centroids are 1.5 Mahalanobis units apart, which the chapter reads as moderate separation with substantial overlap."
sorting-polarization-distinction = "Two parties have centroids at $(-0.5, -0.5)$ and $(0.5, 0.5)$, a distance of $\\sqrt{2}$, about 1.41. If the variance inside each party falls from 1 to 0.25 the centroids have not moved, so sorting has risen and polarization has not."
affective-metric-distortion = "In the volume's District 7 illustration the party centroids are 1.5 Mahalanobis units apart and voters perceive about 4.2. The ratio $4.2 / 1.5$ is 2.8, which the chapter calls nearly three times the actual distance."
gerrymandering-index = "Four voters sit at 0, 1, 10 and 11 on a line. Districts {0, 1} and {10, 11} have means 0.5 and 10.5, and every voter is 0.5 from the mean, so the index is 0.5. Districts {0, 10} and {1, 11} have means 5 and 6, every voter is 5 away, and the index is 5."
manifold-community-of-interest = "In the volume's illustration the clustering test finds one cluster under the bipartisan Map A and two under the partisan Map B, where the Route 9 corridor and the exurban belt are joined. Map B's district fails the criterion."
overton-window = "With penalty coefficient 2, a position 3 manifold units outside the window costs $2 \\times 3^2 = 18$, and a position inside costs 0. If the geodesic between two positions has length 4 and the shortest path inside the window has length 6, the Overton cost of the path is 2."
agreement-submanifold = "Three members have environmental positions 1.0, 1.2 and 1.4 and economic positions $-1$, 0 and 1, and the tolerance is 0.5. The largest environmental gap is 0.4 and the largest economic gap is 2, so only the environmental dimension is in the agreement submanifold and its dimension is 1."
coalition-fragility-index = "With six dimensions and agreement on two, the first factor is $4/6$, about 0.67. The index reaches 1 when the worst outside dimension has variance equal to 1.5 times the squared tolerance, since $0.67 \\times 1.5 = 1$. These are the volume's figures."
rcv-recovery-theorem = "With six dimensions and five candidates, plurality has ratio $1/6$, about 17 percent, and ranked choice has $\\min(6, 4)/6 = 4/6$, about 67 percent. With three candidates ranked choice has $2/6$, about 33 percent."
political-bond-index = "Two voters are 2.0 and 3.0 from their actual representatives and 1.0 and 1.5 from their optimal ones. The excesses are 1.0 and 1.5, so the index is 1.25. In the volume's illustration a move from 1.2 to 0.9 is a 25 percent reduction."
