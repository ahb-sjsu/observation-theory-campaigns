[[entry]]
id = "legal-wilson-loop"
kind = "instrument"
title = "Legal Wilson loop"
definition = "The ordered product of the Hohfeldian gauge transformations along the edges of a closed path of cases. If the product is the identity the cycle is consistent. Any other group element means the chain of precedents returns to its starting point with the rights and duties relabeled."
first_stated = "Chapter 5, `geometric-law/chapters/ch05_hohfeldian_group.md:163-181`, with the discrete form at `geometric-law/chapters/ch05_hohfeldian_group.md:455-461`. The chapter's note of 2026-11-26, which keeps the loop with values in the Klein four-group, is at `geometric-law/chapters/ch05_hohfeldian_group.md:22-26`."
conditions = [
  "The loop takes its values in the Klein four-group $V_4$. The chapter's note of 2026-11-26 withdraws the dihedral and 64-element groups, keeps the legal connection, the Wilson loop and its gauge invariance, and reads the symbol $r$ of the running example as the correlative involution $c$.",
  "Each edge needs a group element saying how the citing case relabels the positions of the cited case. In the volume's examples these are assigned by reading the cases.",
  "Relabeling at the vertices changes the product by conjugation. Only its conjugacy class, and so whether it is trivial, is gauge-invariant.",
  "The proposition that a body of case law is consistent if and only if all loops are trivial is stated without proof.",
  "Chapter 3 states that the time-ordered citation graph is acyclic. Chapter 5 says that a closed path must therefore include at least one edge that is not a forward citation, such as the comparison that returns from the last case to the first in its examples.",
]
known_as = "Wilson loops and holonomy in gauge theory."
related = ["hohfeldian-octad-gauge-group", "precedential-weight-deformation", "legal-phase-transition", "topological-constitutionality"]

[[entry]]
id = "liability-damages-conservation"
kind = "result"
title = "Liability-damages conservation"
definition = "In a closed bilateral dispute under a fixed legal framework, the net liabilities of the two parties sum to zero. Every right that adjudication assigns to one party is a correlative duty of the other, and every dollar of damages awarded to one is a dollar of liability on the other."
first_stated = "Chapter 5, `geometric-law/chapters/ch05_hohfeldian_group.md:270-293`."
conditions = [
  "Closed means two fixed parties and a fixed legal framework. The volume names three operations that break the law, which are legislation, constitutional amendment and third-party intervention.",
  "Punitive damages are handled by extending the system to include the state as a third party, after which the three net liabilities sum to zero.",
  "The proof rests on Hohfeld's correlative pairs and on the premise that adjudication assigns positions already existing in the framework and creates none.",
  "Chapter 1 says the conservation laws are conditional on assumptions that may not hold in all legal contexts.",
]
standing = "The front matter classes conservation among its conditional theorems, results that follow from the model's axioms. No measurement of it is reported."
related = ["hohfeldian-d4-group", "equal-protection-gauge-invariance", "hohfeldian-octad-gauge-group"]

[[entry]]
id = "legal-invariance-principle"
kind = "concept"
title = "Legal Invariance Principle (LIP)"
definition = "A legal judgment procedure is well-posed if and only if its output is unchanged by every legally irrelevant transformation of the case. The listed transformations are renaming the parties, changing their race, gender, religion or national origin, rephrasing arguments without changing their logical content, reordering the presentation, and translating between languages."
first_stated = "Chapter 8, `geometric-law/chapters/ch08_equal_protection.md:50-62`."
conditions = [
  "Stated as an axiom. The volume presents it as a formalization of equal protection, due process and the rule that like cases be decided alike, and not as a reform proposal.",
  "It requires identical treatment only when all legally relevant features are identical. A prior felony conviction is a relevant feature, so a longer sentence for it is no violation.",
  "The principle does not itself say which features are irrelevant. Chapter 15 calls that choice a normative commitment, and the Judicial Bond Invariance Principle is the volume's answer.",
]
related = ["judicial-bond-invariance-principle", "equal-protection-gauge-invariance", "due-process-quotient-regularity", "legal-bond-index", "nuisance"]

[[entry]]
id = "judicial-bond-invariance-principle"
kind = "concept"
title = "Judicial Bond Invariance Principle (JBIP)"
definition = "If a transformation of a dispute's description preserves the Hohfeldian bond structure, meaning the configuration of rights, duties, liberties, no-rights, powers, immunities, liabilities and disabilities among the parties, then the legal evaluation must be unchanged."
first_stated = "Chapter 8, `geometric-law/chapters/ch08_equal_protection.md:110-120`, under the dated note at `geometric-law/chapters/ch08_equal_protection.md:104-104`."
conditions = [
  "Stated as an axiom. It is the Bond Invariance Principle of Geometric Ethics specialized to law.",
  "The volume calls it stronger than the Legal Invariance Principle because it fixes what counts as legally relevant. Two cases with isomorphic bond structures must receive the same evaluation.",
  "The axiom is stated for the group of all transformations that preserve the bond structure. The section's note of 2026-11-26 withdraws the earlier identification of that group with the 64-element Hohfeldian group of Chapter 5, and says the Hohfeldian relabelings and the equal protection group are both subgroups of it.",
  "The volume notes that existing doctrine applies different levels of scrutiny to race and to sex, and says the axiom suggests this asymmetry is problematic.",
]
related = ["legal-invariance-principle", "hohfeldian-octad-gauge-group", "legal-bond-index", "equal-protection-gauge-invariance"]

[[entry]]
id = "equal-protection-gauge-invariance"
kind = "result"
title = "Equal protection as gauge invariance"
definition = "The equal protection gauge group is generated by transformations that change a party's protected-class attribute while preserving all facts, all legal attributes and all Hohfeldian bonds. A legal evaluation satisfies equal protection if and only if it is unchanged by every element of this group."
first_stated = "Chapter 8, the group and the theorem at `geometric-law/chapters/ch08_equal_protection.md:157-182`, with the full statement at `geometric-law/chapters/ch08_equal_protection.md:637-639`."
conditions = [
  "The front matter classes this among the conditional theorems that follow from the invariance axiom. The chapter gives a proof sketch.",
  "The added claim that the invariance implies an entitlement balance in any closed bilateral dispute also uses the Hohfeldian correlative structure.",
  "Disparate impact is treated separately. An invariant rule applied to a population whose distribution of situations differs by group can still give different group averages.",
  "The tiers of scrutiny and affirmative action are read as gauge-breaking terms that need justification, so the requirement as doctrine applies it is approximate invariance with stated exceptions.",
]
related = ["legal-invariance-principle", "legal-bond-index", "gauge-violation-tensor", "liability-damages-conservation", "disparate-impact-ratio"]

[[entry]]
id = "due-process-quotient-regularity"
kind = "result"
title = "Due process as quotient regularity"
definition = "Due process is the requirement that the legal evaluation map be well defined on the quotient of the space of legal situations by the legally irrelevant transformations. It fails when the outcome depends on which description of the same dispute was presented."
first_stated = "Chapter 8, `geometric-law/chapters/ch08_equal_protection.md:484-496`."
conditions = [
  "The equivalence classes are those fixed by the Legal Invariance Principle, so the statement inherits that axiom's choice of irrelevant transformations.",
  "The volume gives a proof sketch, and the sketch addresses procedural due process.",
  "The constitutional subcomplex of Chapter 7 uses this well-definedness as its due process predicate.",
]
related = ["quotient", "legal-invariance-principle", "equal-protection-gauge-invariance", "topological-constitutionality"]

[[entry]]
id = "legal-bond-index"
kind = "instrument"
title = "Legal Bond Index (LBI)"
definition = "An index with two kinds of form. The book's transformation forms take the mean, over test cases and bond-preserving transformations, of the size of the change in the legal outcome under the transformation, in the appendix divided by the size of the original outcome. A value of 0 is perfect invariance, and these forms are theoretical and have not been computed on legal data. The one form that has been measured is the matched-neighborhood ratio, the mean score gap between an individual and the $k$ nearest neighbors of the other group divided by the mean gap to the $k$ nearest neighbors of the same group, which is centered on 1."
first_stated = "Chapter 8, `geometric-law/chapters/ch08_equal_protection.md:226-250`, with the normalized form at `geometric-law/chapters/ch08_equal_protection.md:631-635` and the measured form in the section The Measured Form of the Index, `geometric-law/chapters/ch08_equal_protection.md:276-405`. Chapter 5 states it first in brief, `geometric-law/chapters/ch05_hohfeldian_group.md:321-331`."
conditions = [
  "A transformation form needs a transformed version of each test case. The volume says submitting transformed cases to a real court is impractical, and that for AI legal systems the index is directly computable.",
  "The measured form was computed for COMPAS recidivism scores on the public Broward County file, for 5,278 defendants matched on six recorded predictors. For race the ratio lies between 1.041 and 1.069 across six neighborhood scales and is 1.049 at k = 20. Under specifications that force matching parity it falls to between 1.00 and 1.02. For sex it is not distinguishable from 1 at scales up to 20.",
  "The measurement comes from the paper The Legal Bond Index by Bond, accepted by the Journal of Science and Law and in press. The chapter says the paper makes no use of the book's framework, that the object measured is the score of an algorithm and not the judgment of a court, and that every finding is conditional on the measured predictors, which are a subset of those COMPAS uses.",
  "The paper describes the measured index as a research-stage screening signal and not a validated audit standard, and proposes no threshold. The chapter says an index above 1 does not show that the algorithm uses race and does not establish a violation of any legal rule.",
  "The scales cannot be converted. The chapter says a ratio of 1.049 is not an index of 0.049, and that it cannot be set beside 0.155, the illustrative 0.19 and 0.08, or the 0.05 threshold of Chapter 15.",
  "The 0.155 baseline is the Bond Index of Geometric Ethics, from 20,030 normative evaluations. The volume says it is not a standard for legal systems and that for the forms it defines the legal baseline remains unmeasured. The corrections record of 2026-11-26 lists the source of 0.155 as unresolved.",
  "The figure of about 0.19 for federal sentencing restates the Sentencing Commission's 19.1% as a relative change. The chapter says it is not a computation of the index from case data. The per-judge and per-district figures in the running example are illustrative.",
  "The transformation forms vary across chapters. Chapters 5 and 8 state the mean absolute change with a range of 0 to 1, the Chapter 8 appendix divides by the original outcome, and Chapter 15 uses Mahalanobis distances between system outputs with a suggested threshold of 0.05. The chapter says their values are not directly comparable, and the book has not fixed which of them is the definition.",
]
standing = "One form has been measured, once. The matched-neighborhood ratio was computed for the scores of one algorithm on one public dataset, in a paper that is accepted and in press, and the chapter reports it as a screening diagnostic and not as a test of the book's framework. The transformation forms the book defines are theoretical and have not been computed on legal data."
related = ["judicial-bond-invariance-principle", "gauge-violation-tensor", "equal-protection-gauge-invariance", "paired", "disparate-impact-ratio"]

[[entry]]
id = "doctrinal-heuristic"
kind = "concept"
title = "Doctrinal heuristic"
definition = "A legal doctrine read as an A* heuristic. It is a non-negative function on cases that estimates the remaining legal friction to the goal region, computed as the sum of the estimated costs of the claim's elements not yet established. It is admissible when no element's estimate exceeds its true proving cost."
first_stated = "Chapter 6, the definition at `geometric-law/chapters/ch06_precedent_heuristic.md:86-90`, admissibility at `geometric-law/chapters/ch06_precedent_heuristic.md:129-137`, and the appendix form at `geometric-law/chapters/ch06_precedent_heuristic.md:353-363`."
conditions = [
  "With an admissible heuristic, A* returns the minimum-friction argument. That is the standard A* guarantee, and the volume's proof assumes that element costs add.",
  "Overestimation breaks admissibility. Underestimation keeps it and weakens the guidance, down to the zero heuristic, which the volume identifies with a totality of the circumstances test.",
  "The volume calls balancing tests circular heuristics and says a novel legal question has no precomputed heuristic at all.",
  "The element costs are posited. The friction units in the chapter's comparison of McDonnell Douglas with direct evidence are illustrative.",
]
known_as = "Admissible heuristics in A* search, with precedent in the role of a pattern database."
related = ["legal-friction", "judicial-complex", "legal-geometric-pathologies", "precedential-weight-deformation"]

[[entry]]
id = "topological-constitutionality"
kind = "result"
title = "Topological constitutionality"
definition = "The constitutional subcomplex is the part of the judicial complex whose vertices and simplices satisfy every constitutional predicate. A statute is called constitutional if and only if adding it leaves all path homology groups of that subcomplex unchanged, which the volume restates as creating no new non-trivial directed cycle."
first_stated = "Chapter 7, the subcomplex at `geometric-law/chapters/ch07_constitutional_topology.md:32-45`, the theorem at `geometric-law/chapters/ch07_constitutional_topology.md:99-103`, and the completeness conjecture at `geometric-law/chapters/ch07_constitutional_topology.md:187-191`."
conditions = [
  "The front matter classes the use of path homology for constitutionality as a modeling axiom. The theorem has a proof sketch.",
  "The chapter says the equivalence holds within the model, in which a constitutional violation is a change in path homology. That no violation escapes this description is the Completeness Conjecture. If the conjecture is false, preserved path homology is a necessary condition and not a sufficient one, and the appendix states the theorem in three one-directional parts.",
  "The citation graph is acyclic, and the chapter says a directed cycle must include an edge that is not a forward citation, such as the edges a statute adds.",
  "Building the subcomplex requires deciding which vertices satisfy each predicate and how a statute changes the graph. The volume says this legal judgment cannot be fully automated.",
  "For a finite directed graph the groups are computable by Smith normal form of the boundary matrices. Chapter 16 leaves open whether the fundamental group detects inconsistencies that path homology misses.",
]
standing = "A conditional theorem with a proof sketch, whose if-and-only-if form holds within the model, while the completeness of the model is posed as a conjecture. The volume's applications of it are worked examples and not computations on a case corpus."
known_as = "Path homology of directed graphs, which the volume attributes to Grigor'yan, Lin, Muranov and Yau."
related = ["judicial-complex", "legal-wilson-loop", "due-process-quotient-regularity", "equal-protection-gauge-invariance"]

[[entry]]
id = "precedential-weight-deformation"
kind = "concept"
title = "Precedential weight deformation"
definition = "A binding precedent at a vertex adds a term to the weights of nearby edges. The size of the term scales as the precedent's hierarchical weight divided by the graph distance from the precedent raised to a decay exponent $n$, and the deformations of several precedents add."
first_stated = "Chapter 9, `geometric-law/chapters/ch09_stare_decisis.md:30-46`, with the full form at `geometric-law/chapters/ch09_stare_decisis.md:366-370`."
conditions = [
  "The decay law is given as a scaling relation. The volume gives no values for the exponent, the hierarchical weights or the holding operator.",
  "Hierarchical weight is ordered with the Supreme Court above a circuit court and a circuit court above a district court.",
  "The deformation defines the legal connection. Carrying a rule along heavily deformed edges may rotate it, and the rotation around a closed path is the holonomy read by the Wilson loop.",
]
related = ["legal-edge-weight", "legal-phase-transition", "legal-wilson-loop", "doctrinal-heuristic", "curvature"]

[[entry]]
id = "legal-phase-transition"
kind = "concept"
title = "Legal phase transition (overruling as graph surgery)"
definition = "Overruling a precedent is a discrete graph surgery. The old precedent's weight deformation is removed from every nearby edge and the new precedent's is added, which changes shortest paths discontinuously. Its cost is the sum, over the cases that relied on the old precedent, of each case's weight times the size of its weight change."
first_stated = "Chapter 9, `geometric-law/chapters/ch09_stare_decisis.md:118-134`, with the general definition and the critical point at `geometric-law/chapters/ch09_stare_decisis.md:218-240`."
conditions = [
  "The volume's criterion is that a precedent is overruled when the holonomy around its doctrinal loop exceeds a tolerance and the benefit exceeds the reliance cost. Neither threshold is given a value.",
  "A first-order transition flips a holding. A second-order transition changes a rule continuously with a jump in its rate of change, and the volume's example is the erosion of Bivens.",
  "The volume offers the model as an explanation of why overruling is rare and comes in clusters. It reports no test of the criterion.",
]
related = ["precedential-weight-deformation", "legal-wilson-loop", "legal-geometric-pathologies", "threshold"]

[[entry]]
id = "gauge-violation-tensor"
kind = "instrument"
title = "Gauge violation tensor"
definition = "A matrix whose entry for transformation $i$ and outcome $j$ is the mean over cases of the absolute change in outcome $j$ when protected characteristic $i$ is swapped, divided by the original outcome. Rows are characteristics such as race or gender, columns are outcomes such as sentence length or bail, and the mean of all entries is the Legal Bond Index."
first_stated = "Chapter 11, `geometric-law/chapters/ch11_sentencing_disparities.md:28-48`, with the relation to the index at `geometric-law/chapters/ch11_sentencing_disparities.md:64-68`."
conditions = [
  "A swap cannot be applied to a real defendant. The volume estimates entries from matched pairs of cases alike in drug type, quantity, criminal history, role, district and year.",
