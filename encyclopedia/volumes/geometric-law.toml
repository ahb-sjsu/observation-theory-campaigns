[volume]
number = 5
title = "Geometric Law"
repo = "geometric-law"
slug = "geometric-law"
standing = "The README's epistemic status of 2026-07-14 calls the volume a posited framework with one instrumented corner. That corner is the legal text embedding LeBSE, validated in the xbse admission filter on US case law with labels from the CourtListener citation graph, and the README says this covers structure preservation in legal text embeddings and not the book's broader jurisprudential claims, which remain posited theory at licensed strength."

[[entry]]
id = "judicial-complex"
kind = "concept"
title = "Judicial complex"
definition = "The judicial complex $\\mathcal{K}$ is a directed weighted simplicial complex. Each decided case is a vertex carrying a vector of eight legal dimension scores, a court level and a date. A directed edge with an asymmetric non-negative weight runs from a cited case to the citing case, and a set of mutually citing cases that establish a doctrine is a higher simplex."
first_stated = "Chapter 3, the formal construction, `geometric-law/chapters/ch03_judicial_complex.md:126-138`, with the tuple form in the appendix, `geometric-law/chapters/ch03_judicial_complex.md:418-423`."
conditions = [
  "The front matter classes the structural choices of the model as modeling axioms, and Chapter 16 calls the complex a model of legal reasoning and not a replica.",
  "Citation edges respect time, so the citation subgraph is acyclic. Binding authority runs from a higher court to a lower one, and the reverse direction has high or infinite cost.",
  "The continuum limit to a Riemannian manifold is used as a theoretical tool. The discrete complex is primary and every computation on it is finite.",
  "Chapter 4 states that scoring a case corpus and calibrating the weights has not yet been executed on legal data. The five-case complex in Chapter 3 is an illustration.",
]
known_as = "Citation networks of case law and the simplicial complexes of algebraic topology."
related = ["eight-legal-dimensions", "legal-edge-weight", "legal-friction", "graph", "manifold"]

[[entry]]
id = "eight-legal-dimensions"
kind = "concept"
title = "Eight legal dimensions"
definition = "Eight axes along which a legal state is scored. They are entitlement structure, factual nexus, procedural posture, statutory authority, constitutional conformity, precedential constraint, remedial scope and public interest. The eight scores of a case form its attribute vector."
first_stated = "Chapter 3, `geometric-law/chapters/ch03_judicial_complex.md:44-86`."
conditions = [
  "The volume says the choice of eight is a modeling decision, not a derivation from first principles and not the unique correct decomposition. Chapter 1 tags it as a modeling axiom.",
  "Dimensions may be added or merged. The stated requirement is several non-redundant axes of legal variation, and the later theorems are said to hold for any finite-dimensional attribute space.",
  "The scores are to come from linear probes on a text embedding, trained on expert labels. Chapter 4 states that this programme has not yet been executed on legal data.",
  "Chapter 15 requires that no pair of predicted scores correlate above 0.7 on held-out cases. Otherwise the probes are retrained or the dimensions redefined.",
]
related = ["judicial-complex", "legal-mahalanobis-distance", "legal-embedding", "covariance-matrix"]

[[entry]]
id = "legal-mahalanobis-distance"
kind = "concept"
title = "Legal Mahalanobis distance"
definition = "The distance between two cases is the square root of $\\Delta v^T \\Sigma^{-1} \\Delta v$, where $\\Delta v$ is the difference of their eight-dimensional attribute vectors and $\\Sigma$ is the covariance matrix of the eight dimensions over the case corpus."
first_stated = "Chapter 4, `geometric-law/chapters/ch04_legal_metric.md:52-60`."
conditions = [
  "The covariance matrix must be positive definite. When it is diagonal the distance reduces to a Euclidean distance with each dimension weighted by the inverse of its variance.",
  "The front matter classes the Mahalanobis metric as a modeling axiom. The volume says the metric is calibrated from data and can be miscalibrated, for example by a biased corpus.",
  "Chapter 4 states that the calibration programme has not yet been executed on legal data. Chapter 16 lists metric calibration as its first open problem and says no calibration protocol, sensitivity bound or uncertainty procedure exists yet.",
  "The predicted off-diagonal entries, such as a positive covariance of statutory authority with remedial scope, are stated as falsifiable predictions. The volume reports no test of them.",
]
known_as = "Mahalanobis distance."
related = ["mahalanobis-distance", "covariance-matrix", "eight-legal-dimensions", "legal-edge-weight", "calibration", "positive-definite"]

[[entry]]
id = "legal-edge-weight"
kind = "concept"
title = "Asymmetric edge weight (legal)"
definition = "The weight of a directed edge from case $i$ to case $j$ is the quadratic form $\\Delta v^T \\Sigma^{-1} \\Delta v$, plus a penalty $\\beta$ for each regime boundary crossed, plus a hierarchical cost. That cost is 0 from a higher court to a lower one, a positive constant $\\eta$ at the same level, and infinite from lower to higher."
first_stated = "Chapter 4, `geometric-law/chapters/ch04_legal_metric.md:114-155`, with the appendix form at `geometric-law/chapters/ch04_legal_metric.md:408-412`."
conditions = [
  "The weight is asymmetric, so it is a cost function for shortest paths on a directed graph and not a metric. The volume states that only the doctrinal term taken alone is a metric.",
  "The formula uses the quadratic form without the square root, although the chapter labels that term the Mahalanobis distance. The worked example adds the squared value to the other two terms.",
  "The boundary penalties are to be estimated from the observed cost of crossing jurisdictional, doctrinal, statutory and constitutional boundaries. The volume gives no estimated values.",
  "Chapter 15 gives a different operational weight, a cross-validated mix of a citation-type term, an attribute-distance term and an outcome term.",
]
related = ["legal-mahalanobis-distance", "judicial-complex", "legal-friction", "precedential-weight-deformation", "metric"]

[[entry]]
id = "legal-friction"
kind = "concept"
title = "Legal friction"
definition = "The legal friction of a path of cases is the sum of its edge weights plus, for each evidentiary requirement $j$, a weight $\\omega_j$ times the shortfall of the path's evidence below that requirement's threshold. A strong argument is a low-friction path, and the burden of proof is the least friction from the starting case to the goal region."
first_stated = "Chapter 4, `geometric-law/chapters/ch04_legal_metric.md:161-173`, the appendix form at `geometric-law/chapters/ch04_legal_metric.md:414-418`, and the burden of proof at `geometric-law/chapters/ch04_legal_metric.md:212-220`."
conditions = [
  "The path must follow directed edges of the judicial complex. An edge of infinite weight makes the argument impossible.",
  "Standards of proof are stated as thresholds on this quantity. Preponderance asks the plaintiff's best path to be shorter than the defendant's, clear and convincing asks it to be shorter by a factor below 1, and beyond reasonable doubt asks it to be below a small bound.",
  "The chapter's body formula lists boundary penalties as a separate term, while its appendix folds them into the edge weights. The appendix form is the one given here.",
  "The friction values in the volume's worked examples are illustrative units. No friction computed from real cases is reported.",
]
related = ["legal-edge-weight", "doctrinal-heuristic", "judicial-complex", "threshold"]

[[entry]]
id = "hohfeldian-d4-group"
kind = "result"
title = "Hohfeldian D4 group"
definition = "The four first-order Hohfeldian positions, right, duty, liberty and no-right, are permuted by a correlative rotation $r$ of order 4 and an opposite swap $s$ of order 2 that satisfy $srs = r^{-1}$. These generate the dihedral group of order 8, which acts faithfully on the four positions."
first_stated = "Chapter 2, the generators and relations at `geometric-law/chapters/ch02_hohfeld.md:110-142` and the theorem with its proof at `geometric-law/chapters/ch02_hohfeld.md:473-475`."
conditions = [
  "Geometric Ethics, the founding volume, withdrew the dihedral group for the Hohfeldian positions in its version 1.25 and uses the Klein four-group. This volume's text predates that change and has not been revised.",
  "The rotation $r$ sends right to duty, duty to liberty, liberty to no-right and no-right to right. The swap $s$ exchanges right with no-right and duty with liberty.",
  "The result covers the first square only. The second square of power, liability, immunity and disability carries its own copy, and the two are joined in the octad gauge group.",
  "Reading each of the eight elements as a re-description that leaves the underlying legal bond unchanged is the volume's interpretation. That evaluation must be invariant under them is a separate axiom.",
]
standing = "A theorem the volume proves by direct verification of the three defining relations. The group theory is standard, and the legal reading of it belongs to the posited framework."
known_as = "Hohfeld's jural correlatives and opposites, and the dihedral group of symmetries of a square."
related = ["hohfeldian-octad-gauge-group", "judicial-bond-invariance-principle", "legal-wilson-loop"]

[[entry]]
id = "hohfeldian-octad-gauge-group"
kind = "result"
title = "Hohfeldian octad gauge group"
definition = "The symmetry group of the full Hohfeldian octad is the semi-direct product of two copies of the dihedral group of order 8. One copy acts on the first-order positions and the other on the second-order positions, and a homomorphism $\\varphi$ lets second-order operations twist first-order ones. The volume works with 64 elements."
first_stated = "Chapter 5, `geometric-law/chapters/ch05_hohfeldian_group.md:63-97`, with the full statement at `geometric-law/chapters/ch05_hohfeldian_group.md:433-433`."
conditions = [
  "The volume gives a proof sketch. The appendix specifies the coupling homomorphism on one generator of the second copy.",
  "When the coupling is trivial the group is the direct product, which the volume identifies as the Geometric Ethics result and calls adequate for ethics and inadequate for law.",
  "The chapter body says the order is at most 64 and depends on the coupling. The appendix states order 64.",
  "That the legal evaluation must be unchanged by all 64 elements is the Judicial Bond Invariance Principle, which is an axiom.",
]
related = ["hohfeldian-d4-group", "judicial-bond-invariance-principle", "legal-wilson-loop", "liability-damages-conservation"]

[[entry]]
id = "legal-wilson-loop"
kind = "instrument"
title = "Legal Wilson loop"
definition = "The ordered product of the Hohfeldian gauge transformations along the edges of a closed path of cases. If the product is the identity the cycle is consistent. Any other group element means the chain of precedents returns to its starting point with the rights and duties relabeled."
first_stated = "Chapter 5, `geometric-law/chapters/ch05_hohfeldian_group.md:153-171`, with the discrete form at `geometric-law/chapters/ch05_hohfeldian_group.md:435-441`."
conditions = [
  "Each edge needs a group element saying how the citing case relabels the positions of the cited case. In the volume's examples these are assigned by reading the cases.",
  "Relabeling at the vertices changes the product by conjugation. Only its conjugacy class, and so whether it is trivial, is gauge-invariant.",
  "The proposition that a body of case law is consistent if and only if all loops are trivial is stated without proof.",
  "Chapter 3 states that the time-ordered citation graph is acyclic. The running example closes its loop with a return step from the last case to the first that is not a citation.",
]
known_as = "Wilson loops and holonomy in gauge theory."
related = ["hohfeldian-octad-gauge-group", "precedential-weight-deformation", "legal-phase-transition", "topological-constitutionality"]

[[entry]]
id = "liability-damages-conservation"
kind = "result"
title = "Liability-damages conservation"
definition = "In a closed bilateral dispute under a fixed legal framework, the net liabilities of the two parties sum to zero. Every right that adjudication assigns to one party is a correlative duty of the other, and every dollar of damages awarded to one is a dollar of liability on the other."
first_stated = "Chapter 5, `geometric-law/chapters/ch05_hohfeldian_group.md:260-283`."
conditions = [
  "Closed means two fixed parties and a fixed legal framework. The volume names three operations that break the law, which are legislation, constitutional amendment and third-party intervention.",
  "Punitive damages are handled by extending the system to include the state as a third party, after which the three net liabilities sum to zero.",
  "The proof rests on Hohfeld's correlative pairs and on the premise that adjudication assigns positions already existing in the framework and creates none.",
  "Chapter 1 says the conservation laws are conditional on assumptions that may not hold in all legal contexts.",
]
standing = "The front matter classes conservation among its conditional theorems, results that follow from the model's axioms. No measurement of it is reported."
related = ["hohfeldian-d4-group", "equal-protection-gauge-invariance", "hohfeldian-octad-gauge-group"]

[[entry]]
id = "legal-invariance-principle"
kind = "concept"
title = "Legal Invariance Principle (LIP)"
definition = "A legal judgment procedure is well-posed if and only if its output is unchanged by every legally irrelevant transformation of the case. The listed transformations are renaming the parties, changing their race, gender, religion or national origin, rephrasing arguments without changing their logical content, reordering the presentation, and translating between languages."
first_stated = "Chapter 8, `geometric-law/chapters/ch08_equal_protection.md:50-62`."
conditions = [
  "Stated as an axiom. The volume presents it as a formalization of equal protection, due process and the rule that like cases be decided alike, and not as a reform proposal.",
  "It requires identical treatment only when all legally relevant features are identical. A prior felony conviction is a relevant feature, so a longer sentence for it is no violation.",
  "The principle does not itself say which features are irrelevant. Chapter 15 calls that choice a normative commitment, and the Judicial Bond Invariance Principle is the volume's answer.",
]
related = ["judicial-bond-invariance-principle", "equal-protection-gauge-invariance", "due-process-quotient-regularity", "legal-bond-index", "nuisance"]

[[entry]]
id = "judicial-bond-invariance-principle"
kind = "concept"
title = "Judicial Bond Invariance Principle (JBIP)"
definition = "If a transformation of a dispute's description preserves the Hohfeldian bond structure, meaning the configuration of rights, duties, liberties, no-rights, powers, immunities, liabilities and disabilities among the parties, then the legal evaluation must be unchanged."
first_stated = "Chapter 8, `geometric-law/chapters/ch08_equal_protection.md:104-114`."
conditions = [
  "Stated as an axiom. It is the Bond Invariance Principle of Geometric Ethics specialized to law.",
  "The volume calls it stronger than the Legal Invariance Principle because it fixes what counts as legally relevant. Two cases with isomorphic bond structures must receive the same evaluation.",
  "The volume identifies the bond-preserving transformations with the 64-element Hohfeldian gauge group of Chapter 5.",
  "The volume notes that existing doctrine applies different levels of scrutiny to race and to sex, and says the axiom suggests this asymmetry is problematic.",
]
related = ["legal-invariance-principle", "hohfeldian-octad-gauge-group", "legal-bond-index", "equal-protection-gauge-invariance"]

