[[entry]]
id = "legal-embedding"
kind = "instrument"
title = "Legal embedding and dimension probes"
definition = "A function from legal documents to vectors of fixed dimension such that documents on the same legal issue have high cosine similarity and a change of wording or style moves the vector by less than a tolerance. Eight linear probes then read the eight legal dimension scores from the vector."
first_stated = "Chapter 15, `geometric-law/chapters/ch15_ai_legal.md:56-66`, with the formal conditions at `geometric-law/chapters/ch15_ai_legal.md:475-485`. The pipeline first appears in Chapter 3, `geometric-law/chapters/ch03_judicial_complex.md:253-261`."
conditions = [
  "The embedding is frozen at a fixed version and the probes are logistic regressions, so the same text always gives the same scores.",
  "Chapter 3 names the multilingual encoder LaBSE with 768 dimensions, which places translations close together, and adds that Geometric Ethics reports language identity is still recoverable from such representations. Chapter 15 describes a legal-domain transformer for JurisGraph, the system of its running example.",
  "The probe accuracies the volume quotes, F1 from 0.74 to 0.91, are for the nine moral-dimension probes of the parent framework, as reported in an unpublished study by Thiele (2026), and the rights-and-duties axis failed its preregistered gate there. Chapter 3 says the methodology is exploratory and model-mediated in the Geometric Ethics claim ledger. For the legal probes it calls for about 200 expert-scored validation cases and at least 500 labeled cases per dimension.",
  "The front matter classes AI implementation as speculation or extension, and Chapter 4 states that the scoring and calibration programme has not yet been executed on legal data.",
]
standing = "This is the one corner the README of 2026-07-14 reports as instrumented. It says the legal text embedding LeBSE is validated in the xbse admission filter on US case law, with labels from the CourtListener citation graph, and that this covers structure preservation in legal text embeddings and not the book's broader jurisprudential claims. The chapters do not mention LeBSE or report that test."
known_as = "Sentence embeddings and linear probing classifiers."
related = ["embedding", "encoder", "eight-legal-dimensions", "logistic-regression", "legal-bond-index", "posited-versus-measured"]

[[entry]]
id = "legal-geometric-pathologies"
kind = "concept"
title = "Four geometric pathologies of law"
definition = "Four ways the legal search goes wrong. Heuristic corruption adds to a doctrinal heuristic a bias tied to legally irrelevant features. Objective hijacking optimizes a measurable proxy in place of the legal objective. A legal local minimum is a precedent too costly to overrule. Gauge breaking is an evaluation that changes under an equal protection transformation."
first_stated = "Chapter 10, the taxonomy at `geometric-law/chapters/ch10_legal_failures.md:26-35`, with the formal definitions at `geometric-law/chapters/ch10_legal_failures.md:357-385`."
conditions = [
  "The taxonomy is carried over from the four AI failure modes of Geometric Reasoning, Chapters 5 to 8. The volume asserts that the mapping is by shared mathematical structure and not by analogy.",
  "A local minimum is inescapable when the cost barrier around it exceeds the gain from reaching the better outcome.",
  "The pathologies interact. The appendix models corruption and gauge violation feeding each other as a linear recurrence that grows when the product of its two coupling constants is positive.",
  "The examples, such as plea bargaining as objective hijacking and qualified immunity as a local minimum, are the volume's readings of known phenomena.",
]
related = ["doctrinal-heuristic", "legal-phase-transition", "legal-bond-index", "gauge-violation-tensor"]

[[entry]]
id = "binary-verdict-irrecoverability"
kind = "result"
title = "Irrecoverability of the binary verdict and the scalar sentence"
definition = "A binary verdict maps the eight-dimensional legal space to one bit, and a sentence maps it to one number. Neither map is injective, so neither preserves the distances between cases, and nothing computed from the verdict or sentence alone recovers the dimensions that produced it."
first_stated = "Chapter 1, `geometric-law/chapters/ch01_binary_verdict.md:241-245`, introduced at `geometric-law/chapters/ch01_binary_verdict.md:40-44`."
conditions = [
  "Tagged in the volume as a conditional theorem, with a proof sketch. It applies the Scalar Irrecoverability Theorem in the form of Theorem 15.1 of Geometric Ethics and Theorem 14 of Geometric Economics, and the chapter says Theorem 13.1 of Geometric Reasoning states a composite-score form as a conditional theorem.",
  "It presupposes that a case is described by eight dimensions, which the volume tags as a modeling axiom.",
  "It says that information is lost, not that verdicts are wrong. The volume says the framework audits verdicts and does not determine them.",
]
related = ["eight-legal-dimensions", "projection", "judicial-complex", "legal-invariance-principle"]

[examples]
judicial-complex = "In the volume's illustrative mini-complex, five voter ID cases are the vertices and six citations are the directed edges, one of which runs from Crawford (Supreme Court, 2008) to Judge Rivera's district case of 2026."
eight-legal-dimensions = "The volume's illustrative vector for Crawford v. Marion County is (0.7, 0.5, 0.9, 0.5, 0.7, 0.8, 0.6, 0.7), so it scores 0.9 on procedural posture and 0.5 on statutory authority."
legal-mahalanobis-distance = "In the volume's illustration every variance is 0.04, so a difference of 0.3 on one dimension contributes 0.09 / 0.04 = 2.25. Its eight contributions sum to 5.3125, and the square root gives a distance of about 2.30."
legal-edge-weight = "In the volume's illustration the edge from McDonnell Douglas (Supreme Court) to a district case has quadratic form 5.3125, no boundary crossing and hierarchical cost 0, so its weight is 5.3125 + 0 + 0 = 5.3125. The reverse edge has infinite weight."
legal-friction = "A path of two edges with weights 2 and 3, plus one evidentiary requirement of weight 4 whose evidence falls 0.25 short of its threshold, has friction 2 + 3 + 4 x 0.25 = 6."
hohfeldian-d4-group = "Write c for the correlative and s for the opposite. Applying c then s to right gives duty and then liberty. Applying s then c gives no-right and then liberty. The two orders agree, as they must in the Klein four-group, and no product of c and s cycles the four positions."
hohfeldian-octad-gauge-group = "Each copy of the dihedral group has 8 elements, so the pairs of the withdrawn statement number 8 x 8 = 64. Each copy of the Klein four-group has 4 elements, so pairs of those number 4 x 4 = 16."
legal-wilson-loop = "In the volume's running example the four edges carry rs, e, e and s. The chapter's note reads r as the correlative involution c, so the edges are cs, e, e and s. The product is cs times s, and since s times s is the identity the loop equals c, which is not the identity, so the cycle is inconsistent."
liability-damages-conservation = "If the court awards A 100 dollars against B, the net liability of B is +100 and that of A is -100, and the sum is 0."
legal-invariance-principle = "Renaming Smith v. Jones as Doe v. Roe, with everything else unchanged, must leave the judgment unchanged."
judicial-bond-invariance-principle = "In the volume's example a landlord refuses a tenant for race in one case and for religion in another. Both cases have the same right, duty, breach, power and liability, so the evaluation must be the same."
equal-protection-gauge-invariance = "Changing a party's sex twice returns the original case, so that generator has order 2. If the original case draws 60 months, the case with the sex changed must also draw 60 months."
due-process-quotient-regularity = "Two descriptions of one dispute lie in the same equivalence class. If the evaluation returns liable for one and not liable for the other, it does not factor through the quotient, and due process fails."
legal-bond-index = "Sentences of 100, 50 and 80 months that become 110, 50 and 72 under a transformation change by 0.10, 0 and 0.10 of the original, so the normalized index is 0.20 / 3, about 0.067. For the measured form the chapter gives mean gaps at k = 20 of 2.323 deciles to neighbors of the other race and 2.215 to neighbors of the same race, and 2.323 / 2.215 is 1.049."
doctrinal-heuristic = "In the volume's illustration McDonnell Douglas estimates 2.0 + 0.5 + 4.0 = 6.5 friction units from the start and direct evidence estimates 8.0, so A* explores the McDonnell Douglas path first."
topological-constitutionality = "In the volume's running example the Digital Privacy Act adds two edges that create two new non-trivial directed cycles in the constitutional subcomplex, so the first path homology group changes and the statute is ruled unconstitutional."
precedential-weight-deformation = "With hierarchical weight 8 and decay exponent 2, the deformation scales as 8 / 4 = 2 at graph distance 2 and as 8 / 16 = 0.5 at graph distance 4."
legal-phase-transition = "Two relying cases with weights 3 and 1 whose edge weights change by 0.5 and 2 give an overruling cost of 3 x 0.5 + 1 x 2 = 3.5."
gauge-violation-tensor = "In the volume's hypothetical district the race row is 0.187, 0.213, 0.038, 0.082 and 0.104, which sums to 0.624. The five row sums 0.624, 0.479, 0.637, 0.156 and 0.444 add to 2.340, the total the chapter prints, and 2.340 / 25 is about 0.094."
legal-embedding = "With a tolerance of 0.05, an opinion and its plain-language restatement that embed 0.02 apart pass the style condition, and a pair 0.2 apart fails it. A probe whose linear score is 0 outputs 0.5, which the volume flags as uncertain."
legal-geometric-pathologies = "A heuristic whose true estimate is 6.5 and which adds 1.5 for a defendant's race returns 8.0, and the 1.5 is the corruption term. A local minimum with barrier 5 and gain 3 is inescapable because 5 exceeds 3."
binary-verdict-irrecoverability = "Two cases with first scores 0.9 and 0.6 that both receive the verdict 1 cannot be told apart from the verdict, although they differ by 0.3 on that dimension."
