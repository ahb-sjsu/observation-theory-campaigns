[examples]
judicial-complex = "In the volume's illustrative mini-complex, five voter ID cases are the vertices and six citations are the directed edges, one of which runs from Crawford (Supreme Court, 2008) to Judge Rivera's district case of 2026."
eight-legal-dimensions = "The volume's illustrative vector for Crawford v. Marion County is (0.7, 0.5, 0.9, 0.5, 0.7, 0.8, 0.6, 0.7), so it scores 0.9 on procedural posture and 0.5 on statutory authority."
legal-mahalanobis-distance = "In the volume's illustration every variance is 0.04, so a difference of 0.3 on one dimension contributes 0.09 / 0.04 = 2.25. Its eight contributions sum to 5.3125, and the square root gives a distance of about 2.30."
legal-edge-weight = "In the volume's illustration the edge from McDonnell Douglas (Supreme Court) to a district case has quadratic form 5.3125, no boundary crossing and hierarchical cost 0, so its weight is 5.3125 + 0 + 0 = 5.3125. The reverse edge has infinite weight."
legal-friction = "A path of two edges with weights 2 and 3, plus one evidentiary requirement of weight 4 whose evidence falls 0.25 short of its threshold, has friction 2 + 3 + 4 x 0.25 = 6."
hohfeldian-d4-group = "Apply s, then r, then s to right. Right goes to no-right, no-right goes to right, and right goes to no-right. The reverse rotation also sends right to no-right, so the two agree on this position, as the volume checks."
hohfeldian-octad-gauge-group = "Each copy of the dihedral group has 8 elements, so the pairs number 8 x 8 = 64. With a trivial coupling the product of (g1, g2) and (h1, h2) is (g1 h1, g2 h2)."
legal-wilson-loop = "In the volume's running example the four edges carry rs, e, e and s. The product is rs times s, and since s times s is the identity the loop equals r, which is not the identity, so the cycle is inconsistent."
liability-damages-conservation = "If the court awards A 100 dollars against B, the net liability of B is +100 and that of A is -100, and the sum is 0."
legal-invariance-principle = "Renaming Smith v. Jones as Doe v. Roe, with everything else unchanged, must leave the judgment unchanged."
judicial-bond-invariance-principle = "In the volume's example a landlord refuses a tenant for race in one case and for religion in another. Both cases have the same right, duty, breach, power and liability, so the evaluation must be the same."
equal-protection-gauge-invariance = "Changing a party's sex twice returns the original case, so that generator has order 2. If the original case draws 60 months, the case with the sex changed must also draw 60 months."
due-process-quotient-regularity = "Two descriptions of one dispute lie in the same equivalence class. If the evaluation returns liable for one and not liable for the other, it does not factor through the quotient, and due process fails."
legal-bond-index = "Sentences of 100, 50 and 80 months that become 110, 50 and 72 under a transformation change by 0.10, 0 and 0.10 of the original, so the normalized index is 0.20 / 3, about 0.067."
doctrinal-heuristic = "In the volume's illustration McDonnell Douglas estimates 2.0 + 0.5 + 4.0 = 6.5 friction units from the start and direct evidence estimates 8.0, so A* explores the McDonnell Douglas path first."
topological-constitutionality = "In the volume's running example the Digital Privacy Act adds two edges that create two new non-trivial directed cycles in the constitutional subcomplex, so the first path homology group changes and the statute is ruled unconstitutional."
precedential-weight-deformation = "With hierarchical weight 8 and decay exponent 2, the deformation scales as 8 / 4 = 2 at graph distance 2 and as 8 / 16 = 0.5 at graph distance 4."
legal-phase-transition = "Two relying cases with weights 3 and 1 whose edge weights change by 0.5 and 2 give an overruling cost of 3 x 0.5 + 1 x 2 = 3.5."
gauge-violation-tensor = "In the volume's hypothetical district the race row is 0.187, 0.213, 0.038, 0.082 and 0.104, which sums to 0.624. The five row sums 0.624, 0.479, 0.637, 0.156 and 0.444 add to 2.340, where the chapter prints 2.520, and 2.340 / 25 is about 0.094."
legal-embedding = "With a tolerance of 0.05, an opinion and its plain-language restatement that embed 0.02 apart pass the style condition, and a pair 0.2 apart fails it. A probe whose linear score is 0 outputs 0.5, which the volume flags as uncertain."
legal-geometric-pathologies = "A heuristic whose true estimate is 6.5 and which adds 1.5 for a defendant's race returns 8.0, and the 1.5 is the corruption term. A local minimum with barrier 5 and gain 3 is inescapable because 5 exceeds 3."
binary-verdict-irrecoverability = "Two cases with first scores 0.9 and 0.6 that both receive the verdict 1 cannot be told apart from the verdict, although they differ by 0.3 on that dimension."
