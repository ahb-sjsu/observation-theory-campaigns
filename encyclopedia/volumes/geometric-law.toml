[[entry]]
id = "doctrinal-heuristic"
kind = "concept"
title = "Doctrinal heuristic"
definition = "A legal doctrine read as an A* heuristic. It is a non-negative function on cases that estimates the remaining legal friction to the goal region, computed as the sum of the estimated costs of the claim's elements not yet established. It is admissible when no element's estimate exceeds its true proving cost."
first_stated = "Chapter 6, the definition at `geometric-law/chapters/ch06_precedent_heuristic.md:86-90`, admissibility at `geometric-law/chapters/ch06_precedent_heuristic.md:129-137`, and the appendix form at `geometric-law/chapters/ch06_precedent_heuristic.md:351-361`."
conditions = [
  "With an admissible heuristic, A* returns the minimum-friction argument. That is the standard A* guarantee, and the volume's proof assumes that element costs add.",
  "Overestimation breaks admissibility. Underestimation keeps it and weakens the guidance, down to the zero heuristic, which the volume identifies with a totality of the circumstances test.",
  "The volume calls balancing tests circular heuristics and says a novel legal question has no precomputed heuristic at all.",
  "The element costs are posited. The friction units in the chapter's comparison of McDonnell Douglas with direct evidence are illustrative.",
]
known_as = "Admissible heuristics in A* search, with precedent in the role of a pattern database."
related = ["legal-friction", "judicial-complex", "legal-geometric-pathologies", "precedential-weight-deformation"]

