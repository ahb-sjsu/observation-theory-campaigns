[[entry]]
id = "precedential-weight-deformation"
kind = "concept"
title = "Precedential weight deformation"
definition = "A binding precedent at a vertex adds a term to the weights of nearby edges. The size of the term scales as the precedent's hierarchical weight divided by the graph distance from the precedent raised to a decay exponent $n$, and the deformations of several precedents add."
first_stated = "Chapter 9, `geometric-law/chapters/ch09_stare_decisis.md:30-46`, with the full form at `geometric-law/chapters/ch09_stare_decisis.md:358-362`."
conditions = [
  "The decay law is given as a scaling relation. The volume gives no values for the exponent, the hierarchical weights or the holding operator.",
  "Hierarchical weight is ordered with the Supreme Court above a circuit court and a circuit court above a district court.",
  "The deformation defines the legal connection. Carrying a rule along heavily deformed edges may rotate it, and the rotation around a closed path is the holonomy read by the Wilson loop.",
]
related = ["legal-edge-weight", "legal-phase-transition", "legal-wilson-loop", "doctrinal-heuristic", "curvature"]

[[entry]]
id = "legal-phase-transition"
kind = "concept"
title = "Legal phase transition (overruling as graph surgery)"
definition = "Overruling a precedent is a discrete graph surgery. The old precedent's weight deformation is removed from every nearby edge and the new precedent's is added, which changes shortest paths discontinuously. Its cost is the sum, over the cases that relied on the old precedent, of each case's weight times the size of its weight change."
first_stated = "Chapter 9, `geometric-law/chapters/ch09_stare_decisis.md:110-126`, with the general definition and the critical point at `geometric-law/chapters/ch09_stare_decisis.md:210-232`."
conditions = [
  "The volume's criterion is that a precedent is overruled when the holonomy around its doctrinal loop exceeds a tolerance and the benefit exceeds the reliance cost. Neither threshold is given a value.",
  "A first-order transition flips a holding. A second-order transition changes a rule continuously with a jump in its rate of change, and the volume's example is the erosion of Bivens.",
  "The volume offers the model as an explanation of why overruling is rare and comes in clusters. It reports no test of the criterion.",
]
related = ["precedential-weight-deformation", "legal-wilson-loop", "legal-geometric-pathologies", "threshold"]

