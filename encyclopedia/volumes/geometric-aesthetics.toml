[[entry]]
id = "aesthetic-hilbert-space"
kind = "concept"
title = "Aesthetic Hilbert space"
definition = "The space of square-integrable complex functions on the aesthetic manifold. A state assigns an amplitude to each point, and its squared modulus is the probability that a reading places the work there. A work read in exactly one way is a state concentrated at one point, which recovers the classical picture."
first_stated = "Definition 13.1, `geometric-aesthetics/book/src/chapter-13-quantum-aesthetic-dynamics-superposition-measurement.md:25-33`."
conditions = [
  "The volume says it does not claim that art is literally quantum-mechanical. Appendix F marks the chapter's claims as analogy (F13.1 to F13.3).",
  "The inner product uses the volume form of the aesthetic metric on a regular stratum. Appendix F marks that Riemannian structure conjectured (F5.3).",
  "Critical readings are modeled as self-adjoint operators, and Proposition 13.1 is the standard Robertson inequality carried over unchanged.",
  "Order effects in pairwise comparison are conjectured empirically. The volume has no such data and proposes a human-subjects study.",
]
standing = "Analogy. Appendix F says the quantum vocabulary is used for its expressive power, with no empirical commitment."
