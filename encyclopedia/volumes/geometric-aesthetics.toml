[[entry]]
id = "collective-aesthetic-tensor"
kind = "concept"
title = "Collective aesthetic tensor"
definition = "A multilinear map that takes one interest covector from each reader in a population and returns a collective valence direction on the manifold. For two readers it splits into each reader's individual contribution plus an emergent component, the part of collective valence not attributable to any individual."
first_stated = "Section 14.4, `geometric-aesthetics/book/src/chapter-14-collective-aesthetic-agency-canon-and-emergence.md:49-62`."
conditions = [
  "The emergent component vanishes exactly when collective valence is the sum of the individual valences.",
  "Appendix F marks canon formation as geometric aggregation of individual judgments as conjectured, with no direct empirical fit (F14.1).",
  "The evidence offered for a nonzero emergent component is the 71 Lasso axes. The chapter's own caveat is that most of those axes do genre discrimination and that the point is structural, not a matter of effect size.",
  "The count of 729 components assumes nine working axes per reader. Section 5.5 says the aesthetic manifold, unlike the moral one, does not start from nine known dimensions.",
]
standing = "Posited. No reader-level interest covectors are measured in the volume, and the Lasso axes are regression directions on aggregate ratings."
related = ["lasso-on-spectrum-channel", "aesthetic-genre-confound-correction", "aesthetic-scalar-irrecoverability", "aesthetic-regime", "aggregation"]
online_page = "chapter-14-collective-aesthetic-agency-canon-and-emergence.html"

[[entry]]
id = "aesthetic-scalar-irrecoverability"
kind = "result"
title = "Aesthetic Scalar Irrecoverability (Theorem 15.1)"
definition = "Any function $Q$ from a $d$-dimensional aesthetic tensor to a scalar verdict is not injective, so distinct works share a verdict. No function recovers the tensor from the scalar. The geodesic on the full manifold generally differs from the path that is optimal for the scalar."
first_stated = "Theorem 15.1, `geometric-aesthetics/book/src/chapter-15-from-tensor-to-judgment.md:127-135`."
conditions = [
  "It is given with a proof sketch (rank-nullity and the data processing inequality) and is said to transfer unchanged from the Ethics volume.",
  "Part (i) is stated generically, at regular points of $Q$.",
  "Part (iii) concerns geodesics on a manifold whose Riemannian structure Appendix F marks conjectured.",
  "Appendix F records only the weaker statement that a scalar is the lowest-information projection of the feature tensor, marked proved trivially (F6.1).",
]
standing = "A theorem with a proof sketch. Parts (i) and (ii) are elementary facts about maps to one dimension, and part (iii) depends on posited geometry."
known_as = "The Scalar Irrecoverability Theorem of Geometric Methods and Geometric Ethics, in aesthetic form."
related = ["aesthetic-tensor-hierarchy", "collective-aesthetic-tensor", "scalar-irrecoverability", "moral-scalar-irrecoverability", "projection"]
online_page = "chapter-15-from-tensor-to-judgment.html"

[[entry]]
id = "aesthetic-ledger-statuses"
kind = "instrument"
title = "Four epistemic statuses (Appendix F ledger)"
definition = "The labels the volume puts on each formal claim. Proved means standard mathematics. Verified empirically means tested on the volume's data, with effect size, sample size and p-value. Conjectured means stated as a prediction and not tested. Analogy means mathematical language used without a literal claim on the domain."
first_stated = "Appendix F, Section F.1, `geometric-aesthetics/book/src/appendices/appendix-f-mathematical-ledger-status-of-formal-claims.md:7-15`."
conditions = [
  "A verified claim is a finding in the volume's corpora, not a theorem. The appendix says the verification is withdrawn if a future replication fails.",
  "Null results are entered as verified nulls (non-fiction, Classical, Jazz).",
  "The Noether reading (F12.3) and the quantum chapter (F13.1 to F13.3) are the two places labeled analogy.",
  "The ledger does not record the pre-registration or the failed compressibility formula that the README's status block mentions.",
]
standing = "The volume's own classification scheme. The README of 2026-07-14 adds a coarser one, a validated empirical result inside a posited framework."
related = ["aesthetic-falsification-criteria", "aesthetic-invariance-claim", "aesthetic-hilbert-space", "posited-versus-measured", "withdrawn-versus-refuted"]
online_page = "appendix-f-mathematical-ledger-status-of-formal-claims.html"

[[entry]]
id = "aesthetic-falsification-criteria"
kind = "instrument"
title = "Falsification criteria (Appendix E.8)"
definition = "Four stated tests. The symmetry claim is falsified if cross-lingual correlation falls below 0.5 across several language families on a pre-registered bundled corpus with n at least 200. The sign-flip claim is weakened or overturned if the flip fails on a new music corpus with a different encoder. The within-genre claim is weakened if the residual fails to replicate. Any proved claim with a proof error is retracted."
first_stated = "Appendix E, Section E.8, `geometric-aesthetics/book/src/appendices/appendix-e-skeptics-appendix-objections-alternatives-failure-modes.md:65`. The summary is in Section E.10, `geometric-aesthetics/book/src/appendices/appendix-e-skeptics-appendix-objections-alternatives-failure-modes.md:79-81`."
conditions = [
  "The criteria are commitments for future replications. The appendix says none of the tests has failed so far, and those tests are the volume's own runs.",
  "The replications named (a different music encoder, a new corpus, a pre-registered bundled corpus) have not been carried out in the volume.",
  "The appendix answers the objection that four channels, 71 axes and many residualization choices leave the framework free to fit any story.",
]
standing = "A stated commitment, not a result. Section E.10 says the thesis would be substantially undermined if cross-lingual invariance, the sign flip and the within-genre signal all failed to replicate."
related = ["cross-lingual-aesthetic-invariance", "cross-modality-sign-flip", "aesthetic-genre-confound-correction", "aesthetic-ledger-statuses", "preregistration"]
online_page = "appendix-e-skeptics-appendix-objections-alternatives-failure-modes.html"

[examples]
aesthetic-manifold = "With embedding dimension d = 2 the Gaussian submanifold has dimension d + d(d+1)/2 = 2 + 3 = 5, two numbers for the mean and three for the symmetric covariance."
aesthetic-embedding-cloud = "The volume's cases are a 300-paragraph novel under LaBSE, which gives 300 points in 768 dimensions, and a 30-second clip under MERT at 1.5 frames per second, which gives 45 points in 1024 dimensions."
aesthetic-tensor-hierarchy = "In the volume's books discovery run, Level 1 alone gives R of about 0.08, adding Level 2 gives 0.18, adding Level 3 gives 0.21 and adding Level 4 gives 0.24, so the increments are 0.10, 0.03 and 0.03."
aesthetic-spectral-divergence-channel = "In one dimension, a work with mean 2 against a prior with mean 0 and variance 4 has Mahalanobis distance 2 divided by the prior standard deviation 2, which is 1."
aesthetic-internal-coherence = "A work with three units whose pairwise cosine similarities are 0.9, 0.5 and 0.4 has pair_sim_mean equal to 1.8 divided by 3, which is 0.6."
aesthetic-trajectory-channel = "A work whose three units sit at 0, 3 and 4 on a line takes steps of 3 and 1, so its mean step size is 2."
lasso-on-spectrum-channel = "In the books experiment 71 of the 128 PCA coordinates get nonzero weight, so the L1 penalty set the other 57 coefficients to zero."
aesthetic-genre-confound-correction = "R squared falls from 0.241 squared, about 0.058, to 0.093 squared, about 0.009. The share removed is 1 minus 0.009 divided by 0.058, about 0.85, the volume's 85 percent."
music-reception-geometry-result = "For the spectrum channel R squared is 0.302 squared, about 0.091, before genre control and 0.177 squared, about 0.031, after it, so about two thirds of that channel's raw R squared was genre."
cross-lingual-aesthetic-invariance = "A mean correlation of 0.70 squares to 0.49, which is the volume's statement that about half the variance in the channel values is preserved across languages and half is not."
cross-modality-sign-flip = "The volume's table gives pair_sim_mean a correlation of +0.126 with book rating and -0.076 with music listens. The two have opposite signs, and so do -0.096 and +0.071 for step_mean."
aesthetic-hellinger-saturation = "With about 45 tokens per clip the sample covariance has rank at most 44, which is less than the 128 dimensions of the first fit and more than the 32 dimensions of the refit."
aesthetic-regime = "The volume's within-stratum figures differ by regime. Fiction gives R = 0.131 on 2,250 books and Classical music gives R = -0.013 on 584 tracks, which the volume reads as null."
discovered-constructed-metric = "For books the three reporting levels the volume asks for are R = 0.241 for the full model, R = 0.093 for the within-genre residual, and a correlation near 0.70 for the features that transfer across languages."
style-holonomy = "If transport around a loop turns every tangent vector by a quarter turn, the vector (1, 0) comes back as (0, 1). The holonomy is not the identity, so the connection is curved there."
taste-heuristic-correspondence = "With the identity metric and heuristic h = x squared plus y squared, the gradient at the point (1, 2) is (2, 4), so the taste vector is (-2, -4) and points toward the goal at the origin."
aesthetic-invariance-claim = "Exact invariance would give a correlation of 1 between a feature measured on English books and on their Finnish translations. The volume measured 0.77 for the Hellinger feature on 288 pairs, so the claim holds approximately."
aesthetic-hilbert-space = "A work in the state 0.6 times the lyric reading plus 0.8 times the joke reading is read as a lyric with probability 0.36 and as a joke with probability 0.64, and the two sum to 1."
collective-aesthetic-tensor = "For two readers and the chapter's nine working axes the tensor has 9 times 9 times 9, which is 729 components. That is the volume's count."
aesthetic-scalar-irrecoverability = "Take the verdict Q(x, y) = x + y. The works (1, 3) and (2, 2) both score 4, so no rule can tell from the 4 which of them was rated."
aesthetic-ledger-statuses = "In the ledger the cross-lingual correlations (F12.1) are verified empirically, while their reading as a Noether conservation law (F12.3) is analogy, so one chapter carries two statuses."
aesthetic-falsification-criteria = "Criterion (i) needs a correlation below 0.5 on at least 200 bundles. The volume's Finnish (288) and French (227) pairs meet the size bar and show 0.77 and 0.78, above the threshold."
