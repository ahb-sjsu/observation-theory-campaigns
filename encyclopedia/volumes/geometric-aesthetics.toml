[[entry]]
id = "style-holonomy"
kind = "concept"
title = "Style holonomy"
definition = "For a closed loop on the aesthetic manifold that starts and ends at a point $p$, the holonomy is the linear map on the tangent space at $p$ given by parallel transport of feature vectors around the loop. If it is the identity for every loop the connection is locally flat, and otherwise the connection has curvature."
first_stated = "Definition 10.3, `geometric-aesthetics/book/src/chapter-10-aesthetic-dynamics-parallel-transport-style-holonomy.md:101-103`."
conditions = [
  "It needs a connection on the manifold, which the volume takes to be the torsion-free Levi-Civita connection of the aesthetic metric within a stratum.",
  "Appendix F marks the abstract statement proved and the empirical one conjectured. Measurement of holonomy on the corpus is not yet implemented (F10.2).",
  "The statement that genre-internal space is approximately flat and that cross-genre loops accumulate large rotations is given as a conjecture.",
  "The Dickens to Tolstoy to Joyce to Franzen circuit and the Coltrane loop are illustrations, not measurements. Section 10.6 says curvature has not been estimated from data.",
]
standing = "Posited. The definition is standard differential geometry, and no holonomy has been measured on the volume's data."
known_as = "The holonomy of a connection in Riemannian geometry."
related = ["aesthetic-trajectory-channel", "aesthetic-manifold", "aesthetic-regime", "moral-holonomy", "curvature"]
online_page = "chapter-10-aesthetic-dynamics-parallel-transport-style-holonomy.html"

