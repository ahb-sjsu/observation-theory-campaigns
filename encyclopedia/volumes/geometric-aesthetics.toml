[volume]
number = 13
title = "Geometric Aesthetics"
repo = "geometric-aesthetics"
slug = "geometric-aesthetics"
standing = "The README's epistemic-status block of 2026-07-14 calls the volume mixed, with one validated empirical result (the structural channels measured on 4,998 books) inside a posited book-length theory, and it records that the original compressibility formula failed and that the AesBSE embedding instrument was ruled inadmissible for genre confound and cross-modal sign flips. Appendix F labels each formal claim as proved, verified empirically, conjectured or analogy, and it files the Noether and quantum chapters under analogy."

[[entry]]
id = "aesthetic-manifold"
kind = "concept"
title = "Aesthetic manifold"
definition = "The space whose points are probability distributions on a modality-specific embedding space. A work is the distribution induced by its embedding cloud, the corpus is a reference distribution, and distances are divergences between distributions. In practice the volume works on the Gaussian submanifold of means and covariances."
first_stated = "Definition 5.1 and the Gaussian restriction, `geometric-aesthetics/book/src/chapter-05-the-aesthetic-manifold.md:27-35`."
conditions = [
  "The definition is marked informal. Appendix F lists the claim that the space is a Riemannian manifold with a positive-definite metric everywhere as conjectured (F5.3), with differentiable structure, metric smoothness and geodesic completeness not established.",
  "What Appendix F counts as verified is a finite-sample check. Pairwise feature distances on 4,998 books were strictly positive and satisfied the triangle inequality on sampled triples.",
  "The Gaussian fit keeps only the first two moments. Section 5.7 says embedding clouds are heavy-tailed and multi-modal, and it assigns the remainder to the trajectory level of the tensor hierarchy.",
  "Distances depend on the corpus chosen as prior. Section 5.4 says a different prior rearranges the absolute distances.",
]
standing = "Posited structure. Appendix F marks the manifold claim conjectured and marks only the finite-sample distance checks verified empirically."
known_as = "The statistical manifold of information geometry, with the Fisher information metric on the Gaussian family."
related = ["aesthetic-embedding-cloud", "aesthetic-tensor-hierarchy", "aesthetic-regime", "manifold", "kl-divergence", "gaussian"]
online_page = "chapter-5-the-aesthetic-manifold.html"

[[entry]]
id = "aesthetic-embedding-cloud"
kind = "concept"
title = "Embedding cloud of a work"
definition = "The set $X(W)$ of vectors obtained by cutting a work $W$ into units (paragraphs, audio frames, image patches) and passing each unit through a fixed pretrained encoder. The work is treated as this cloud and not as a single point."
first_stated = "Section 5.2, `geometric-aesthetics/book/src/chapter-05-the-aesthetic-manifold.md:41-45`. Restated in Section 17.2, `geometric-aesthetics/book/src/chapter-17-empirical-evidence-for-geometric-aesthetics.md:19-25`."
conditions = [
  "The encoder is a modeling choice. The volume uses LaBSE (768 dimensions) for text and MERT-v1-330M layer 7 (1024 dimensions) for music, and it says the empirical claims depend on these encoders.",
  "Images are named as compatible with the framework but the empirical chapters report on text and music only.",
  "The mean and covariance summaries discard the order of the units. Order is kept only in the trajectory features.",
  "Section 16.2 limits the construction to artifacts an encoder can embed. Live performance and conceptual art fall outside it.",
]
standing = "A construction, with encoders fixed by choice. The claim that aesthetic features of a work are geometric features of its cloud is called a candidate claim in Section 17.2."
related = ["aesthetic-manifold", "aesthetic-tensor-hierarchy", "embedding", "encoder", "covariance-matrix"]
online_page = "chapter-5-the-aesthetic-manifold.html"

[[entry]]
id = "aesthetic-tensor-hierarchy"
kind = "concept"
title = "Aesthetic tensor hierarchy"
definition = "Four levels of description of a work's embedding cloud. Level 1 is the mean displacement from the corpus prior, Level 2 the covariance with its divergences and internal coherence, Level 3 the trajectory statistics of the ordered sequence, and Level 4 the axes selected by Lasso on the PCA spectrum. A scalar rating sits below all four."
first_stated = "Section 6.1, `geometric-aesthetics/book/src/chapter-06-the-tensor-hierarchy.md:11-20`."
conditions = [
  "Higher levels can be contracted to a scalar prediction but a scalar does not reconstruct the levels above it.",
  "Levels 1 to 3 are computed in closed form from the cloud. Level 4 is learned and needs a target such as rating or listens, so it depends on that target.",
  "The incremental values of R per level (about 0.08, 0.18, 0.21, 0.24) are from the books discovery run before genre control. The volume later attributes 85 percent of that run's R squared to genre.",
  "Appendix F marks rank-2 and higher tensors on the manifold as conjectured pending the smooth-manifold claim (F6.3).",
]
standing = "A posited organization of measured features. The per-level increments are measured on the uncontrolled books run, and the tensor objects on the manifold are conjectured in Appendix F."
related = ["aesthetic-embedding-cloud", "aesthetic-spectral-divergence-channel", "aesthetic-internal-coherence", "aesthetic-trajectory-channel", "lasso-on-spectrum-channel", "aesthetic-scalar-irrecoverability"]
online_page = "chapter-6-the-tensor-hierarchy.html"

[[entry]]
id = "aesthetic-spectral-divergence-channel"
kind = "instrument"
title = "Spectral divergence from a corpus prior"
definition = "Fit a Gaussian to a work's embeddings and another to a reference corpus, both in a PCA subspace, and compute five divergences between them. They are Kullback-Leibler, Jensen-Shannon, Hellinger, Bhattacharyya, and the Mahalanobis distance of the work's mean from the prior mean."
first_stated = "Section 17.3.1, `geometric-aesthetics/book/src/chapter-17-empirical-evidence-for-geometric-aesthetics.md:35-47`."
conditions = [
  "Both distributions are modeled as multivariate Gaussians. Section 5.7 calls the per-work Gaussian an approximation.",
  "In the books discovery run each divergence registers at roughly 8 sigma against rating. That run is before genre control.",
  "In music the Hellinger member saturated near 1.0 and the divergences were recomputed in a 32-dimensional subspace.",
  "The prior is fitted on the English books corpus and is not neutral. A different corpus gives different distances.",
]
standing = "A measured instrument. The closed forms of the divergences are marked proved in Appendix F (F4.2 to F4.5), and the 8 sigma figure is a discovery-run measurement that precedes the genre control."
related = ["aesthetic-hellinger-saturation", "aesthetic-genre-confound-correction", "cross-lingual-aesthetic-invariance", "kl-divergence", "mahalanobis-distance", "principal-component-analysis"]
online_page = "chapter-17-empirical-evidence-for-geometric-aesthetics.html"

