[volume]
number = 3
title = "Geometric Reasoning"
repo = "geometric-reasoning"
slug = "geometric-reasoning"
standing = "Posited framework. The README's epistemic-status block of 2026-07-14 calls the volume speculative theory awaiting instruments, to be read as theory at licensed strength and not as validated measurement. Its chapters tag each claim as established mathematics, empirical, modeling axiom, conditional theorem or speculation, and the empirical tags rest on one benchmark of five language models."

[[entry]]
id = "reasoning-manifold"
kind = "concept"
title = "Reasoning manifold"
definition = "The set of coherent reasoning states of a cognitive system, taken to be a low-dimensional manifold $M$ inside the high-dimensional activation space. Reasoning is a trajectory on $M$, and its quality is read from the geometry of $M$ and from how the trajectory sits against the geodesics of $M$."
first_stated = "Section 2.4.2, the Manifold Hypothesis for Reasoning, `geometric-reasoning/chapters/ch02_when_space_has_shape.md:164-174`."
conditions = [
  "Tagged a modeling axiom. The volume calls it a substantive empirical claim and not a definition, and it does not measure the manifold or its metric.",
  "It asserts three things. Coherent states are a thin subset of activation space, the subset is smooth and low-dimensional, and its geometry is not uniform.",
  "The support offered is indirect. It is representation engineering, circuit findings, low-rank fine-tuning and the volume's own 7-dimensional harm ratings, which use a Euclidean metric as a first approximation.",
  "Chapter 15 leaves open whether a Riemannian manifold is the right object and lists Finsler, sub-Riemannian and stratified alternatives.",
]
known_as = "The manifold hypothesis of machine learning, which the volume cites from Bengio, Courville and Vincent and extends from data to reasoning states."
related = ["manifold", "metric", "curvature", "heuristic-field", "reasoning-geodesic-deviation", "posited-versus-measured"]

[[entry]]
id = "heuristic-field"
kind = "concept"
title = "Heuristic field"
definition = "A smooth function $h$ from the reasoning manifold to the non-negative reals that estimates the cost of reaching the goal region from each state. It is zero on the goal region and positive elsewhere, and its negative gradient is the direction the search follows."
first_stated = "Section 3.1.2, `geometric-reasoning/chapters/ch03_the_heuristic_field.md:35-45`, with the formal definition at `geometric-reasoning/chapters/ch03_the_heuristic_field.md:417-417`."
conditions = [
  "Tagged a modeling axiom. That a reasoning system's guidance is one scalar field on a manifold is a structural choice of the volume.",
  "Smoothness is assumed so that the gradient exists. The integral curves of the negative gradient approximate geodesics only when the heuristic equals the true cost-to-go.",
  "For language models the field is implicit. Chapter 15 lists measuring it from activations as an open question.",
]
known_as = "The heuristic function of A* search, restated as a scalar field. The volume compares it to a potential energy surface and a loss landscape."
related = ["reasoning-manifold", "heuristic-admissibility", "false-termination-region", "corruption-tensor", "gradient"]

[[entry]]
id = "heuristic-admissibility"
kind = "concept"
title = "Admissible heuristic field"
definition = "A heuristic field is admissible when it never overestimates the true cost-to-go, so that $h(x)$ is at most the geodesic distance from $x$ to the goal region at every state. It is consistent when $h(x)$ is at most the distance from $x$ to $y$ plus $h(y)$ for every pair of states."
first_stated = "Section 3.3.1, `geometric-reasoning/chapters/ch03_the_heuristic_field.md:117-127`, and Definitions 3.1 and 3.2 at `geometric-reasoning/chapters/ch03_the_heuristic_field.md:419-429`."
conditions = [
  "The guarantee that A* with an admissible heuristic finds an optimal path is the theorem of Hart, Nilsson and Raphael, which the volume tags established mathematics for graph search.",
  "Consistency implies admissibility and not the reverse. In the smooth case consistency means the gradient of the heuristic has norm at most 1.",
  "Carrying the guarantee over to a manifold and to language models rests on the volume's modeling axioms.",
  "The volume states that overconfidence is not this failure. It is the complementary one, underestimation in a search that stops when the heuristic is small.",
]
known_as = "Admissibility and consistency of heuristics in A* search, from Hart, Nilsson and Raphael (1968)."
related = ["heuristic-field", "false-termination-region", "geodesic-distance", "reasoning-geodesic-deviation"]
standing = "The definitions and the optimality theorem are established mathematics of search. Their use as a description of reasoning in language models is posited."

[[entry]]
id = "false-termination-region"
kind = "result"
title = "False termination region"
definition = "The set of states outside the goal where the heuristic reads below the stopping threshold while the true distance to the goal is large. A search that halts when $h(x)$ falls below the threshold and enters this set stops outside the goal. The volume reads overconfidence as this underestimation of cost-to-go."
first_stated = "Proposition 3.1 and Corollary 3.1, `geometric-reasoning/chapters/ch03_the_heuristic_field.md:439-441`, with the reading of overconfidence in Section 3.6.3, `geometric-reasoning/chapters/ch03_the_heuristic_field.md:273-277`."
conditions = [
  "It assumes a satisficing search with a fixed threshold. The heuristic must underestimate the true cost-to-go by more than the threshold on a region that does not meet the goal.",
  "Tagged a conditional theorem. The identification of a model's stated confidence with the terminal value of an implicit heuristic is the volume's modeling step.",
  "The measured part is separate. All five models were overconfident on the calibration task, with expected calibration errors from 0.230 to 0.415.",
]
related = ["heuristic-field", "heuristic-admissibility", "expected-calibration-error", "calibration", "reasoning-basin-of-attraction"]
standing = "A conditional statement about threshold search, given without a full proof. The calibration errors it is attached to are benchmark measurements, and the link between the two is posited."

[[entry]]
id = "reasoning-geodesic-deviation"
kind = "concept"
title = "Geodesic deviation of a reasoning trajectory"
definition = "The cost of a reasoning trajectory minus the cost of the geodesic that joins the same endpoints. The optimal trajectory is the path from the problem state to the goal region that minimizes the cost functional. The deviation is never negative and is zero only for a geodesic."
first_stated = "Definitions 4.1 and 4.2, `geometric-reasoning/chapters/ch04_geodesics_and_optimal_reasoning.md:92-98`."
conditions = [
  "Tagged a modeling axiom. It needs a cost metric on the reasoning manifold, which the volume posits and does not measure.",
  "It measures the efficiency of the path and not whether the answer is right. A lucky shortcut can be accurate and still have a large deviation.",
  "The volume computes it only in illustrations. Its one empirical pointer is framework-switching efficiency, which it calls a proxy.",
]
known_as = "Path length excess over the shortest path. It is not the geodesic deviation equation of differential geometry, which describes how nearby geodesics separate."
related = ["reasoning-manifold", "geodesic-distance", "heuristic-field", "nat"]

[[entry]]
id = "corruption-tensor"
kind = "concept"
title = "Corruption tensor"
definition = "The first-order response of a system's final judgment to task-irrelevant perturbations. Entry $C_{ij}$ gives the displacement of judgment dimension $i$ per unit intensity of perturbation direction $j$. It is the Jacobian of the judgment endpoint with respect to the perturbation intensities, taken at zero perturbation."
first_stated = "Definition 5.1, `geometric-reasoning/chapters/ch05_heuristic_corruption.md:326-334`, introduced in Section 5.5, `geometric-reasoning/chapters/ch05_heuristic_corruption.md:172-182`."
conditions = [
  "The tensor is tagged a modeling axiom. It is a linear response and holds to first order in the perturbation intensity.",
  "It is specific to a model and is not symmetric in general. A column of zeros marks a perturbation the system is invariant to.",
  "The benchmark probes three columns, for framing, emotional anchoring and sensory distractors. The volume says mapping the full tensor remains an open empirical program.",
  "No entry of the tensor is reported as a number. The data are significance levels and score drifts that the volume reads as projections of columns.",
]
related = ["jacobian", "heuristic-field", "model-robustness-profile", "reasoning-bond-invariance-principle", "nuisance", "singular-value-decomposition"]
standing = "The tensor is posited. What is measured is displacement under three perturbation types on five models, reported with combined significance of 8.9, 6.8 and 4.6 sigma, and no significant displacement under gender swap or evaluation order."

[[entry]]
id = "sycophancy-parameter"
kind = "concept"
title = "Sycophancy parameter"
definition = "The weight $\\alpha$ between 0 and 1 in the combined objective $(1-\\alpha) f_T + \\alpha f_A$, where $f_T$ rewards states near the correct answer and $f_A$ rewards states that agree with the interlocutor. At 0 the search follows truth alone and at 1 it follows approval alone."
first_stated = "Section 6.3, `geometric-reasoning/chapters/ch06_sycophancy_as_search_hijacking.md:69-75`, and Definition 6.1, `geometric-reasoning/chapters/ch06_sycophancy_as_search_hijacking.md:438-442`."
conditions = [
  "Tagged a modeling axiom. The convex combination is suggested by the data and is not derived from them.",
  "It describes a shifted objective and not a corrupted heuristic. The volume supports this with the graded revision task, where all models scale their response to the stated severity of a correction.",
  "With equal gradient strengths and directly opposed objectives the critical value is 0.5, above which the search has no net component toward truth.",
  "The volume gives no fitting procedure. Its values for models follow the sycophancy index, about 0.47, 0.66 and 0.73 for three models, and it sets the fourth at about 0.",
]
related = ["correction-discrimination-gap", "corrigibility-basin", "heuristic-field", "reasoning-bond-invariance-principle"]
standing = "The parameter is posited. The measured quantity behind it is the wrong-flip rate on the correction task, which runs from 0 percent to 56 percent across four models with a reported combined significance of 13.3 sigma."

[[entry]]
id = "correction-discrimination-gap"
kind = "instrument"
title = "Discrimination gap"
definition = "The correct-flip rate minus the wrong-flip rate. The correct-flip rate is how often a system changes its answer after a valid correction, and the wrong-flip rate is how often it abandons a correct answer after an invalid one. A gap of 1 is perfect discrimination and a gap of 0 is none."
first_stated = "Definition 6.2, `geometric-reasoning/chapters/ch06_sycophancy_as_search_hijacking.md:458-462`, with the sycophancy index defined at `geometric-reasoning/chapters/ch06_sycophancy_as_search_hijacking.md:452-456`."
conditions = [
  "It is an observable computed from two rates on the same correction task, with no geometric assumption.",
  "The companion sycophancy index is the wrong-flip rate divided by the correct-flip rate.",
  "Table 6.1 prints gaps of 0.588, 0.377, 0.238 and 0.206 for four models. The table of Section 11.4.1 printed different rates for three of them until the correction of 2026-11-26 and now follows Table 6.1.",
  "Reading the gap as distance to a critical surface or as the asymmetry of a basin is the volume's posited interpretation.",
]
related = ["sycophancy-parameter", "corrigibility-basin", "precision-recall", "false-positive-rate"]
standing = "A measured benchmark quantity tagged empirical. The two chapters that tabulate it agree since the correction of 2026-11-26, which set Chapter 11 to the values of Table 6.1. The benchmark's run records are not in the repository."

[[entry]]
id = "reasoning-basin-of-attraction"
kind = "concept"
title = "Basin of attraction of a reasoning minimum"
definition = "The set of states from which gradient flow on the evaluation function converges to a given local minimum. Its depth is the lowest value of the function on the basin's boundary minus the value at the minimum. A dead zone is different. It is a flat region with a near-zero gradient and no minimum."
first_stated = "Definition 7.1, `geometric-reasoning/chapters/ch07_local_minima_and_dead_zones.md:381-385`, with dead zones defined in Section 7.5, `geometric-reasoning/chapters/ch07_local_minima_and_dead_zones.md:189-195`."
conditions = [
  "It assumes a smooth evaluation function with isolated local minima on a Riemannian reasoning manifold. The basins then partition the manifold up to a set of measure zero.",
  "The definition is standard dynamics. That a model's premature convergence is a trajectory settling in such a basin is the volume's posited reading.",
  "No basin depth, radius or exit angle is measured in the volume.",
]
known_as = "Basins of attraction of gradient flow in dynamical systems and optimization."
related = ["prompt-recovery-ceiling", "false-termination-region", "corrigibility-basin", "heuristic-field", "gradient"]

