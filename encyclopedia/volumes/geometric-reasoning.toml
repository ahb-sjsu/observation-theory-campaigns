[[entry]]
id = "reasoning-gauge-transformation"
kind = "concept"
title = "Gauge transformation of a problem description"
definition = "A map $\\tau$ on problem descriptions that changes the surface presentation and keeps the task-relevant content. With $\\pi$ the projection from descriptions to content, $\\tau$ is a gauge transformation exactly when $\\pi(\\tau(x)) = \\pi(x)$ for every description $x$. Such maps form a group under composition."
first_stated = "Definition 8.1, `geometric-reasoning/chapters/ch08_gauge_invariance_and_symmetry.md:485-485`, introduced in Section 8.1.2, `geometric-reasoning/chapters/ch08_gauge_invariance_and_symmetry.md:50-58`."
conditions = [
  "It presupposes a content projection, a decision about which features of a description are task-relevant. The volume does not construct this projection for its benchmark and relies on rewrites judged to preserve content.",
  "The group claim needs every transformation to have a content-preserving inverse, which the definition asserts.",
  "The standard applied to gauge transformations is invariance, an identical output, and not robustness, a nearby one.",
]
known_as = "Gauge transformations of physics, used by analogy. The same structure is a group action whose orbits are the classes of equivalent descriptions."
related = ["reasoning-bond-invariance-principle", "quotient", "paraphrase-class", "nuisance", "group-consistent-augmentation"]

[[entry]]
id = "reasoning-bond-invariance-principle"
kind = "concept"
title = "Bond Invariance Principle for reasoning"
definition = "A judgment function $f$ satisfies the principle when $f(\\tau(x)) = f(x)$ for every description $x$ and every gauge transformation $\\tau$. Equivalently the judgment depends only on the content of the description. A failure is a gauge anomaly, and its magnitude along $\\tau$ is the distance between $f(\\tau(x))$ and $f(x)$."
first_stated = "Section 8.2, `geometric-reasoning/chapters/ch08_gauge_invariance_and_symmetry.md:68-70`, with the formal statement at `geometric-reasoning/chapters/ch08_gauge_invariance_and_symmetry.md:487-491`."
conditions = [
  "Tagged a modeling axiom. The volume uses it as a diagnostic criterion relative to a chosen class of gauge transformations.",
  "It applies only to content-preserving transformations. A change to the facts should change the output.",
  "A test of it is only as good as the claim that the rewrite preserved content. In the benchmark the rewrites were produced by a fixed model.",
  "Measured against it, the benchmark reports violations under framing, emotional anchoring and sensory distractors, and no significant violation under gender swap or evaluation order.",
]
related = ["reasoning-gauge-transformation", "quotient", "corruption-tensor", "salience-exploitation-hypothesis", "paraphrase-class"]
standing = "The principle is a posited norm. The violations and the two null results measured against it are benchmark findings on five models, tagged empirical."

[[entry]]
