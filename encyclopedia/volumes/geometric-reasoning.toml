  "No attention profile or salience differential is measured in the volume. The claim that the differentials follow the same ordering as the anomalies is asserted.",
  "Proposition 8.1 holds under the hypothesis and assumes the output is Lipschitz in the attention profile.",
]
related = ["reasoning-bond-invariance-principle", "reasoning-gauge-transformation", "attention", "corruption-tensor"]
