[[entry]]
id = "benchmark-scalar-irrecoverability"
kind = "result"
title = "Scalar Irrecoverability Theorem for benchmark profiles"
definition = "If the performance profiles of a set of models are mutually Pareto-non-dominated, so that each model beats each other on some dimension and loses on another, and each profile exceeds each other on at least two dimensions, then every weighted-sum score with non-negative weights that does not score all models equally ranks some model below another that it beats on a subset of at least two dimensions."
first_stated = "Theorem 13.1, `geometric-reasoning/chapters/ch13_five_convergent_measurements.md:449-457`, stated informally in Section 13.6, `geometric-reasoning/chapters/ch13_five_convergent_measurements.md:280-282`."
conditions = [
  "The hypothesis is that no profile dominates another. Where one model is at least as good on every dimension, a monotone score can respect the ordering.",
  "Tagged a conditional theorem. That each profile exceeds each other on at least two dimensions is a hypothesis of the theorem since the correction of 2026-11-26, and the volume says the measured profiles of the five models satisfy it.",
  "The volume states it in two formal forms, which Section 10.7.1 relates. Theorem 13.1 covers weighted sums, and Theorem A10.1 covers functions that are strictly monotone in each argument. The informal statement of Section 13.6 speaks of weighted composite scores.",
  "It concerns loss of ordering information between incomparable profiles. It does not say that a score chosen for a stated application is wrong for that application.",
]
known_as = "The fact that a partial order of Pareto-incomparable points has no order-preserving map to a line that reflects every coordinate. The volume attributes the theorem to Geometric Methods, Chapter 1."
related = ["pareto-dominance", "model-robustness-profile", "metacognitive-plane", "aggregation"]
standing = "A conditional theorem whose hypotheses include a property of the benchmark profiles. The crossing profiles it is applied to are measurements on five models."

[[entry]]
id = "fisher-combined-statistic"
kind = "instrument"
title = "Fisher-combined significance"
definition = "The statistic $-2 \\sum_i \\ln p_i$ over $k$ independent p-values, one per model. Under the null it follows a chi-squared distribution with $2k$ degrees of freedom. The volume converts the combined p-value to a sigma value with the standard normal quantile function and reports its headline results in this form."
first_stated = "Section 12.6.1, `geometric-reasoning/chapters/ch12_benchmarks_as_geometric_probes.md:340-344`, and the technical appendix, `geometric-reasoning/chapters/ch12_benchmarks_as_geometric_probes.md:483-495`."
conditions = [
  "The method is tagged established mathematics and assumes independent tests. The volume grants that the five models share training methods and that four share a lineage.",
  "The volume calls the combined test anti-conservative under positive dependence, so the true significance is lower than reported.",
  "Each cell holds 5 to 25 evaluations, so the per-model p-values that enter the sum may be imprecise.",
  "A combined sigma value is a statement about the five tested models taken together. The volume limits it to transformer language models from two laboratories.",
]
known_as = "Fisher's method for combining independent p-values."
related = ["p-value", "null-hypothesis", "multiple-comparisons", "independence", "reasoning-bond-invariance-principle"]
standing = "A standard statistical method. The five headline sigma values it produces are measured benchmark results whose independence assumption the volume itself says is imperfect."

[[entry]]
id = "group-consistent-augmentation"
kind = "instrument"
title = "Consistent group augmentation"
definition = "Training-data augmentation by a task's symmetry group in which the same group element is applied to every component of a training example. The task symmetry group is the largest group of input transformations that leave the ground-truth label unchanged. Applying the element to some components and not others is inconsistent augmentation."
first_stated = "Section 14.1, the consistency principle, `geometric-reasoning/chapters/ch14_from_theory_to_engineering.md:48-52`, and Definitions 14.1 and 14.2 with Proposition 14.1, `geometric-reasoning/chapters/ch14_from_theory_to_engineering.md:366-370`."
conditions = [
  "The symmetry group must be known for the task. The volume lists six groups for six task types, one of them the identity alone.",
  "The claim that training on the augmented set yields an invariant function holds in the limit of sufficient capacity and training.",
  "Definition 14.2 holds the label fixed while the group acts on the input, and the consistency principle and Definition 14.3 apply the same element to input and output together. The volume relates the two. The fixed-label form is the case in which the group acts trivially on labels.",
  "The volume reports parse rates and data expansion for its pipeline. It reports no measured gain in invariance or accuracy from the augmentation.",
]
known_as = "Data augmentation by a symmetry group, as in invariant and equivariant learning. The volume attributes the consistency principle to Geometric Methods, Chapter 13."
related = ["reasoning-gauge-transformation", "reasoning-bond-invariance-principle", "fine-tuning", "quotient"]
standing = "An engineering practice the volume implemented. The framing of it as restoring a broken gauge symmetry of a reasoning manifold is posited, and no before-and-after invariance measurement is given."

[examples]
reasoning-manifold = "In the volume's illustration a model's moral judgment is a point in a harm space of 7 dimensions, each rated 0 to 10, while the activations that produce it have thousands of dimensions."
heuristic-field = "On the half line of states x at or above 0 with the goal at 0 and unit cost per unit distance, the field h(x) = x gives h(3) = 3, and its negative gradient points toward 0."
heuristic-admissibility = "If the true cost from a state to the goal is 5, an estimate of 4 is admissible and an estimate of 6 is not."
false-termination-region = "With a stopping threshold of 1, a state where the heuristic reads 0.5 and the true distance to the goal is 3 lies in the region, since the search halts there 3 units short."
reasoning-geodesic-deviation = "In the volume's illustrative triage example the geodesic distance is about 1.8 nats and the corrupted trajectory's path length about 4.6 nats, so the deviation is 4.6 - 1.8 = 2.8 nats."
corruption-tensor = "With one perturbation direction whose column is (4, -2) and an intensity of 0.5, the first-order displacement of the judgment is (2, -1)."
sycophancy-parameter = "With truth and approval gradients of equal strength 1 and directly opposed, the critical value is 1 / (1 + 1) = 0.5, so a weight of 0.6 on approval leaves no net pull toward truth."
correction-discrimination-gap = "A system that flips on 60 percent of valid corrections and 10 percent of invalid ones has a gap of 0.60 - 0.10 = 0.50 and a sycophancy index of 0.10 / 0.60, about 0.17."
reasoning-basin-of-attraction = "For the function (x^2 - 1)^2 on the line, the minima are at -1 and 1, the basin of 1 is every x above 0, and its depth is the value 1 at x = 0 minus the value 0 at x = 1."
prompt-recovery-ceiling = "In the volume's formula a basin with half of its directions leading out and a threshold factor of 0.8 gives an escape probability of 0.5 times 0.8 = 0.4."
reasoning-gauge-transformation = "Swapping the genders of the actors in a scenario changes the description and not who did what to whom, so it is a gauge transformation, while changing what was done is not."
reasoning-bond-invariance-principle = "A system that rates a scenario at 40 on a 70-point harm scale and its euphemistic rewrite at 31 has an anomaly of magnitude 9 along that rewrite, where the principle requires 0."
salience-exploitation-hypothesis = "If a rewrite moves 0.1 of attention weight off one token and onto another, the salience differential is 0.1 + 0.1 = 0.2, and with a constant of 3 the bound on the anomaly is 0.6."
metacognitive-plane = "The volume's scores place one model at (0.094, 0.723), in Quadrant IV with a control bound of 0.094, and another at (0.700, 0.350), in Quadrant II with a bound of 0.350."
model-robustness-profile = "A model whose verdict is unchanged on 3 of 4 inputs under reframing and on 4 of 4 under reordering has the profile (0.75, 1.00), with verdict agreement as the consistency score."
robustness-adversarial-threshold = "With a baseline of 0.90 and a tolerance of 0.10, a performance of 0.85 at intensity 0.2 and 0.78 at intensity 0.4 puts the threshold between 0.2 and 0.4, and the next probe is at 0.3."
governance-margin = "In the volume's illustration a margin of 3.0 standardized units against a displacement of 4.2 means the trajectory crosses the safety boundary, by 1.2 if the displacement points straight at it."
corrigibility-basin = "A basin that reaches 2 units in the truth-consistent direction and 1 unit in the other has asymmetry 2, and the volume's approximation gives a discrimination gap of 1 - 1/2 = 0.5."
dual-binding-constraint = "With an AI governance robustness of 1.0, a coupling norm of 2 and an operator deviation of 0.3, the AI can absorb a heuristic perturbation smaller than 1.0 - 2 times 0.3 = 0.4."
benchmark-scalar-irrecoverability = "On the volume's two metacognition scores, (0.700, 0.350) averages 0.525 and (0.094, 0.723) averages 0.409, so the average ranks the first model higher although the second is better on the second score."
fisher-combined-statistic = "Two p-values of 0.01 give -2 times (ln 0.01 + ln 0.01) = 18.42, to be compared with a chi-squared distribution with 4 degrees of freedom."
group-consistent-augmentation = "The symmetry group of a square grid has 8 elements, 4 rotations and 4 reflections, so one input and output grid pair yields 8 consistent variants when each element is applied to both grids."
