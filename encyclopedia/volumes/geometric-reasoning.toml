[[entry]]
id = "metacognitive-plane"
kind = "concept"
title = "Metacognitive plane"
definition = "The unit square of points $(M_3, M_4)$, where $M_3$ is the self-monitoring score and $M_4$ is the strategy-selection or effort-scaling score. Scores above 0.5 on both axes are Quadrant I, full control. High $M_3$ alone is Quadrant II, aware but passive. High $M_4$ alone is Quadrant IV, reactive but blind."
first_stated = "Definition 9.2, `geometric-reasoning/chapters/ch09_metacognition_as_search_control.md:444-458`, introduced in Section 9.9, `geometric-reasoning/chapters/ch09_metacognition_as_search_control.md:325-339`."
conditions = [
  "The plane and its quadrants are tagged a modeling axiom. The scores placed in it are benchmark measurements on five models.",
  "The volume bounds effective control by the smaller of the two scores, treating self-monitoring as a sensor and strategy selection as an actuator.",
  "The volume states that the two scores are strongly anti-correlated in the tested models. The five pairs in its Table 7.2 give a correlation of about -0.98, so the axes are not independent in its data.",
  "Four of the five tested models lie in Quadrants II and IV. The fifth scores 0.450 and 0.488 and lies just inside Quadrant III under the 0.5 cut.",
]
related = ["prompt-recovery-ceiling", "benchmark-scalar-irrecoverability", "correlation", "expected-calibration-error", "calibration"]
standing = "A posited two-axis diagnostic filled with measured scores. The claim that Quadrant I is empty agrees with the tabulated scores. Since the correction of 2026-11-26 the volume no longer calls the axes independent and places one model in Quadrant III."

