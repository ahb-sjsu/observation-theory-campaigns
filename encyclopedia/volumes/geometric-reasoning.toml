[[entry]]
id = "governance-margin"
kind = "concept"
title = "Governance margin"
definition = "The smallest geodesic distance, over the whole of a reasoning trajectory, from the trajectory to the safety boundary that separates permitted from forbidden states. It is positive when the trajectory stays inside the permitted region, zero when it touches the boundary, and negative when it enters the forbidden region."
first_stated = "Definition 11.3, `geometric-reasoning/chapters/ch11_alignment_as_heuristic_shaping.md:58-62`, and Definition A11.1, `geometric-reasoning/chapters/ch11_alignment_as_heuristic_shaping.md:452-456`."
conditions = [
  "Tagged a modeling axiom. It assumes a safety boundary that is a codimension-1 submanifold of the reasoning manifold and a metric to measure distance to it.",
  "It is a property of the whole path and not of the output alone. The volume calls this path governance.",
  "Under a bounded perturbation of the heuristic the margin is said to shrink at most linearly, by a Lipschitz constant times the perturbation size times the trajectory duration. Governance robustness is the largest perturbation that leaves the margin positive.",
  "No margin is measured. The numbers in the volume's triage example are illustrative.",
]
related = ["dual-binding-constraint", "corrigibility-basin", "geodesic-distance", "margin", "reasoning-manifold"]

[[entry]]
