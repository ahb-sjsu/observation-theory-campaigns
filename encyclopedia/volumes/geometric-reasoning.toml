kind = "concept"
title = "Salience Exploitation Hypothesis"
definition = "The conjecture that a gauge transformation breaks a model's invariance exactly when it changes how strongly input features attract attention, with a violation that grows with the salience differential. The differential is the sum of absolute changes in attention weight over input tokens, and the volume bounds the anomaly by a constant times it."
first_stated = "Section 8.5, `geometric-reasoning/chapters/ch08_gauge_invariance_and_symmetry.md:160-162`, with Proposition 8.1 at `geometric-reasoning/chapters/ch08_gauge_invariance_and_symmetry.md:493-501`."
conditions = [
