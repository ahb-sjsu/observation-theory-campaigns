first_stated = "Definition 11.5, `geometric-reasoning/chapters/ch11_alignment_as_heuristic_shaping.md:151-153`, and Definitions A11.2 and A11.3, `geometric-reasoning/chapters/ch11_alignment_as_heuristic_shaping.md:472-487`."
