[[entry]]
id = "cognitive-profile-tensor"
kind = "concept"
title = "cognitive profile tensor"
definition = "The vector of a system's scores on the benchmark's 21 subtasks, each between 0 and 1, written $C(S) = (c_1, ..., c_{21})$. The volume treats it as the object that a composite score contracts to one number."
first_stated = "Definition 1.1, `geometric-cognition/chapters/ch01_iq_trap.md:59-63`."
conditions = [
  "The volume calls the 21 components a simplification of a true profile that has far more dimensions.",
  "The subtasks come from the five Measuring AGI tracks. The ledger holds the claim that those tracks are dimensions of cognition at posited (row GC-1).",
  "The scores are for five language models in one experimental cycle, and the primary run records are not in the repository.",
]
related = ["scalar-irrecoverability-theorem", "cognitive-signature", "vector", "contraction"]

[[entry]]
id = "scalar-irrecoverability-theorem"
kind = "result"
title = "Scalar Irrecoverability Theorem"
definition = "For any map from profiles with two or more components to a single real number, each value in the range has a continuum of distinct profiles in its preimage. No function of the score can therefore return the profile."
first_stated = "Theorem 1.1, `geometric-cognition/chapters/ch01_iq_trap.md:120-126`, with the formal version and proof in Technical Appendix 1A, `geometric-cognition/chapters/ch01_iq_trap.md:352-366`."
conditions = [
  "The formal version assumes the contraction is a continuous surjection and the profile has at least two components.",
  "The theorem says the profile cannot be recovered from the score. The further claim that the discarded structure determines how a system reasons is a separate ledger row held at posited (GC-10).",
  "The empirical demonstration of Section 1.5 uses the five benchmark models, whose run records are not in the repository.",
]
standing = "The ledger grades the theorem proved (row GC-9) and describes it as linear algebra that holds whatever the axes mean."
known_as = "The failure of injectivity for a continuous map from two or more dimensions to one. The volume names Spearman's g, IQ and benchmark accuracy as instances of the contraction."
related = ["cognitive-profile-tensor", "contraction", "cognitive-signature", "capability-frontier-convergence"]

[[entry]]
id = "cognitive-manifold"
kind = "concept"
title = "cognitive manifold"
definition = "The set of cognitive states a system actually visits, hypothesized to form a smooth submanifold $M$ of the activation space whose dimension is far below the number of units. Its dimension is the number of independent ways the cognitive state can vary."
first_stated = "Definition 3.3, `geometric-cognition/chapters/ch03_cognitive_manifold.md:64-68`, with the formal definition in Technical Appendix 3A, `geometric-cognition/chapters/ch03_cognitive_manifold.md:333-343`."
conditions = [
  "It is a hypothesis, and the volume calls it a strong claim. The ledger holds the row that cognitive states form a manifold on which distance is meaningful at posited (GC-2).",
  "The formal definition adds a Riemannian metric and a smooth embedding. It requires each task trajectory in activation space to stay within a small distance of a curve on the manifold.",
  "Chapter 17 leaves open whether the manifold is Riemannian or Finsler and what its dimension is for human cognition.",
]
known_as = "The manifold hypothesis of machine learning, which the volume cites from Bengio and colleagues, Tenenbaum and colleagues, and Roweis and Saul."
related = ["manifold", "intrinsic-dimension", "attention-metric", "cognitive-heuristic-field", "cognitive-representation-posit"]

[[entry]]
id = "cognitive-heuristic-field"
kind = "concept"
title = "heuristic field"
definition = "A smooth real-valued function $h$ on the cognitive manifold that assigns each state an estimate of the cost of reaching the goal state, approximating the geodesic distance to it. System 1 processing follows its negative gradient."
first_stated = "Definition 3.7, `geometric-cognition/chapters/ch03_cognitive_manifold.md:164-168`."
conditions = [
  "The field is an estimate and can be wrong. A local minimum of $h$ far from the true goal traps gradient-following search, which the volume calls premature convergence.",
  "The volume reads framing, anchoring and sycophancy as corruption of the field. Those readings are interpretations on benchmark axes, and the ledger holds each interpretation at posited.",
  "Chapter 17 lists measuring the field from neural activations as an open question.",
]
known_as = "The heuristic function of A* search, which the volume's notation table gives as $f(x) = g(x) + h(x)$."
related = ["cognitive-manifold", "curvature-triggered-transition", "geodesic-distance", "gradient", "geometric-defect-taxonomy"]

[[entry]]
id = "attention-metric"
kind = "concept"
title = "attention metric"
definition = "A positive-definite symmetric bilinear form $g$ on each tangent space of the cognitive manifold whose components are set by attention allocation. A dimension with a larger attention weight has higher resolution, so states that differ along it are farther apart and easier to tell apart."
first_stated = "Definition 4.1, `geometric-cognition/chapters/ch04_attention_metric.md:51-55`, with the weights written out at `geometric-cognition/chapters/ch04_attention_metric.md:65-67`."
conditions = [
  "The ledger holds the claim that attention is the metric at posited (GC-3).",
  "Under divided attention a fixed budget W is spread over k targets, so each target receives W/k and less resolution than under selective attention.",
  "The volume reads benchmark scores as constraints on the metric through a model. Its eccentricity estimates of about 4.2 for Claude and 1.1 for Gemini 3 Flash assume a harmonic mean of per-dimension performance and a sigmoid in the attention weight.",
]
known_as = "A Riemannian metric tensor. Section 4.11 of the volume connects it to Fisher information."
related = ["metric", "positive-definite", "cognitive-manifold", "working-memory-tangent-space", "mahalanobis-distance"]

[[entry]]
id = "working-memory-tangent-space"
kind = "concept"
title = "working memory as tangent space"
definition = "Working memory at a cognitive state is identified with the tangent space of the cognitive manifold at that state, equipped with the attention metric. Its effective capacity is the participation ratio of the metric eigenvalues, the square of their sum divided by the sum of their squares."
first_stated = "Definition 5.1, `geometric-cognition/chapters/ch05_working_memory.md:64-64`, and Definition 5.2, `geometric-cognition/chapters/ch05_working_memory.md:85-91`."
conditions = [
  "The ledger holds the identification of working memory with the tangent space at posited (GC-4).",
  "The effective dimension lies between 1, when one eigenvalue dominates, and the manifold's dimension, when all eigenvalues are equal.",
  "The estimates from the E4 subtask, about 10 to 11 effective dimensions for Gemini 2.0 Flash and at least 16 for Gemini 3 Flash, assume a sigmoid accuracy model and a demand of about two dimensions per party.",
  "Logarithmic scaling of the effective dimension with model size is offered as the simplest hypothesis, and Section 5.15 lists its consequences as predictions.",
]
known_as = "The participation ratio. The volume sets the capacity beside the item limits of Miller and of Cowan."
related = ["attention-metric", "cognitive-manifold", "effective-rank", "cognitive-control-tensor"]

[[entry]]
id = "cognitive-control-tensor"
kind = "concept"
title = "control tensor"
definition = "A (2,0)-tensor $C$ at each cognitive state that gives, for each direction of perturbation and each direction of response, the control system's capacity to manage the interaction. Its four named components are cognitive flexibility, inhibitory control, counterfactual sensitivity and working memory management, sampled by subtasks E1 to E4."
first_stated = "Definition 6.4, `geometric-cognition/chapters/ch06_executive_functions.md:185-190`."
conditions = [
  "The ledger holds executive function as search control over the manifold at posited (GC-5).",
  "The benchmark recovers four numbers, one per subtask. The worked diagonal form ignores interactions between the functions and assumes the four subtasks are orthogonal, which the volume calls a crude approximation.",
  "The formal definition requires nonnegative components, a bounded trace and smooth variation with the state.",
]
related = ["displacement-recovery-dissociation", "metacognitive-recovery-ceiling", "scalar-irrecoverability-theorem", "working-memory-tangent-space"]

