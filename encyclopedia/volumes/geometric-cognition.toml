[examples]
cognitive-profile-tensor = "In the volume's Chapter 1 table Claude scores 1.000 on L2 and 0.571 on A4 while Gemini 2.5 Pro scores 0.720 and 0.790, so neither profile is above the other on both components."
scalar-irrecoverability-theorem = "The volume's illustration has three models with scores (0.95, 0.60, 0.80, 0.70, 0.85), (0.70, 0.85, 0.75, 0.80, 0.80) and (0.80, 0.75, 0.78, 0.77, 0.80). Each sums to 3.90, so all three composites are 0.78 and the score cannot say which profile produced it."
cognitive-manifold = "The volume's analogy is a body with about 244 joints at six degrees of freedom each, which has 6 times 244 = 1464 configuration dimensions, while walking varies in about two, the phase of the gait cycle and the speed."
cognitive-heuristic-field = "On a line with the goal at 0 and $h(x) = |x|$, the state 3 has estimated cost 3 and the negative gradient points toward 0. If $h$ also had a dip at 5, a gradient-following search started at 6 would stop at 5 and never reach the goal."
attention-metric = "With attention weight 4 on color and 1 on shape and no cross terms, a unit step along color has squared length 4 and a unit step along shape has squared length 1. On the A4 divided attention test the volume prints 0.571 for Claude and 1.000 for Gemini 3 Flash, a gap of 0.429."
working-memory-tangent-space = "Metric eigenvalues 3 and 1 give $(3 + 1)^2 / (9 + 1) = 1.6$ effective dimensions, the same value Section 10.11 of the volume computes for weights 0.75 and 0.25."
cognitive-control-tensor = "The volume's diagonal for Claude is (0.673, 0.492, 0.562, 0.886). Its anisotropy is 0.886 / 0.492 = 1.80, the largest of the five models, and for Gemini 2.0 Flash it is 0.710 / 0.500 = 1.42."
displacement-recovery-dissociation = "The volume prints for Claude the largest displacement statistic, t = 5.10, and the lowest recovery, 0.20, and for Gemini 2.0 Flash t = 3.80 and recovery 0.73. The products in Technical Appendix 11A are 5.10 times 0.20 = 1.02 and 3.80 times 0.73 = 2.77."
metacognitive-recovery-ceiling = "The A1 warning recoveries the volume prints are about 42, 38, 40, 35 and 37 percent, whose mean is 192 / 5 = 38.4 percent. The E2 mean is printed as 38 percent, with single models from 20 to 73 percent."
curvature-triggered-transition = "In the volume's illustration a framing perturbation of 0.1 that produces a displacement of 0.3 is an amplification of 3.0, and over five reasoning steps $e^{5s} = 3$ gives $s = (ln 3)/5$, about 0.22, so the curvature magnitude is about 0.048. The inputs 0.1, 0.3 and 5 are modelled values."
deliberative-recruitment-hypothesis = "In the self-test the synthetic rank budget observer scores 0.988 in the high role and 0.691 in the low role at the largest separation, a difference of 0.297, while the uniform noise observer scores 0.986 in both, a difference of 0.000. These are simulated observers and not participants."
judgment-gauge-invariance = "If a scenario's seven harm scores sum to 30 and its euphemistic rewrite sums to 18, the harm conservation violation is 18 - 30 = -12 and the judgment is not invariant. The volume prints euphemistic drifts of the total from -9.1 to -14.1."
cognitive-framing-displacement = "For Gemini 2.5 Pro the volume prints a euphemistic drift of -14.1 on the 70-point scale against a control drift of 4.2. 14.1 / 70 is about 20 percent of the scale, and 14.1 / 4.2 is about 3.4 times the control."
sycophancy-gradient = "The volume prints for Gemini 2.0 Flash a flip on 33 percent of invalid corrections and 71 percent of valid ones. 33 / 71 is about 0.46 where the volume prints an index of 0.472, and the gap 0.71 - 0.33 is 0.38 where it prints 0.377, the printed rates being rounded."
metacognitive-empty-quadrant = "With the appendix's threshold of 0.25, Gemini 2.5 Pro at (0.500, 0.000) is in Quadrant II and Gemini 2.0 Flash at (0.042, 0.827) is in Quadrant IV. Their differences are 0.458 on M3 and -0.827 on M4, as the volume prints."
developmental-topological-transition = "The volume gives the sensorimotor manifold about 3 to 5 dimensions. Adding one symbolic dimension to a 4-dimensional patch gives 5 dimensions, and manifolds of different dimension are not homeomorphic, which is the volume's reason for the first transition."
geometric-defect-taxonomy = "The volume's inflation factor is the estimated cost divided by the true cost. A true cost of 2 estimated as 6 gives a factor of 3, far above the value near 1 the volume assigns to healthy cognition, which is its picture of anxiety."
cognitive-signature = "Signatures (1, 0) and (0, 1) have the same mean, 0.5, and a distance of the square root of 2, about 1.41. The volume's matrix prints 0.58 for Gemini 3 Flash and Gemini 2.5 Flash, its closest pair, and 1.03 for Claude and Gemini 2.0 Flash, its farthest."
capability-frontier-convergence = "The composites the volume prints are 0.72, 0.70, 0.68, 0.66 and 0.63. Their range is 0.72 - 0.63 = 0.09 and their mean is 3.39 / 5 = 0.678."
cognitive-representation-posit = "The 15.3 sigma framing statistic is ledger row GC-11-S, graded exploratory. Its reading as a framing effect in a social-cognitive dimension is row GC-11-I, which uses GC-1 and so stays at posited. The ledger counts 21 posited rows of 39."
observer-vacuity-proposition = "Suppose an agent picks a from the menu {a, b} and b from the menu {a, b, c}. Setting the admissible set to {a} on the first menu and {b} on the second reproduces the record under any metric and budget, so the fit excludes nothing."
budget-reversal-gate-c1 = "With agreement chance p = 0.992 the identity gives a trading reversal rate of $p^2 + (1-p)^2$ = 0.9841, a within-subspace rate of $2p(1-p)$ = 0.0159 and a contrast of $(2p-1)^2$ = 0.9683, which is the pilot's value with nothing left for the budget to explain."
