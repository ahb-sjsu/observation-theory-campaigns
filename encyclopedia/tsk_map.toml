# From TSK to the encyclopedia. One row per index term of Tan, Steinbach, Karpatne, and
# Kumar, Introduction to Data Mining, second edition, as a student meets it, with the
# entries to read and the chapter of Data Mining as Observation that takes the term up.
# Curated by hand. `tsk` is the term as TSK names it, `where` its TSK chapter or section,
# `entries` the ids to read in order, and `chapter` the book chapter.

